id = "plm-products"
title = "Products"
summary = "The assemblies the practice makes, and the changes to them in progress."

[[widget]]
kind = "table"
title = "Assemblies"
type = "Part"
where = "record.bom and record.status != 'obsolete'"
columns = ["code", "name", "revision", "status", "held_by"]

[[widget]]
kind = "board"
title = "Change orders"
type = "ChangeOrder"
group_by = "status"
columns = ["title", "raised"]

[[widget]]
kind = "table"
source = "items"
title = "Changes waiting for the board"
workflow = "plm-change"
status = ["open", "claimed"]
