# A product: something the practice makes, assembles or supplies. Products sit in families (a tree), so a product
# line is a top of the tree with its products under it.
id = "Product"
label = "Product"
plural = "Products"
data_class = "products"
title = "{number} {name}"
parent = "family"
flag = "status"
order = 30
summary = "Something the practice makes, assembles or supplies, at a revision, with its parts and specifications."

[navigator]
tops = "Product lines"
hide = ["obsolete"]

[[field]]
name = "number"
label = "Item number"
required = true
max_length = 40

[[field]]
name = "name"
required = true
max_length = 200

[[field]]
name = "family"
label = "Part of"
type = "reference"
target = ["Product"]
rel = "family"
help = "the product line or family it belongs to; leave it empty for a product line"

[[field]]
name = "kind"
type = "choice"
choices = ["product-line", "kit", "device", "supply", "compounded", "software", "service"]

[[field]]
name = "revision"
type = "number"
help = "set by change orders: a released revision is never changed in place"

[[field]]
name = "status"
type = "choice"
choices = ["concept", "design", "released", "obsolete"]

[[field]]
name = "owner"
type = "member"
help = "the product owner"

[[field]]
name = "supplier"
max_length = 200

[[field]]
name = "description"
type = "markdown"

[[field]]
name = "components"
label = "Made of"
type = "list"

[[field]]
name = "component"
label = "Part"
path = "components.*"
type = "reference"
target = ["Product"]
rel = "made-of"

[[field]]
name = "specs"
label = "Specifications"
type = "list"

[[field]]
name = "spec"
label = "Specification"
path = "specs.*"
type = "reference"
target = ["Document"]
rel = "specified-by"

[[field]]
name = "obsolete_reason"
label = "Why it is obsolete"
type = "text"

[lifecycle]
field = "status"
initial = "concept"
locked = ["released", "obsolete"]   # a released revision changes only through a change order

[[lifecycle.transition]]
from = ["concept"]
to = "design"
label = "Start design"

[[lifecycle.transition]]
from = ["design"]
to = "released"
by = "workflow"            # a change order's release
label = "Release"

[[lifecycle.transition]]
from = ["released"]
to = "design"
by = "workflow"            # a change order opens the next revision
label = "Open a new revision"

[[lifecycle.transition]]
from = ["concept", "design", "released"]
to = "obsolete"
label = "Make obsolete"
asks = ["obsolete_reason"]
requires = ["obsolete_reason"]

[[signature]]
meaning = "I release this product at this revision"
roles = ["product-owner"]
states = ["released"]
