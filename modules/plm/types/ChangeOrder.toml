# A change order: why parts change, which parts (inventory's) and documents it changes, and (when it came from one)
# the CAPA it answers. It names the plm-change workflow, which walks its status from draft to implemented: making one
# starts it, and a change order returned or rejected and revised is walked again from draft. Approved, its parts are
# held in draft for their next revision and its documents are revised; once the documents are all approved again it
# waits to be released (releasing), and releasing puts its parts back in use at the next revision.
id = "ChangeOrder"
key = "ECO"
label = "Change order"
plural = "Change orders"
data_class = "products"
date = "raised"
flag = "status"
order = 31
workflow = { id = "plm-change", when = "record.status in ['draft', 'review', 'approved', 'releasing', 'rejected']" }
summary = "A change to parts in use and their documents: reviewed, made at new revisions, released."

[[field]]
name = "title"
required = true
max_length = 200

[[field]]
name = "reason"
label = "Why"
type = "markdown"
required = true

[[field]]
name = "raised"
type = "date"

[[field]]
name = "owner"
type = "member"

[[field]]
name = "opened"
label = "Parts and documents opened"
type = "boolean"
by = "workflow"

[[field]]
name = "status"
type = "choice"
choices = ["draft", "review", "approved", "releasing", "implemented", "rejected", "cancelled"]

[[field]]
name = "parts"
label = "Parts changed"
type = "list"
help = "the parts (assemblies included) it changes: held in draft once it is approved, released at their next revision"

[[field]]
name = "part"
label = "Part changed"
path = "parts.*"
type = "reference"
target = ["Part"]
rel = "changes"

[[field]]
name = "documents"
label = "Documents changed"
type = "list"

[[field]]
name = "document"
label = "Document changed"
path = "documents.*"
type = "reference"
target = ["Document"]
rel = "affects"

[[field]]
name = "capa"
label = "From CAPA"
type = "reference"
target = ["CAPA"]
rel = "answers"

[[field]]
name = "impact"
label = "Impact"
type = "markdown"
help = "what else it touches: stock on hand, assemblies the parts are used in, training, suppliers, patients already given the product"

[[field]]
name = "decision"
label = "Board's note"
type = "text"
by = "workflow"   # the change board's (or product owner's) comment on its decision, kept on the change order
show = true

[[field]]
name = "cancel_reason"
label = "Why it was cancelled"
type = "text"

[lifecycle]
field = "status"
initial = "draft"
abandoned = { "review" = "draft", "approved" = "draft", "releasing" = "draft" }   # work cancelled part way: back to its author
locked = ["review", "approved", "releasing", "implemented", "cancelled"]   # what was reviewed is what is released

[[lifecycle.transition]]
from = ["draft"]
to = "review"
label = "Send for review"
requires = ["reason"]

# Approving, rejecting, releasing and returning it are the plm-change workflow's edges; only the moves people make by
# hand are listed here. Where cancelled work leaves it is abandoned, above.

[[lifecycle.transition]]
from = ["rejected"]
to = "draft"
label = "Revise"

[[lifecycle.transition]]
from = ["draft", "rejected"]   # not while the board has it: its review ends it
to = "cancelled"
label = "Cancel"
asks = ["cancel_reason"]
requires = ["cancel_reason"]

# No [[signature]]: the plm-change workflow's review gate is where the change board signs its approval; a second
# meaning on the record only said the same thing again.
