id = "plm-change"
title = "Change a product"
summary = """The change board reviews a change order and signs it. An approved change opens each product and document it
names at the next revision; the documents go through document control again; once every one is approved, a product
owner signs the release and the products are released at their new revision."""
record = "ChangeOrder"

[trigger]
event = "record.transitioned:ChangeOrder"
when = "record.status == 'review'"

[[steps]]
id = "review"
title = "Review the change"
kind = "gate"
role = "change-board"
signer = "person"
not_by = ["record.editors"]   # whoever wrote the change does not approve it
meaning = "I have reviewed this change order"
outcomes = ["approve", "reject"]
context = ["record:products", "record:documents", "record:quality"]
due = "5d"
escalate_to = "change-board"
instructions = """Read why it changes and what else it touches. Approve it, and its products and documents open at
their next revision; or reject it with what is missing, and it goes back to its author."""

[[steps]]
id = "reject"
title = "Return the change to its author"
kind = "automation"
after = ["review"]
when = "review.outcome == 'reject'"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
status = "rejected"

[[steps]]
id = "approve"
title = "Record the approval"
kind = "automation"
after = ["review"]
when = "review.outcome == 'approve'"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
status = "approved"

[[steps]]
id = "open-products"
title = "Open each released product at its next revision"
kind = "automation"
after = ["approve"]
when = "record.opened != true"   # a change returned and sent again does not open its products a second time
action = "record.update"
for_each = "{{record.products}}"
where = "each_record.status == 'released'"   # one still in concept or design is changed as it is
[steps.params]
ref = "{{each}}"
increment = ["revision"]
[steps.params.set]
status = "design"

[[steps]]
id = "revise-documents"
title = "Open each approved document for revision"
kind = "automation"
after = ["approve"]
when = "record.opened != true"   # nor revise its documents again
action = "record.update"
for_each = "{{record.documents}}"
where = "each_record.status == 'approved'"
[steps.params]
ref = "{{each}}"
increment = ["revision"]
[steps.params.set]
status = "draft"   # its author revises it and sends it for review (dms); staff keep reading the approved revision

[[steps]]
id = "mark-opened"
title = "Note that the products and documents are open"
kind = "automation"
after = ["open-products", "revise-documents"]
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
opened = true

[[steps]]
id = "documents-approved"
title = "Wait until every changed document is approved"
kind = "wait"
role = "document-controller"
after = ["approve", "mark-opened"]   # on a second pass nothing is opened again, and this still waits
for_each = "{{record.documents}}"
until = "each_record.status == 'approved' or each_record.status == 'obsolete'"

[[steps]]
id = "release"
title = "Release the new revisions"
kind = "gate"
role = "product-owner"
signer = "person"
not_by = ["review"]    # the board member who approved it is not also the one who releases it
meaning = "I release these products at their new revision"
meanings = { return = "I return this change order without releasing it" }
outcomes = ["release", "return"]
after = ["documents-approved"]
context = ["record:products", "record:documents"]
due = "7d"
escalate_to = "product-owner"
instructions = """Check each product's parts and specifications are right at the new revision: the documents are
approved again. Releasing makes the new revision the one in use. Return it, and the change order goes back to its author
with the products still in design."""

[[steps]]
id = "release-products"
title = "Release the products"
kind = "automation"
after = ["release"]
when = "release.outcome == 'release'"
action = "record.update"
for_each = "{{record.products}}"
where = "each_record.status == 'design'"
[steps.params]
ref = "{{each}}"
[steps.params.set]
status = "released"

[[steps]]
id = "returned"
title = "Return the change to its author"
kind = "automation"
after = ["release"]
when = "release.outcome == 'return'"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
status = "draft"

[[steps]]
id = "implemented"
title = "Close the change order"
kind = "automation"
after = ["release-products"]
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
status = "implemented"
