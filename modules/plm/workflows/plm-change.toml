id = "plm-change"
title = "Change parts"
summary = """A change order from draft to released: its author writes it and sends it for review; the change board
reviews and signs it. An approved change holds each part it names in draft (stock and builds keep using the revision
last released) and opens each document it names for revision; the documents go through document control again; once
every one is approved, a product owner signs the release and the parts go back in use at their next revision. Rejected
or returned, it goes back to its author and the next pass walks it again."""
record = "ChangeOrder"

# The ChangeOrder type names this workflow: making a change order starts it, and its status is this work's position.
# Written as the change order's states and the edges between them (practicehub/states.py), listed in the order a pass
# goes through them. One pass is one run: an edge back to an earlier state (rejected, returned) ends the run there,
# the next run walks the next pass, and who reviewed it before still does not release it. Nothing else starts it.

[start]
to = "draft"
label = "Raised"

# a pass may start rejected (with its author), under review, approved or to release: it is walked from there
[[start.do]]
id = "from-rejected"
title = "Walk it from rejected"
when = "record.status == 'rejected'"
to = "rejected"

[[start.do]]
id = "from-review"
title = "Walk it from review"
when = "record.status == 'review'"
to = "review"

[[start.do]]
id = "from-approved"
title = "Walk it from approved"
when = "record.status == 'approved'"
to = "approved"

[[start.do]]
id = "from-releasing"
title = "Walk it from to release"
when = "record.status == 'releasing'"
to = "releasing"

[[state]]
id = "rejected"
label = "Rejected"
tone = "attention"

[[state.work]]
id = "revise"
title = "Revise the change, or cancel it"
kind = "wait"
until = "record.status != 'rejected'"   # revised (back to draft), or cancelled
instructions = """The board rejected it: its note says what is missing. Revise it on its page and send it again, or
cancel it."""

[[edge]]
id = "revised"
label = "Revise"
from = "rejected"
to = "draft"
when = "record.status == 'draft'"

[[edge]]
id = "cancel-rejected"
label = "Cancel"
from = "rejected"
to = "cancelled"
when = "record.status == 'cancelled'"

[[edge.do]]
id = "let-go-rejected"
title = "Let go of the parts it holds, as they were"
action = "plm.unhold"

[[state]]
id = "draft"
label = "Draft"
tone = "active"

[[state.work]]
id = "submit"
title = "Write the change and send it for review"
kind = "wait"
until = "record.status != 'draft'"   # sent for review (or cancelled)
instructions = """Say why it changes, which parts and documents it changes and what else it touches, then send it
for review on its page. Rejected, the board's note says what is missing: revise it and send it again, or cancel it.
Whoever writes it does not review it."""

[[edge]]
id = "sent"
label = "Send for review"
from = "draft"
to = "review"
when = "record.status == 'review'"

[[edge]]
id = "cancel"
label = "Cancel"
from = "draft"
to = "cancelled"
when = "record.status == 'cancelled'"

[[edge.do]]
id = "let-go"
title = "Let go of the parts it holds, as they were"   # returned at release, it still holds them
action = "plm.unhold"

[[state]]
id = "review"
label = "Review"
tone = "attention"

[[state.work]]
id = "review"
title = "Review the change"
kind = "gate"
role = "change-board"
signer = "person"
not_by = ["record.editors"]   # whoever wrote the change does not approve it
meaning = "I approve this change order"
meanings = { reject = "I reject this change order and return it to its author" }
context = ["record:products", "record:inventory", "record:documents", "record:quality"]
due = "5d"
escalate_to = "change-board"
instructions = """Read why it changes and what else it touches. Approve it, and its parts are held in draft for their
next revision and its documents open for revision; or reject it with what is missing, and it goes back to its author. Your comment is written on the
change order as the board's note."""

[[edge]]
id = "approve"
label = "Approve"
from = "review"
to = "approved"

# The parts are held first: a part another change holds (or one in its own review) refuses the approval, holding
# nothing, and the change goes back to its author with why. Held, a part waits in draft for this change alone.
[[edge.do]]
id = "hold"
title = "Hold each part for its next revision"
action = "plm.hold"   # holds each part it names; lets go, as they were, of any it held and no longer names

[[edge.do]]
id = "approve"
title = "Record the approval"
when = "hold.ok"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Approved: {{review.comment}}"

[[edge.do]]
id = "not-free"
title = "Write why on the change: a part it names is not free to change"
when = "not hold.ok"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Not approved: {{hold.problem}}"

[[edge.do]]
id = "refused"
title = "Return the change to its author"
when = "not hold.ok"
after = ["not-free"]
to = "rejected"               # back with its author: the next pass is the next run's

[[edge.do]]
id = "revise-documents"
title = "Open each approved document for revision"
when = "hold.ok and record.opened != true"   # a change returned and sent again does not revise its documents again
action = "record.update"
for_each = "{{record.documents}}"
where = "each_record.status == 'approved'"
[edge.do.params]
ref = "{{each}}"
[edge.do.params.set]
status = "draft"   # a move the document's own workflow waits on: its author revises it and sends it for review

[[edge.do]]
id = "mark-opened"
title = "Note that the documents are open"
when = "hold.ok and revise-documents.each != null"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
opened = true

[[edge]]
id = "reject"
label = "Reject"
from = "review"
to = "rejected"               # back with its author: the next pass is the next run's

[[edge.do]]
id = "reject"
title = "Return the change to its author"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Rejected: {{review.comment}}"

[[state]]
id = "approved"
label = "Approved"
tone = "active"

[[state.work]]
id = "documents-approved"
title = "Wait until every changed document is approved"
kind = "wait"
role = "document-controller"
for_each = "{{record.documents}}"
until = "each_record.status == 'approved' or each_record.status == 'obsolete'"
instructions = """Each changed document is listed with where it is and who holds it: its owner revises it and a
document controller approves it, in its own work."""

[[edge]]
id = "documents-done"
label = "Documents approved"
from = "approved"
to = "releasing"

[[state]]
id = "releasing"
label = "To release"
tone = "attention"

[[state.work]]
id = "release"
title = "Release the new revisions"
kind = "gate"
role = "product-owner"
signer = "person"
# the board member who approved it (in this pass or one before) does not release it, nor whoever revised a part it
# names since that part was last in use: the release is a second person's check of the new revision
not_by = ["review", "record.parts.editors"]
meaning = "I release these parts at their new revision"
meanings = { return = "I return this change order without releasing it" }
context = ["record:products", "record:inventory", "record:documents"]
due = "7d"
escalate_to = "product-owner"
instructions = """Check each part's bill of materials and specifications are right at the new revision: the
documents are approved again. Releasing puts the new revision in use, for stock and builds. Return it, and the change
order goes back to its author with the parts still held in draft."""

[[edge]]
id = "release"
label = "Release"
from = "releasing"
to = "implemented"

[[edge.do]]
id = "release-parts"
title = "Put the parts back in use at their next revision"
action = "plm.release"   # the parts this change holds: in use, revision up by one

[[edge]]
id = "return"
label = "Return to its author"
from = "releasing"
to = "draft"                  # the next pass is the next run's

[[edge.do]]
id = "returned"
title = "Return the change to its author"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Returned at release: {{release.comment}}"

[[state]]
id = "implemented"
label = "Implemented"
tone = "done"

[[state]]
id = "cancelled"
label = "Cancelled"
tone = "done"
