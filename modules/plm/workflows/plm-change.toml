id = "plm-change"
title = "Change a product"
summary = """A change order from draft to released: its author writes it and sends it for review; the change board
reviews and signs it. An approved change opens each product and document it names at the next revision; the documents
go through document control again; once every one is approved, a product owner signs the release and the products are
released at their new revision. Rejected or returned, it goes back to its author and the next pass walks it again."""
record = "ChangeOrder"

# The ChangeOrder type names this workflow: making a change order starts it, and its status is this work's position.
# Written as the change order's states and the edges between them (practicehub/states.py), listed in the order a pass
# goes through them. One pass is one run: an edge back to an earlier state (rejected, returned) ends the run there,
# the next run walks the next pass, and who reviewed it before still does not release it. Nothing else starts it.

[start]
to = "draft"
label = "Raised"

# a pass may start rejected (with its author), under review, approved or to release: it is walked from there
[[start.do]]
id = "from-rejected"
title = "Walk it from rejected"
when = "record.status == 'rejected'"
to = "rejected"

[[start.do]]
id = "from-review"
title = "Walk it from review"
when = "record.status == 'review'"
to = "review"

[[start.do]]
id = "from-approved"
title = "Walk it from approved"
when = "record.status == 'approved'"
to = "approved"

[[start.do]]
id = "from-releasing"
title = "Walk it from to release"
when = "record.status == 'releasing'"
to = "releasing"

[[state]]
id = "rejected"
label = "Rejected"
tone = "attention"

[[state.work]]
id = "revise"
title = "Revise the change, or cancel it"
kind = "wait"
until = "record.status != 'rejected'"   # revised (back to draft), or cancelled
instructions = """The board rejected it: its note says what is missing. Revise it on its page and send it again, or
cancel it."""

[[edge]]
id = "revised"
label = "Revise"
from = "rejected"
to = "draft"
when = "record.status == 'draft'"

[[edge]]
id = "cancel-rejected"
label = "Cancel"
from = "rejected"
to = "cancelled"
when = "record.status == 'cancelled'"

[[state]]
id = "draft"
label = "Draft"
tone = "active"

[[state.work]]
id = "submit"
title = "Write the change and send it for review"
kind = "wait"
until = "record.status != 'draft'"   # sent for review (or cancelled)
instructions = """Say why it changes, which products and documents it changes and what else it touches, then send it
for review on its page. Rejected, the board's note says what is missing: revise it and send it again, or cancel it.
Whoever writes it does not review it."""

[[edge]]
id = "sent"
label = "Send for review"
from = "draft"
to = "review"
when = "record.status == 'review'"

[[edge]]
id = "cancel"
label = "Cancel"
from = "draft"
to = "cancelled"
when = "record.status == 'cancelled'"

[[state]]
id = "review"
label = "Review"
tone = "attention"

[[state.work]]
id = "review"
title = "Review the change"
kind = "gate"
role = "change-board"
signer = "person"
not_by = ["record.editors"]   # whoever wrote the change does not approve it
meaning = "I approve this change order"
meanings = { reject = "I reject this change order and return it to its author" }
context = ["record:products", "record:documents", "record:quality"]
due = "5d"
escalate_to = "change-board"
instructions = """Read why it changes and what else it touches. Approve it, and its products and documents open at
their next revision; or reject it with what is missing, and it goes back to its author. Your comment is written on the
change order as the board's note."""

[[edge]]
id = "approve"
label = "Approve"
from = "review"
to = "approved"

[[edge.do]]
id = "approve"
title = "Record the approval"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Approved: {{review.comment}}"

[[edge.do]]
id = "open-products"
title = "Open each released product at its next revision"
when = "record.opened != true"   # a change returned and sent again does not open its products a second time
action = "record.update"
for_each = "{{record.products}}"
where = "each_record.status == 'released'"   # one still in concept or design is changed as it is
[edge.do.params]
ref = "{{each}}"
increment = ["revision"]
[edge.do.params.set]
status = "design"

[[edge.do]]
id = "revise-documents"
title = "Open each approved document for revision"
when = "record.opened != true"   # nor revise its documents again
action = "record.update"
for_each = "{{record.documents}}"
where = "each_record.status == 'approved'"
[edge.do.params]
ref = "{{each}}"
[edge.do.params.set]
status = "draft"   # a move the document's own workflow waits on: its author revises it and sends it for review

[[edge.do]]
id = "mark-opened"
title = "Note that the products and documents are open"
when = "open-products.each != null and revise-documents.each != null"   # once both have opened theirs
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
opened = true

[[edge]]
id = "reject"
label = "Reject"
from = "review"
to = "rejected"               # back with its author: the next pass is the next run's

[[edge.do]]
id = "reject"
title = "Return the change to its author"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Rejected: {{review.comment}}"

[[state]]
id = "approved"
label = "Approved"
tone = "active"

[[state.work]]
id = "documents-approved"
title = "Wait until every changed document is approved"
kind = "wait"
role = "document-controller"
for_each = "{{record.documents}}"
until = "each_record.status == 'approved' or each_record.status == 'obsolete'"
instructions = """Each changed document is listed with where it is and who holds it: its owner revises it and a
document controller approves it, in its own work."""

[[edge]]
id = "documents-done"
label = "Documents approved"
from = "approved"
to = "releasing"

[[state]]
id = "releasing"
label = "To release"
tone = "attention"

[[state.work]]
id = "release"
title = "Release the new revisions"
kind = "gate"
role = "product-owner"
signer = "person"
not_by = ["review"]    # the board member who approved it (in this pass or one before) does not release it
meaning = "I release these products at their new revision"
meanings = { return = "I return this change order without releasing it" }
context = ["record:products", "record:documents"]
due = "7d"
escalate_to = "product-owner"
instructions = """Check each product's parts and specifications are right at the new revision: the documents are
approved again. Releasing makes the new revision the one in use. Return it, and the change order goes back to its author
with the products still in design."""

[[edge]]
id = "release"
label = "Release"
from = "releasing"
to = "implemented"

[[edge.do]]
id = "release-products"
title = "Release the products"
action = "record.update"
for_each = "{{record.products}}"
where = "each_record.status == 'design'"
[edge.do.params]
ref = "{{each}}"
[edge.do.params.set]
status = "released"

[[edge]]
id = "return"
label = "Return to its author"
from = "releasing"
to = "draft"                  # the next pass is the next run's

[[edge.do]]
id = "returned"
title = "Return the change to its author"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
decision = "Returned at release: {{release.comment}}"

[[state]]
id = "implemented"
label = "Implemented"
tone = "done"

[[state]]
id = "cancelled"
label = "Cancelled"
tone = "done"
