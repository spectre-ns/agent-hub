# Document control: controlled documents (policies, procedures, forms) that are reviewed, approved and published.
# An overlay module: it adds to whatever practice it is installed in. It knows nothing about any one practice.

[module]
requires_core = "1.0"
id = "dms"
name = "Document control"
version = "3"
changes = """Returned documents say why: the controller's comment is written on the document (Returned because) and
shown on the next revision. Writing a revision is a task for the document's owner, due in 14 days and escalated to a
document controller. Every revision after approval is numbered by the document's own workflow, including one
revised by hand. Making a document obsolete is a proposal with a reason, decided and signed by a document
controller (the new Retiring state)."""
summary = "Controlled documents with review, approval, publication and read-and-understood signatures."
shortcuts = ["Document"]

[[roles]]
id = "document-controller"
name = "Document controller"
description = "Reviews and approves controlled documents for use."

[[roles]]
id = "document-author"
name = "Document author"
description = "Writes and revises controlled documents."

[[data_classes]]
id = "documents"
name = "Controlled documents"
description = "Policies, procedures and forms under document control."

[grants.everyone]   # everyone who works here reads the documents they must follow (and signs they understood them)
read = ["documents"]

[grants.document-controller]
write = ["documents"]
read = ["documents"]

[grants.document-author]
write = ["documents"]
read = ["documents"]
