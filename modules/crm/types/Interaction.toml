# A call, meeting, email, letter or visit with a contact or an organisation. Part of the one it was with, so it is
# added from, and shows on, that record's page. Business data only: the summary is of the business conversation,
# never health information about anyone.
#
# Its status is its follow-up, walked by the crm-follow-up workflow: making one starts it (it notes who logged it), it
# waits for the follow-up date, and the follow-up is one pass; followed up, the next run waits for the next date. The
# daily crm-follow-up-due sweep only marks a date that has come (follow_up_asked), which that wait watches.
id = "Interaction"
label = "Interaction"
plural = "Interactions"
data_class = "relationships"
part_of = "with"
date = "at"
order = 30
title = "{kind}: {summary}"
summary = "A call, meeting, email, letter or visit: who, when, what was said, and when to follow up."
workflow = { id = "crm-follow-up", when = "record.status in ['logged', 'follow-up', 'to-send']" }

[[field]]
name = "with"
label = "With"
type = "reference"
target = ["Person", "Organization"]
required = true

[[field]]
name = "kind"
label = "Kind"
type = "choice"
choices = ["call", "meeting", "email", "letter", "visit"]
required = true

[[field]]
name = "at"
label = "When"
type = "datetime"
required = true

[[field]]
name = "contact"
label = "Spoke with"
type = "reference"
target = ["Person"]
rel = "spoke with"
help = "for an interaction with an organisation: the person there"

[[field]]
name = "summary"
label = "Summary"
type = "text"
required = true
help = "what was discussed and agreed: business only, never health information"

[[field]]
name = "follow_up"
label = "Follow up on"
type = "date"

[[field]]
name = "logged_by"
label = "Logged by"
type = "member"
by = "workflow"

[[field]]
name = "follow_up_asked"
label = "Follow-up asked for"
type = "date"
by = "workflow"
advanced = true

[[field]]
name = "follow_up_done"
label = "Followed up for"
type = "date"
by = "workflow"
advanced = true

[[field]]
name = "status"
label = "Follow-up"
type = "choice"
choices = ["logged", "follow-up", "to-send"]
advanced = true

[lifecycle]
field = "status"
initial = "logged"
abandoned = { "follow-up" = "logged", "to-send" = "logged" }   # a follow-up cancelled: it waits for its next date
labels = { "logged" = "Logged", "follow-up" = "Being followed up", "to-send" = "To send" }

[[lifecycle.transition]]
from = ["logged"]
to = "follow-up"           # its follow-up date came (its workflow), or a person follows it up now
label = "Follow up now"

# The moves its follow-up makes (drafted, followed up) are the crm-follow-up workflow's edges; where a follow-up
# cancelled part way leaves it is abandoned, above.
