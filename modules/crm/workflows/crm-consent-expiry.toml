id = "crm-consent-expiry"
title = "Implied consent lapsing"
summary = """A contact whose implied consent to commercial messages lapses within 30 days is flagged, and their owner
is asked to get express consent, note a new dealing that renews it, or let it lapse. Once it lapses, the hub refuses
commercial messages to them."""
record = "Person"

# A scheduled companion: a contact has no lifecycle (Person is no workflow's record to walk), so this sweep starts on
# its schedule and writes only consent fields. Written as states and edges (practicehub/states.py): with no state field
# on a contact, the run keeps where it is itself and moves nothing on the record.

[trigger]
schedule = "daily 07:00"
for_each = "Person"
where = """record.consent == 'implied' and record.consent_date != null and record.consent_withdrawn == null
and record.consent_date + 2y > run.today and record.consent_date + 2y <= run.today + 30d
and record.consent_flagged != record.consent_date"""

[start]
to = "to-renew"
label = "Flagged"

[[start.do]]
id = "flag"
title = "Flag the contact"
action = "record.update"
[start.do.params]
ref = "{{run.record}}"
[start.do.params.set]
consent_flagged = "{{record.consent_date}}"
consent_flag = "implied consent lapses {{record.consent_date + 2y}}"

[[state]]
id = "to-renew"
label = "To renew"
tone = "attention"

[[state.work]]
id = "renew"
title = "Renew consent, or let it lapse"
kind = "task"
role = "relationship-manager"
assign_to = "{{record.account_owner}}"
persons_only = true
due = "30d"
escalate_to = "relationship-manager"
context = ["record:directory"]
instructions = """This contact's implied consent to commercial messages lapses in under 30 days, two years after it
was given. Ask them for express consent and record how they gave it, or note a new business dealing that implies it
afresh (its date and what it was), or let it lapse: after that, the hub sends them no commercial message."""
[[state.work.fields]]
name = "date"
label = "Given on"
type = "date"
help = "express or implied: when it was given"
[[state.work.fields]]
name = "source"
label = "How it was given"
type = "string"

[[edge]]
id = "express"
label = "Express: they said yes"
from = "to-renew"
to = "renewed"

[[edge.do]]
id = "record-consent"
title = "Record the consent"
when = "renew.date != null and renew.source != null"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
consent = "express"
consent_date = "{{renew.date}}"
consent_source = "{{renew.source}}"
consent_flag = ""

[[edge]]
id = "implied"
label = "Implied: a new dealing renews it"
from = "to-renew"
to = "renewed"

[[edge.do]]
id = "record-implied"
title = "Record the renewed implied consent"
when = "renew.date != null and renew.source != null"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
consent = "implied"
consent_date = "{{renew.date}}"
consent_source = "{{renew.source}}"
consent_flag = ""

[[edge]]
id = "lapse"
label = "Let it lapse"
from = "to-renew"
to = "lapsing"

[[edge.do]]
id = "lapse"
title = "Note that it will lapse"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
consent_flag = "implied consent lapses {{record.consent_date + 2y}}: not renewed"

[[state]]
id = "renewed"
label = "Renewed"
tone = "done"

[[state]]
id = "lapsing"
label = "Left to lapse"
tone = "done"
