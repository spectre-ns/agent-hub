id = "crm-follow-up"
title = "Follow up an interaction"
summary = """An interaction whose follow-up date has come goes to its owner (the contact's or organisation's, else who
logged it). An agent may draft the message; a person reads it and sends it, or follows up another way. A commercial
message goes only to a contact whose consent to it holds (CASL): the hub refuses it otherwise."""
record = "Interaction"

# The Interaction type names this workflow: logging an interaction starts it, and its status is this work's position.
# Written as the interaction's states and the edges between them (practicehub/states.py). One run is one follow-up:
# it notes who logged it, waits for its follow-up date (marked by the daily crm-follow-up-due sweep, which never moves
# the status), and follows it up; followed up, it is back where it began, which ends the run, and the next run waits
# for the next date. It replaces crm-interaction-logged, which only noted who logged it.

[start]
to = "logged"
label = "Logged"

[[start.do]]
id = "logged"
title = "Note who logged it"
when = "record.logged_by == null"
action = "record.update"
[start.do.params]
ref = "{{run.record}}"
[start.do.params.set]
logged_by = "{{run.started_by}}"

[[state]]
id = "logged"
label = "Logged"
tone = "done"

[[state.work]]
id = "due"
title = "Wait for the follow-up date"
kind = "wait"
until = """record.status != 'logged' or (record.follow_up != null and record.follow_up_asked == record.follow_up
and record.follow_up_done != record.follow_up)"""
instructions = """Nothing to do until its follow-up date: set one on the interaction, and on that day it goes to its
owner."""

# its date came, or a person followed it up now (a move by hand its wait takes)
[[edge]]
id = "asked"
label = "Follow up"
from = "logged"
to = "follow-up"

[[edge.do]]
id = "taken"
title = "Note the date it is followed up for"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
follow_up_done = "{{record.follow_up}}"   # so a follow-up cancelled part way waits for the next date, as Not needed does

[[edge.do]]
id = "who"
title = "Find the owner and whom to write to"
action = "crm.follow-up-who"

[[state]]
id = "follow-up"
label = "Being followed up"
tone = "attention"

[[state.work]]
id = "draft"
title = "Draft the follow-up"
kind = "task"
role = "follow-up-drafter"
skill = "crm-follow-up-draft"
risk = "low"
due = "1d"
escalate_to = "relationship-manager"
context = ["record:relationships", "who"]

[[edge]]
id = "drafted"
label = "Drafted"
from = "follow-up"
to = "to-send"

[[state]]
id = "to-send"
label = "To send"
tone = "attention"

[[state.work]]
id = "send"
title = "Send the follow-up"
kind = "task"
role = "relationship-manager"
assign_to = "{{who.owner}}"
review_of = "draft"
persons_only = true
due = "2d"
escalate_to = "relationship-manager"
context = ["record:relationships", "who", "draft"]
instructions = """Read the draft, change what needs changing, and choose how it went: send it by email (only to a
contact whose consent to commercial messages holds: the hub checks), or say you followed up another way (a call, a
visit), or that no follow-up is needed."""
# how it went is said, not an edge: every answer ends the follow-up the same way, only sending it emails the contact
[[state.work.fields]]
name = "how"
label = "How"
type = "choice"
choices = ["send", "another-way", "not-needed"]
required = true
[[state.work.fields]]
name = "subject"
type = "string"
[[state.work.fields]]
name = "body"
type = "text"

[[edge]]
id = "followed-up"
label = "Followed up"
from = "to-send"
to = "logged"                 # back where it began: the next run waits for its next date

[[edge.do]]
id = "email"
title = "Email the contact"
when = "send.how == 'send'"
action = "message.send"
[edge.do.params]
channel = "email"
purpose = "commercial"
to = "{{who.to}}"
subject = "{{send.subject}}"
body = "{{send.body}}"

[[edge.do]]
id = "done"
title = "Mark it followed up"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
follow_up_done = "{{record.follow_up}}"
