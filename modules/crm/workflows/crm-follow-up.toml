id = "crm-follow-up"
title = "Follow up an interaction"
summary = """An interaction whose follow-up date has come goes to its owner (the contact's or organisation's, else who
logged it). An agent may draft the message; a person reads it and sends it, or follows up another way. A commercial
message goes only to a contact whose consent to it holds (CASL): the hub refuses it otherwise."""
record = "Interaction"

# The Interaction type names this workflow: logging an interaction starts it, and its status is this work's position.
# One run is one follow-up: it notes who logged it, waits for its follow-up date (marked by the daily
# crm-follow-up-due sweep, which never moves the status), and follows it up; followed up, the next run waits for the
# next date. It replaces crm-interaction-logged, which only noted who logged it.

[[steps]]
id = "logged"
title = "Note who logged it"
kind = "automation"
when = "record.logged_by == null"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
logged_by = "{{run.started_by}}"

[[steps]]
id = "due"
title = "Wait for the follow-up date"
kind = "wait"
until = """record.status != 'logged' or (record.follow_up != null and record.follow_up_asked == record.follow_up
and record.follow_up_done != record.follow_up)"""
instructions = """Nothing to do until its follow-up date: set one on the interaction, and on that day it goes to its
owner."""

[[steps]]
id = "asked"
title = "The follow-up date came"
kind = "automation"
after = ["due"]
when = "record.status == 'logged'"
state = "follow-up"

[[steps]]
id = "who"
title = "Find the owner and whom to write to"
kind = "automation"
after = ["due", "asked"]   # its date came, or a person followed it up now
when = "record.status == 'follow-up'"
action = "crm.follow-up-who"

[[steps]]
id = "draft"
title = "Draft the follow-up"
kind = "task"
role = "follow-up-drafter"
after = ["who"]
skill = "crm-follow-up-draft"
risk = "low"
due = "1d"
escalate_to = "relationship-manager"
context = ["record:relationships", "who"]

[[steps]]
id = "send"
title = "Send the follow-up"
kind = "task"
role = "relationship-manager"
assign_to = "{{who.owner}}"
after = ["draft"]
review_of = "draft"
persons_only = true
due = "2d"
escalate_to = "relationship-manager"
context = ["record:relationships", "who", "draft"]
instructions = """Read the draft, change what needs changing, and choose how it went: send it by email (only to a
contact whose consent to commercial messages holds: the hub checks), or say you followed up another way (a call, a
visit), or that no follow-up is needed."""
[[steps.fields]]
name = "how"
label = "How"
type = "choice"
choices = ["send", "another-way", "not-needed"]
required = true
[[steps.fields]]
name = "subject"
type = "string"
[[steps.fields]]
name = "body"
type = "text"

[[steps]]
id = "email"
title = "Email the contact"
kind = "automation"
after = ["send"]
when = "send.how == 'send'"
action = "message.send"
[steps.params]
channel = "email"
purpose = "commercial"
to = "{{who.to}}"
subject = "{{send.subject}}"
body = "{{send.body}}"

[[steps]]
id = "done"
title = "Mark it followed up"
kind = "automation"
after = ["send", "email"]
action = "record.update"
state = "logged"   # the next run waits for its next date
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
follow_up_done = "{{record.follow_up}}"
