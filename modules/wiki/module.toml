# Wiki: pages of formatted text in a tree, for what a practice knows and how it works. A page that sits at the top of
# the tree is a space's home page. Pages link to each other by title ([[On-call guide]]) and to any record or piece of
# work ([[Document/<id>]], [[work:<id>]]); the record links back to the page on its Linked tab. Nothing in the wiki is
# controlled: a procedure that must be approved, released and signed is a controlled document (the dms module).
# An overlay module: it adds to whatever practice it is installed in, and it knows nothing about any one practice.

# 3: A page flagged as out of date is archived only through its check, a wiki owner's signed decision.
# 4: Procedures (their type, review and release) leave the wiki: a controlled document is document control's, and the
#  wiki-sop module files a page as one. The page check is written as states and edges.

[module]
requires_core = "1.0"
id = "wiki"
name = "Wiki"
# 5: each record is keyed in its type, as an issue is in its project (WIKI...): WIKI-12 is the 12th, and work on
#  it shows that key.
version = "5"
changes = """The wiki is for what the practice knows, not what it controls: SOPs (the Procedure type, its release and
periodic review, and the SOP approver role) leave the wiki. Controlled documents live in document control (the dms
module); a page becomes one through the wiki-sop module, which files a PDF of it as a new controlled document.
Its check is written as the page's states and the edges between them."""
summary = "Pages of formatted text in spaces and trees, linked to records and work, checked for being out of date."
shortcuts = ["WikiPage"]

[[roles]]
id = "wiki-owner"
name = "Wiki owner"
description = "Keeps the wiki current: checks pages flagged as out of date, and archives what is no longer true."

[[roles]]
id = "wiki-editor"
name = "Wiki editor"
description = "Writes and changes wiki pages. Give it to everyone who should write in the wiki."

[[roles]]
id = "wiki-reader"
name = "Wiki reader"
description = "Reads the wiki. People read it already; give it to an agent that should answer when mentioned in it."

[[data_classes]]
id = "wiki"
name = "Wiki pages"
description = "How the practice works: handbooks, guides, how-tos and meeting notes. No patient information."

[grants.everyone]   # everyone who works here reads the wiki; who writes in it holds wiki-editor
read = ["wiki"]

[grants.wiki-reader]
read = ["wiki"]

[grants.wiki-editor]
read = ["wiki"]
write = ["wiki"]

[grants.wiki-owner]
read = ["wiki"]
write = ["wiki"]
