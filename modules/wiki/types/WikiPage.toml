# A wiki page. A page with no parent is the home page of a space; the pages under it are the space's tree.
id = "WikiPage"
key = "WIKI"
label = "Wiki page"
plural = "Wiki pages"
data_class = "wiki"
title = "{title}"
parent = "parent"
flag = "status"
order = 20
# A page flagged as out of date is walked by the wiki-check workflow until a wiki owner confirms or archives it; a
# page being written or in use is no one else's work, so nothing walks it then. Each flag is one pass.
workflow = { id = "wiki-check", when = "record.status == 'needs-check'" }
summary = "A page of the practice's wiki: a handbook, a guide, a how-to or notes."
layout = "page"

[navigator]             # a second column beside the page: the spaces, then the open space's page tree
tops = "Spaces"
hide = ["archived"]

[[field]]
name = "title"
required = true
max_length = 200

[[field]]
name = "parent"
label = "Under"
type = "reference"
target = ["WikiPage"]
rel = "parent"
help = "the page this one sits under; leave it empty to start a new space"

[[field]]
name = "body"
label = "Page"
type = "markdown"
live = true             # several people write it at once, on the page itself

[[field]]
name = "labels"
type = "list"
help = "words to find the page by, one per line"

[[field]]
name = "owner"
type = "member"
help = "who keeps the page current"

[[field]]
name = "status"
type = "choice"
choices = ["draft", "published", "needs-check", "archived"]

[[field]]
name = "checked"
label = "Last checked"
type = "date"
help = "when a wiki owner last confirmed the page is current"

[lifecycle]
field = "status"
initial = "draft"
abandoned = { "needs-check" = "published" }   # a check cancelled leaves the page as it was before it was flagged; flag it again to have it checked

[[lifecycle.transition]]
from = ["draft"]
to = "published"
label = "Publish"

[[lifecycle.transition]]
from = ["published"]
to = "needs-check"
label = "Flag as out of date"

[[lifecycle.transition]]
from = ["draft", "published"]
to = "archived"
label = "Archive"

# A flagged page is put back or archived only by its check, a wiki owner's signed decision: those moves are the
# wiki-check workflow's edges. A check cancelled part way leaves the page as it was (abandoned, above).

[[lifecycle.transition]]
from = ["archived"]
to = "draft"
label = "Restore"

[[signature]]
meaning = "I have checked this page is current"
states = ["published"]
