id = "wiki-sop-review"
title = "Review a SOP that is due"
summary = "A released SOP past its review date goes to its owner: confirm it is still right (signed), or revise it."
record = "Procedure"

# A companion, started by the clock: the SOP's status belongs to wiki-sop-release, which walks it. This never moves
# the status; choosing revise sets revise_asked, and the SOP's own workflow opens the revision.

[trigger]
schedule = "daily 07:00"
for_each = "Procedure"
where = "record.status == 'released' and record.review_by < run.today and record.review_asked != record.review_by"

[[steps]]
id = "asked"
title = "Note that the review was asked for"
kind = "automation"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
review_asked = "{{record.review_by}}"

[[steps]]
id = "review"
title = "Review the SOP"
kind = "gate"
role = "wiki-editor"
assign_to = "{{record.owner}}"
after = ["asked"]
signer = "person"
meaning = "I have reviewed this SOP and it is still right"
outcomes = ["confirm", "revise"]
context = ["record:wiki"]
due = "14d"
escalate_to = "wiki-owner"
instructions = """The SOP is due for its periodic review. Read it: if it is still right, confirm it (its next review
is a year from today). If something has to change, choose revise: it goes back to draft, and staff keep reading the
released revision until the new one is released."""

[[steps]]
id = "confirm"
title = "Set the next review"
kind = "automation"
after = ["review"]
when = "review.outcome == 'confirm'"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
review_by = "{{run.today + 1y}}"

[[steps]]
id = "revise"
title = "Open a new revision"
kind = "automation"
after = ["review"]
when = "review.outcome == 'revise'"
action = "record.update"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
revise_asked = true   # the SOP's own workflow opens the revision
