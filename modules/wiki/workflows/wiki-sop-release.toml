id = "wiki-sop-release"
title = "Release a SOP"
summary = """One revision of a SOP, from draft to in use: its authors write it and send it for release review; a SOP
approver who did not write it releases it (and signs) or returns it with why; it is in use until it is revised or
retired. The SOP's status is where this work is."""
record = "Procedure"

# The Procedure type names this workflow: making a SOP starts it, and its status is this work's position. A revision
# is one run: returned or revised, the next run walks the next revision (a workflow has no loops). The periodic review
# (wiki-sop-review) never moves the status: choosing revise there sets revise_asked, and this workflow opens the
# revision. Nothing else starts it.

[[steps]]
id = "write"
title = "Write the revision and send it for release review"
kind = "wait"
until = "record.status != 'draft'"
instructions = """Write or revise the SOP together, then send it for release review on its page with a summary of what
changed. Whoever writes this revision cannot release it."""

[[steps]]
id = "release"
title = "Release the SOP for use"
kind = "gate"
after = ["write"]
when = "record.status == 'in-review'"
role = "sop-approver"
signer = "person"
not_by = ["record.editors"]   # nobody who wrote this revision, alone or in a live session, releases it
meaning = "I release this SOP for use at this revision"
meanings = { return = "I return this SOP to its authors unreleased" }
outcomes = ["release", "return"]
context = ["record:wiki"]
due = "5d"
escalate_to = "wiki-owner"
instructions = """Read the SOP in full, and what changed since the released revision (its page: History, then
Compare). What you sign is the text shown here, at this revision. Release it, or return it to its authors and say
what to change."""

[[steps]]
id = "publish"
title = "Put the released revision in use"
kind = "automation"
after = ["release"]
when = "release.outcome == 'release'"
action = "record.update"
state = "released"
[steps.params]
ref = "{{run.record}}"
increment = ["revision"]
[steps.params.set]
effective = "{{run.today}}"
review_by = "{{run.today + 1y}}"
returned_because = ""
revise_asked = false

[[steps]]
id = "return"
title = "Return it to its authors"
kind = "automation"
after = ["release"]
when = "release.outcome == 'return'"
action = "record.update"
state = "draft"   # the next revision is the next run's
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
returned_because = "{{release.comment}}"

[[steps]]
id = "in-use"
title = "In use until revised or retired"
kind = "wait"
after = ["write", "publish"]
when = "record.status == 'released'"
until = "record.status != 'released' or record.revise_asked == true"   # revised, retired, or its review asks
instructions = """The released revision is in use: staff read it and sign that they understood it. Revising it (on
its page, or when its periodic review asks) starts the next revision; staff keep reading this one until that is
released."""

[[steps]]
id = "open-revision"
title = "Open the revision its review asked for"
kind = "automation"
after = ["in-use"]
when = "record.status == 'released'"   # still released: its periodic review asked for a revision
action = "record.update"
state = "draft"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
revise_asked = false
