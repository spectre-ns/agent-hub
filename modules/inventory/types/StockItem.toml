# A lot: one quantity of one part in one place (InvenTree's stock item). A serial-tracked part has one per serial
# number. Nobody writes one by hand, not even a manager: only a posted stock move or build makes or changes it, and the
# move or build keeps what it changed. So every number here has its history in the ledger. A lot a build made knows
# the build and the lots that went into it (contains), so a recall traces forward from a component lot to every unit
# it went into, and a unit traces back to everything in it, at every level.
id = "StockItem"
key = "STK"
label = "Stock item"
plural = "Stock items"
data_class = "stock-ledger"
title = "{part_code}[ lot {lot}][ serial {serial}]"
flag = "status"
order = 40
unique = [["part", "serial"]]
summary = "One lot or serial of a part: how many, where, its expiry and whether it may be used."

[[field]]
name = "part"
type = "reference"
target = ["Part"]
rel = "lot-of"
by = "workflow"

[[field]]
name = "part_code"
label = "Part code"
max_length = 60
by = "workflow"
help = "the part's code when the lot was made, so the lot is named without looking the part up"

[[field]]
name = "lot"
label = "Lot number"
max_length = 60
by = "workflow"

[[field]]
name = "serial"
label = "Serial number"
max_length = 60
by = "workflow"

[[field]]
name = "supplier_lot"
label = "Supplier's lot"
max_length = 60
by = "workflow"

[[field]]
name = "quantity"
type = "number"
by = "workflow"

[[field]]
name = "status"
type = "choice"
choices = ["inspection", "available", "quarantined", "depleted", "scrapped", "returned", "built-in"]
by = "workflow"
help = "available: may be used; quarantined: held, used only once released; inspection: received, not yet released; built-in: a serial a build put into an assembly"

[[field]]
name = "location"
label = "Kept in"
type = "reference"
target = ["Location"]
rel = "kept-in"
by = "workflow"

[[field]]
name = "expiry"
type = "date"
by = "workflow"

[[field]]
name = "received"
type = "date"
by = "workflow"

[[field]]
name = "part_revision"
label = "Part revision"
type = "number"
by = "workflow"

[[field]]
name = "parent"
label = "Split from"
type = "reference"
target = ["StockItem"]
rel = "split-from"
graph = { down = "Made from", up = "Went into" }
by = "workflow"
help = "the lot this part of it was taken from, when only some of a lot moved; a trace goes through it"

[[field]]
name = "built_by"
label = "Built by"
type = "reference"
target = ["Build"]
rel = "built-by"
by = "workflow"

[[field]]
name = "contains"
type = "list"
rows = true
by = "workflow"
help = "the lots and serials its build put into it"

[[field]]
name = "contained_lot"
label = "Stock"
path = "contains.*.lot"
type = "reference"
target = ["StockItem"]
rel = "contains"
graph = { down = "Made from", up = "Went into" }
by = "workflow"

[[field]]
name = "contained_quantity"
label = "Quantity used"
path = "contains.*.quantity"
type = "number"
by = "workflow"
help = "how much of it went into this one; empty when the build shared it among several it made"

[[field]]
name = "count_baseline"
label = "Count baseline"
type = "number"
by = "workflow"
help = "what counts are measured against: set when it was received or last signed for, so small counts cannot add up to a write-off nobody signed"
