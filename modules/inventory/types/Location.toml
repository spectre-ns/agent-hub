# Where stock is kept: a site, a room in it, a cupboard or fridge in the room. Locations form a tree. A location's
# purpose says what may go in it: held stock goes only to quarantine or reject, and nothing is received there. A
# structural one (a site, a building) only groups others and holds no stock itself.
id = "Location"
key = "LOC"
label = "Storage location"
plural = "Storage locations"
data_class = "inventory"
title = "{name}"
parent = "within"
order = 50
summary = "A site, room, cupboard or fridge where stock is kept."

[navigator]
tops = "Sites"

[[field]]
name = "name"
required = true
max_length = 120

[[field]]
name = "within"
label = "Inside"
type = "reference"
target = ["Location"]
rel = "within"
help = "the room or site it is in; leave it empty for a site"

[[field]]
name = "kind"
type = "choice"
choices = ["site", "room", "cupboard", "fridge", "freezer", "cart", "shelf"]

[[field]]
name = "purpose"
type = "choice"
choices = ["storage", "receiving", "quarantine", "reject"]
help = "storage (empty means storage); receiving (deliveries waiting to be put away); quarantine (held stock, waiting for a decision); reject (stock to be written off or returned)"

[[field]]
name = "structural"
label = "Groups other locations"
type = "boolean"
help = "a site or building: stock is kept in the locations inside it, never in it"

[[field]]
name = "cold_chain"
label = "Cold chain"
type = "boolean"
help = "kept between 2 and 8 °C: vaccines and other fridge lines go here"

[[field]]
name = "notes"
type = "text"
