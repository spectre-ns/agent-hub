# One movement of stock, and its line in the ledger: a delivery received, stock issued for use, moved, counted,
# adjusted, held, released, written off or returned to its supplier. It names the inventory-post workflow: submitting
# it checks it and, when the policy in force asks for a signature, waits for one; posting it changes the stock, and
# what it changed is kept on it (each lot before and after). One refused goes back to its author with the reason.
id = "StockMove"
key = "MOVE"
label = "Stock move"
plural = "Stock moves"
data_class = "inventory"
title = "{kind}[ {quantity}][ {stock}]"
date = "moved"
flag = "status"
order = 41
workflow = { id = "inventory-post", when = "record.status in ['draft', 'submitted', 'rejected']" }
summary = "Stock received, issued, moved, counted, adjusted, held, released, written off or returned."

[[field]]
name = "kind"
type = "choice"
choices = ["receive", "issue", "transfer", "count", "adjust", "hold", "release", "scrap", "return"]
required = true
help = "receive a delivery; issue for use; move it; count the shelf; adjust to what is there; hold it (nobody uses it until it is released); write it off (scrap); return it to the supplier"

[[field]]
name = "part"
type = "reference"
target = ["Part"]
rel = "moves-part"
help = "for a delivery: what was received"

[[field]]
name = "lot"
label = "Stock"
type = "reference"
target = ["StockItem"]
rel = "moves"
help = "the lot or serial it moves (a delivery makes its own)"

[[field]]
name = "quantity"
type = "decimal"
scale = 3
min = 0
help = "how many (never negative: the kind says which way). For a count or an adjustment, how many there are. Left empty to hold, move, release or write off all of it."

[[field]]
name = "location"
label = "To"
type = "reference"
target = ["Location"]
rel = "to"
help = "where a delivery goes, or where stock is moved, held or released to"

[[field]]
name = "lot_number"
label = "Lot number"
max_length = 60
help = "for a delivery of a lot-tracked part: the lot on the label (one is made up when left empty)"

[[field]]
name = "supplier_lot"
label = "Supplier's lot"
max_length = 60

[[field]]
name = "serials"
label = "Serial numbers"
type = "text"
help = "for a delivery of a serial-tracked part: one per line"

[[field]]
name = "expiry"
type = "date"
help = "for a delivery of a part with a shelf life: the expiry on the label"

[[field]]
name = "moved"
label = "Date"
type = "date"

[[field]]
name = "reason"
type = "text"
help = "why: the delivery note, who it was issued to, what was damaged"

[[field]]
name = "stock"
label = "What it moves"
max_length = 200
by = "workflow"
help = "the part and lot, named when the move is checked"

[[field]]
name = "needs_signoff"
label = "Why it is signed"
type = "text"
by = "workflow"

[[field]]
name = "before_quantity"
label = "Before"
type = "decimal"
scale = 3
by = "workflow"

[[field]]
name = "after_quantity"
label = "After"
type = "decimal"
scale = 3
by = "workflow"

# One line for each lot it changes: its quantity, status, place and count baseline before and after. A lot it makes
# has no line's lot until the move is posted; its lot number, serial and expiry are what it is made with.
[[field]]
name = "entries"
label = "Ledger lines"
type = "table"
by = "workflow"
help = "each lot it changes: quantity, status, place and count baseline before and after"

[[field.column]]
name = "lot"
label = "Stock"
type = "reference"
target = ["StockItem"]
rel = "entry-lot"

[[field.column]]
name = "part"
type = "reference"
target = ["Part"]
rel = "entry-part"

[[field.column]]
name = "parent"
label = "Split from"
type = "reference"
target = ["StockItem"]
rel = "entry-parent"

[[field.column]]
name = "lot_number"
label = "Lot number"
max_length = 60

[[field.column]]
name = "serial"
max_length = 60

[[field.column]]
name = "supplier_lot"
label = "Supplier's lot"
max_length = 60

[[field.column]]
name = "expiry"
type = "date"

[[field.column]]
name = "part_revision"
label = "Part revision"
type = "number"

[[field.column]]
name = "quantity_before"
label = "Quantity before"
type = "decimal"
scale = 3

[[field.column]]
name = "quantity_after"
label = "Quantity after"
type = "decimal"
scale = 3

[[field.column]]
name = "status_before"
label = "Status before"
type = "choice"
choices = ["inspection", "available", "quarantined", "depleted", "scrapped", "returned"]

[[field.column]]
name = "status_after"
label = "Status after"
type = "choice"
choices = ["inspection", "available", "quarantined", "depleted", "scrapped", "returned"]

[[field.column]]
name = "location_before"
label = "From"
type = "reference"
target = ["Location"]
rel = "entry-from"

[[field.column]]
name = "location_after"
label = "To"
type = "reference"
target = ["Location"]
rel = "entry-to"

[[field.column]]
name = "baseline_before"
label = "Baseline before"
type = "decimal"
scale = 3

[[field.column]]
name = "baseline_after"
label = "Baseline after"
type = "decimal"
scale = 3

[[field]]
name = "policy"
label = "Posted under"
by = "workflow"

[[field]]
name = "level"
label = "Control level"
by = "workflow"

[[field]]
name = "authority"
label = "Posted for"
by = "workflow"
help = "the signed record that posted it (a goods receipt's release, a nonconformance's disposition)"

[[field]]
name = "posted_seq"
label = "Ledger number"
type = "number"
by = "workflow"

[[field]]
name = "reject_reason"
label = "Why it was sent back"
type = "text"
by = "workflow"

[[field]]
name = "status"
type = "choice"
choices = ["draft", "submitted", "posted", "rejected"]

[lifecycle]
field = "status"
initial = "draft"
abandoned = { "submitted" = "draft" }   # a sign-off that is cancelled hands the move back
locked = ["submitted", "posted"]        # once sent for posting, people change nothing but the state

[[lifecycle.transition]]
from = ["draft"]
to = "submitted"
label = "Submit for posting"

# Posting it and sending it back are the inventory-post workflow's edges; only the moves people make by hand are
# listed here. Where cancelled work leaves it is abandoned, above.
[[lifecycle.transition]]
from = ["rejected"]
to = "draft"
label = "Revise"
