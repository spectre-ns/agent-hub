id = "inventory-stock"
title = "Stock"
summary = "What is in stock and where, what is held, and the latest moves and builds."

[[widget]]
kind = "table"
title = "Parts"
type = "Part"
where = "record.status != 'obsolete'"
columns = ["code", "name", "available", "on_hand", "quarantined", "unit", "status"]

[[widget]]
kind = "board"
title = "Lots"
type = "StockItem"
where = "record.status == 'available' or record.status == 'quarantined' or record.status == 'inspection'"
group_by = "status"
columns = ["part", "lot", "serial", "quantity", "location", "expiry"]

[[widget]]
kind = "table"
title = "Running low"
type = "Part"
# a part being revised, or held by a change, is still stocked as last approved: it runs low all the same
where = "record.status != 'obsolete' and record.minimum_stock != null and record.available <= record.minimum_stock"
columns = ["code", "name", "available", "minimum_stock", "reorder_quantity", "status"]

[[widget]]
kind = "table"
title = "Recent moves"
type = "StockMove"
columns = ["kind", "quantity", "part", "lot", "moved", "status", "reject_reason"]
limit = 20

[[widget]]
kind = "table"
title = "Recent builds"
type = "Build"
columns = ["part", "quantity", "makes", "built", "status", "reject_reason"]
limit = 20

[[widget]]
kind = "table"
source = "items"
title = "Moves waiting for a signature"
workflow = "inventory-post"
status = ["open", "claimed"]

[[widget]]
kind = "table"
source = "items"
title = "Builds waiting for a signature"
workflow = "inventory-build"
status = ["open", "claimed"]
