# Inventory (after InvenTree): parts and their bills of materials, the lots that hold them, where they are kept, and
# the ledger of stock moves and builds. A lot's quantity is never typed in: only a posted stock move or build changes
# it, and it keeps what it changed, so every number has its history. How much is signed is the practice's inventory
# policy: basic for a corner store (nothing), tracked for a small clinic (adjustments, write-offs and releases),
# regulated for ISO 13485 (parts approved, builds signed). It installs alone and knows nothing about any one practice.

[module]
requires_core = "1.0"
id = "inventory"
name = "Inventory"
# 5: each record is keyed in its type, as an issue is in its project (STK...): STK-12 is the 12th, and work on
#  it shows that key.
# 6: assemblies. A part's bill of materials, and builds that make an assembly's stock from its components' lots.
version = "6"
changes = """Assemblies: a part may have a bill of materials (the parts that go into one, and how many), approved with
the part. A build makes an assembly's lot or serials from component stock, posted through the same ledger and
sign-off as a stock move, and each lot it makes knows what went into it: a component lot traces forward to every unit
it went into, and a unit back to everything in it; a lot split from another traces through the split. What a build
makes expires no later than the first of what went into it. Under the regulated level a build making several serials
says which each component serial goes into (exact genealogy, a switch on the policy). Parts also gain a description, an
owner and the documents that specify them. Nothing is removed: version 5's records carry over."""
summary = "Parts and what they are made of, the lots that hold them, where they are kept, and the moves and builds that change them."
requires = []
shortcuts = ["Part", "StockMove", "Build"]

[[roles]]
id = "stock-keeper"
name = "Stock keeper"
description = "Receives deliveries, issues stock, moves and counts it, builds assemblies, and holds what should not be used."

[[roles]]
id = "purchaser"
name = "Purchaser"
description = "Orders stock when a part runs low."

[[roles]]
id = "inventory-manager"
name = "Inventory manager"
description = "Signs adjustments, write-offs, returns, releases, counts beyond tolerance and builds (when the policy inspects), and the inventory policy. Under a policy that asks for a second person, never the one who wrote it."

[[roles]]
id = "stock-quality"
name = "Stock quality"
description = "Approves parts for use (when the policy asks for it). A practice with a quality manager gives them this role."

[[data_classes]]
id = "inventory"
name = "Inventory"
description = "Parts, storage locations, stock moves, builds and the inventory policy. No patient information."

[[data_classes]]
id = "stock-ledger"
name = "Stock ledger"
description = "The lots: how much of each part is where, and what went into each. Nobody writes them; only a posted stock move or build does."

[grants.everyone]   # everyone who works here may see what is in stock and where
read = ["inventory", "stock-ledger"]

[grants.stock-keeper]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.purchaser]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.inventory-manager]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.stock-quality]
read = ["inventory", "stock-ledger"]
write = ["inventory"]
