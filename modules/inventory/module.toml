# Inventory (after InvenTree): parts, the lots that hold them, where they are kept, and the ledger of stock moves. A
# lot's quantity is never typed in: only a posted stock move changes it, and the move keeps what it changed, so every
# number has its history. How much is signed is the practice's inventory policy: basic for a corner store (nothing),
# tracked for a small clinic (adjustments, write-offs and releases), regulated for ISO 13485 (parts approved too).
# It installs alone and knows nothing about any one practice.

[module]
requires_core = "1.0"
id = "inventory"
name = "Inventory"
# 5: each record is keyed in its type, as an issue is in its project (STK...): STK-12 is the 12th, and work on
#  it shows that key.
version = "5"
changes = """Rebuilt on InvenTree's model: parts, lots (stock items) with lot, serial and expiry, locations with a
purpose, and a ledger whose moves keep each lot before and after. Three control levels set by a signed inventory
policy. Version 3's stock items and moves do not carry over: remove the module and install it again."""
summary = "Parts, the lots that hold them, where they are kept, and the moves that receive, issue, hold and count them."
requires = []
shortcuts = ["Part", "StockMove"]

[[roles]]
id = "stock-keeper"
name = "Stock keeper"
description = "Receives deliveries, issues stock, moves and counts it, and holds what should not be used."

[[roles]]
id = "purchaser"
name = "Purchaser"
description = "Orders stock when a part runs low."

[[roles]]
id = "inventory-manager"
name = "Inventory manager"
description = "Signs adjustments, write-offs, returns, releases and counts beyond tolerance, and the inventory policy. Under a policy that asks for a second person, never the one who wrote it."

[[roles]]
id = "stock-quality"
name = "Stock quality"
description = "Approves parts for use (when the policy asks for it). A practice with a quality manager gives them this role."

[[data_classes]]
id = "inventory"
name = "Inventory"
description = "Parts, storage locations, stock moves and the inventory policy. No patient information."

[[data_classes]]
id = "stock-ledger"
name = "Stock ledger"
description = "The lots: how much of each part is where. Nobody writes them; only a posted stock move does."

[grants.everyone]   # everyone who works here may see what is in stock and where
read = ["inventory", "stock-ledger"]

[grants.stock-keeper]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.purchaser]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.inventory-manager]
read = ["inventory", "stock-ledger"]
write = ["inventory"]

[grants.stock-quality]
read = ["inventory", "stock-ledger"]
write = ["inventory"]
