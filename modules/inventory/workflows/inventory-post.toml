id = "inventory-post"
title = "Post a stock move"
summary = """A submitted stock move changes the item's on hand. A delivery received or stock issued posts at once (an
issue for more than is on hand goes back to a stock keeper); a write-off, stock found or a count is signed off by an inventory
manager first, never the one who wrote it."""
record = "StockMove"

# The StockMove type names this workflow: making a stock move starts it, and its status is this work's position.
# Rejected (not signed off, or short), it goes back to its author and the next run walks it again. Nothing else starts
# it. It moves a stock item's status (a delivery restocks it) only through a move that item's reorder pass waits on.

[[steps]]
id = "submit"
title = "Write the move and submit it for posting"
kind = "wait"
until = "record.status != 'draft' and record.status != 'rejected'"
moves = ["draft"]   # a rejected move revised: still with its author
instructions = """Say what moved, how many and why, then submit it on its page. A write-off, stock found or a count
is signed off by an inventory manager who did not write it."""

[[steps]]
id = "sign-off"
title = "Sign off the stock change"
kind = "gate"
role = "inventory-manager"
signer = "person"
after = ["submit"]
when = "record.status == 'submitted' and record.kind in ['write-off', 'found', 'count']"
not_by = ["record.editors"]
meaning = "I have checked this change to stock on hand"
outcomes = ["post", "reject"]
context = ["record:inventory"]
due = "2d"
escalate_to = "inventory-manager"
instructions = """A write-off, stock found or a count changes on hand without a delivery or an issue. Check the reason (and, for a
count, that the shelf was counted): post it, or reject it and it goes back to whoever wrote it."""

[[steps]]
id = "receive"
title = "Add the delivery to on hand"
kind = "automation"
after = ["submit"]
when = "record.status == 'submitted' and record.kind == 'receive'"
action = "record.update"
for_each = "{{record.item}}"
[steps.params]
ref = "{{each}}"
[steps.params.increment]
on_hand = "{{record.quantity}}"

[[steps]]
id = "restock"
title = "Mark the item stocked again"
kind = "automation"
after = ["receive"]
action = "record.update"
for_each = "{{record.item}}"
where = "(each_record.status == 'low' or each_record.status == 'on-order') and each_record.on_hand > each_record.reorder_point"
[steps.params]
ref = "{{each}}"
[steps.params.set]
status = "stocked"   # a move the item's reorder pass waits on

[[steps]]
id = "issue"
title = "Take the issued stock off on hand"
kind = "automation"
after = ["submit"]
when = "record.status == 'submitted' and record.kind == 'issue'"
action = "record.update"
for_each = "{{record.item}}"
where = "each_record.on_hand >= record.quantity"   # never below zero: a short issue goes back to a person
[steps.params]
ref = "{{each}}"
[steps.params.decrement]
on_hand = "{{record.quantity}}"

[[steps]]
id = "short"
title = "Not enough on hand to issue"
kind = "automation"
after = ["issue"]
when = "issue.passed_over != []"
action = "record.update"
state = "rejected"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
reject_reason = "Less is on hand than this issues."

[[steps]]
id = "write-off"
title = "Take the written-off stock off on hand"
kind = "automation"
after = ["sign-off"]
when = "sign-off.outcome == 'post' and record.kind == 'write-off'"
action = "record.update"
for_each = "{{record.item}}"
where = "each_record.on_hand >= record.quantity"   # never below zero: count the shelf instead
[steps.params]
ref = "{{each}}"
[steps.params.decrement]
on_hand = "{{record.quantity}}"

[[steps]]
id = "short-write-off"
title = "Not enough on hand to write off"
kind = "automation"
after = ["write-off"]
when = "write-off.passed_over != []"
action = "record.update"
state = "rejected"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
reject_reason = "Less is on hand than this writes off: count the shelf instead."

[[steps]]
id = "found"
title = "Add the found stock to on hand"
kind = "automation"
after = ["sign-off"]
when = "sign-off.outcome == 'post' and record.kind == 'found'"
action = "record.update"
for_each = "{{record.item}}"
[steps.params]
ref = "{{each}}"
[steps.params.increment]
on_hand = "{{record.quantity}}"

[[steps]]
id = "count"
title = "Set on hand to the count"
kind = "automation"
after = ["sign-off"]
when = "sign-off.outcome == 'post' and record.kind == 'count'"
action = "record.update"
for_each = "{{record.item}}"
[steps.params]
ref = "{{each}}"
[steps.params.set]
on_hand = "{{record.quantity}}"

[[steps]]
id = "rejected"
title = "Return the move to its author"
kind = "automation"
after = ["sign-off"]
when = "sign-off.outcome == 'reject'"
action = "record.update"
state = "rejected"   # back with its author: the next pass is the next run's
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
reject_reason = "Not signed off: {{sign-off.comment}}"

[[steps]]
id = "posted"
title = "Mark the move posted"
kind = "automation"
after = ["restock", "issue", "write-off", "found", "count"]
when = "record.status == 'submitted'"   # a short issue or write-off has already been rejected
state = "posted"
