id = "inventory-post"
title = "Post a stock move"
summary = """A submitted stock move is checked against the stock and the policy in force, and posted: the lots it moves
change, and the move keeps what changed. Under a policy that asks for it, an adjustment, a write-off, a return, a
release or a count beyond its tolerance is signed first (by someone other than its author when the policy says
second). A move that cannot post goes back to its author with the reason."""
record = "StockMove"

# The StockMove type names this workflow: making a stock move starts it, and its status is this work's position.
# Written as the move's states and the edges between them (practicehub/states.py), listed in the order a pass goes
# through them. A move sent back (refused by the check, not signed, or the stock changed since it was checked) goes to
# rejected, which ends the pass; the next run walks it again once revised. Every check runs before anyone signs, and
# the post checks again: a signature covers only the stock it was checked against. A move that needs no signature
# under the policy in force posts on the way out of draft, so a one-person shop never waits on anyone.

[start]
to = "draft"
label = "Written"

[[start.do]]
id = "from-rejected"
title = "Walk it from rejected"
when = "record.status == 'rejected'"
to = "rejected"

[[state]]
id = "rejected"
label = "Sent back"
tone = "attention"

[[state.work]]
id = "revise"
title = "Revise the move that was sent back"
kind = "wait"
until = "record.status != 'rejected'"
instructions = """Not posted: why is on the move (Why it was sent back). Revise it on its page, then submit it
again."""

[[edge]]
id = "revised"
label = "Revised"
from = "rejected"
to = "draft"

[[state]]
id = "draft"
label = "Draft"
tone = "active"

[[state.work]]
id = "submit"
title = "Write the move and submit it for posting"
kind = "wait"
until = "record.status != 'draft'"
instructions = """Say what moved, how many and why, then submit it on its page."""

# Submitted: checked against the stock and the policy in force. Refused, it goes back; with no signature needed it
# posts at once; otherwise it waits in submitted for one.
[[edge]]
id = "submit"
label = "Submit for posting"
from = "draft"
to = "submitted"

[[edge.do]]
id = "policy"
title = "Read the inventory policy in force"
action = "inventory.policy"

[[edge.do]]
id = "check"
title = "Check the move against the stock"
after = ["policy"]
action = "inventory.check"

[[edge.do]]
id = "refused"
title = "Send the move back: it cannot post"
when = "not check.ok"           # inventory.check wrote why on the move
to = "rejected"                 # back with its author: the next pass is the next run's

[[edge.do]]
id = "post-now"
title = "Post the move"
when = "check.ok and check.signoff == ''"
action = "inventory.post"

[[edge.do]]
id = "stale-now"
title = "Send the move back: the stock changed"
when = "check.ok and check.signoff == '' and not post-now.ok"
to = "rejected"

[[edge.do]]
id = "posted-now"
title = "Mark the move posted"
when = "post-now.ok"
to = "posted"

[[state]]
id = "submitted"
label = "Submitted"
tone = "attention"

# Two alternative pieces of work, one per sign-off setting: the policy says whether its author may sign it (self) or
# only someone else (second). A gate nobody may take would block for good, so not_by rides only on the second.
[[state.work]]
id = "sign-own"
title = "Sign the stock change"
kind = "gate"
role = "inventory-manager"
signer = "person"
when = "check.ok and check.self"
meaning = "I have checked this change to stock"
context = ["record:inventory"]
due = "2d"
instructions = """The move says why it needs a signature, and each lot before and after. Check the reason (and,
for a count, that the shelf was counted): post it, or reject it and it goes back to whoever wrote it."""

[[state.work]]
id = "sign-other"
title = "Sign the stock change"
kind = "gate"
role = "inventory-manager"
signer = "person"
when = "check.ok and check.second"
not_by = ["record.editors"]
meaning = "I have checked this change to stock"
context = ["record:inventory"]
due = "2d"
escalate_to = "inventory-manager"
instructions = """The move says why it needs a signature, and each lot before and after. Check the reason (and,
for a count, that the shelf was counted): post it, or reject it and it goes back to whoever wrote it. Someone other
than its author signs it."""

[[edge]]
id = "post"
label = "Post"
from = "submitted"
to = "posted"

[[edge.do]]
id = "post-signed"
title = "Post the move"
action = "inventory.post"

[[edge.do]]
id = "stale"
title = "Send the move back: the stock changed"
when = "not post-signed.ok"     # inventory.post wrote why on the move
to = "rejected"

[[edge]]
id = "reject"
label = "Reject"
from = "submitted"
to = "rejected"                 # back with its author: the next pass is the next run's

[[edge.do]]
id = "not-signed"
title = "Return the move to its author"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
reject_reason = "Not signed: {{sign-own.comment}}{{sign-other.comment}}"

[[state]]
id = "posted"
label = "Posted"
tone = "done"
