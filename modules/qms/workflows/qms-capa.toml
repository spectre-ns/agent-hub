id = "qms-capa"
title = "Corrective or preventive action"
summary = """Investigate and plan; open the affected controlled documents for revision; once every one has been
reviewed and approved again (the dms module's review), a quality manager who did not investigate decides whether the
action worked. Not effective: the next pass takes further action and is verified again."""
record = "CAPA"

# The CAPA type names this workflow: making a CAPA starts it, and the CAPA's status is its position. Written as the
# CAPA's states and the edges between them (practicehub/states.py), listed in the order a pass goes through them. A
# CAPA found not effective goes back to further action, which ends the pass; the next run walks the next one: whoever
# investigated or took the action, in any pass, does not verify it. Each run is walked from where the CAPA is when it
# starts. A quality manager may also start it by hand on a CAPA nothing walks (one whose work was cancelled).
[trigger]
starters = ["quality-manager"]

[start]
to = "open"
label = "Opened"

# a pass after one found not effective (or one handed on part way) is walked from where the CAPA is
[[start.do]]
id = "from-further-action"
title = "Walk it from further action"
when = "record.status in ['further-action', 'actions']"
to = "further-action"

[[start.do]]
id = "from-verification"
title = "Walk it from verification"
when = "record.status == 'verification'"
to = "verification"

[[state]]
id = "open"
label = "Open"
tone = "active"

[[state.work]]
id = "investigate"
title = "Investigate the root cause and plan the action"
kind = "task"
role = "quality-manager"
when = "record.status in ['open', 'investigating']"
moves = ["investigating", "cancelled"]   # started on its page (naming its owner), or cancelled: that ends the work
context = ["record:quality", "record:documents"]
due = "5d"
escalate_to = "quality-manager"
[[state.work.fields]]
name = "root_cause"
label = "Root cause"
type = "text"
required = true
[[state.work.fields]]
name = "plan"
label = "Action plan"
type = "text"
required = true

[[edge]]
id = "plan-agreed"
label = "Plan agreed"
from = "open"
to = "actions"

[[edge.do]]
id = "record-plan"
title = "Write the plan into the CAPA"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
root_cause = "{{investigate.root_cause}}"
plan = "{{investigate.plan}}"
[edge.do.params.append]
actions = "{{run.today}}, {{investigate.by}}: {{investigate.plan}}"

[[edge.do]]
id = "revise-documents"
title = "Open the affected documents for revision"
action = "record.update"
for_each = "{{record.documents}}"   # the first pass: every document it names
where = "each_record.status == 'approved'"  # a draft or one already in review is left as it is
[edge.do.params]
ref = "{{each}}"
[edge.do.params.set]
status = "draft"   # a move the document's own workflow waits on (it numbers the revision); its owner revises it

[[state]]
id = "further-action"
label = "Further action"
tone = "attention"

[[state.work]]
id = "act"
title = "Take further action"
kind = "task"
role = "quality-manager"
context = ["record:quality", "record:documents"]
due = "14d"
escalate_to = "quality-manager"
instructions = """The action was found not effective: why is on the CAPA (Found not effective because), and every
earlier pass's action is under Actions taken. Say what further action is taken, and which of the affected documents
it changes: only those are opened for revision again. It is verified again by someone who did not take it."""
[[state.work.fields]]
name = "plan"
label = "Further action"
type = "text"
required = true
[[state.work.fields]]
name = "reopen"
label = "Documents to revise again"
type = "list"
help = "of the documents this CAPA affects, the ones this action changes (Document/id); none: no document changes"

[[edge]]
id = "acted"
label = "Further action taken"
from = "further-action"
to = "actions"

[[edge.do]]
id = "record-more"
title = "Write the further action into the CAPA"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
plan = "{{act.plan}}"
[edge.do.params.append]
actions = "{{run.today}}, {{act.by}}: {{act.plan}}"

[[edge.do]]
id = "revise-named"
title = "Open the documents the further action changes"
action = "record.update"
for_each = "{{act.reopen}}"   # a later pass: only the ones its action names
where = "each in record.documents and each_record.status == 'approved'"
[edge.do.params]
ref = "{{each}}"
[edge.do.params.set]
status = "draft"

[[state]]
id = "actions"
label = "Actions"
tone = "active"

[[state.work]]
id = "documents-approved"
title = "Wait until every affected document is approved"
kind = "wait"
role = "document-controller"
for_each = "{{record.documents}}"
until = "each_record.status == 'approved' or each_record.status == 'obsolete'"
instructions = """Each affected document is listed with where it is and who holds it: its owner revises it and a
document controller approves it, in its own work."""

[[edge]]
id = "ready"
label = "Ready for verification"
from = "actions"
to = "verification"

[[state]]
id = "verification"
label = "Verification"
tone = "attention"

[[state.work]]
id = "verify"
title = "Did the action work?"
kind = "gate"
role = "quality-manager"
due = "30d"
escalate_to = "quality-manager"
signer = "person"
meaning = "I have checked this action and found it effective"
meanings = { "not-effective" = "I have checked this action and found it not effective" }
context = ["record:quality", "record:documents"]
not_by = ["investigate", "act"]   # in this pass or an earlier one
instructions = """Check whether the action worked. Not effective: say why in your comment; it is written on the CAPA
for whoever takes the further action."""

[[edge]]
id = "effective"
label = "Effective"
from = "verification"
to = "closed"

[[edge.do]]
id = "close"
title = "Close the CAPA"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
not_effective_because = ""

[[edge]]
id = "not-effective"
label = "Not effective"
from = "verification"
to = "further-action"         # the next pass is the next run's

[[edge.do]]
id = "reopen"
title = "Back to further action, saying why"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
not_effective_because = "{{verify.comment}}"

[[state]]
id = "closed"
label = "Closed"
tone = "done"
