# A corrective or preventive action. It points at the controlled documents (dms) it changes.
id = "CAPA"
label = "CAPA"
plural = "CAPAs"
data_class = "quality"
date = "opened"
flag = "status"
order = 20
# Every CAPA is worked from open to closed by one workflow: investigated and planned, its documents revised and
# approved again, verified by someone who did not investigate; found not effective, the next pass acts again. Its
# status is where that work is.
workflow = { id = "qms-capa", when = "record.status in ['open', 'investigating', 'further-action', 'actions']" }
summary = "A corrective or preventive action, and the documents it changes."

[[field]]
name = "title"
required = true

[[field]]
name = "kind"
type = "choice"
choices = ["corrective", "preventive"]
required = true

[[field]]
name = "problem"
type = "text"
required = true

[[field]]
name = "opened"
type = "date"

[[field]]
name = "owner"
type = "member"

[[field]]
name = "status"
type = "choice"
choices = ["open", "investigating", "further-action", "actions", "verification", "closed", "cancelled"]
labels = { open = "Open", investigating = "Investigating", further-action = "Further action", actions = "Actions", verification = "Verification", closed = "Closed", cancelled = "Cancelled" }

[[field]]
name = "documents"
label = "Documents affected"
type = "list"

[[field]]
name = "document"
label = "Document affected"
path = "documents.*"
type = "reference"
target = ["Document"]
rel = "affects"

[[field]]
name = "root_cause"
label = "Root cause"
type = "text"
by = "workflow"   # the investigation's answer; kept as it was agreed once actions are under way

[[field]]
name = "plan"
label = "Action plan"
type = "text"
by = "workflow"   # the latest pass's action; every pass's is in actions

[[field]]
name = "actions"
label = "Actions taken"
type = "list"
by = "workflow"   # one entry per pass: when, who, and what was done
show = true

[[field]]
name = "not_effective_because"
label = "Found not effective because"
type = "text"
by = "workflow"   # the verifier's comment, shown to whoever takes the further action
show = true

[[field]]
name = "cancel_reason"
label = "Why it was cancelled"
type = "text"
show = true

[lifecycle]
field = "status"
initial = "open"
locked = ["further-action", "actions", "verification", "closed", "cancelled"]   # once the plan is agreed, the root cause, plan and documents are what is acted on and verified
abandoned = { "verification" = "further-action", "further-action" = "investigating", "actions" = "investigating" }   # cancelled verification leaves further action to take; cancelled actions go back to investigating, which a person may cancel

[[lifecycle.transition]]
from = ["open"]
to = "investigating"
label = "Start investigating"
screen = "start"              # a transition screen: who owns it, asked as it starts
require = ["owner"]
comment = true

# the qms-capa workflow's edges are its other moves; from investigating (a move by hand) its plan agreed is this one
[[lifecycle.transition]]
from = ["open", "investigating"]
to = "actions"
by = "workflow"
fields = ["root_cause", "plan"]   # the investigation's answers, as its task is done
require = ["root_cause", "plan"]
label = "Plan agreed"

[[lifecycle.transition]]
from = ["further-action", "actions"]
to = "investigating"
by = "workflow"            # its run was cancelled: the plan is reopened (a quality manager may start it again, or cancel it)
label = "Back to investigating"

[[lifecycle.transition]]
from = ["verification"]
to = "further-action"
by = "workflow"            # its verification was cancelled (the not-effective edge makes this move too)
label = "Back to further action"

[[lifecycle.transition]]
from = ["verification"]
to = "actions"
by = "workflow"            # a pass walked by the workflow's first version, before further action was a state of its own
label = "Not effective: more action"

[[lifecycle.transition]]
from = ["open", "investigating"]   # once actions are under way, its workflow finishes or a quality manager cancels the run
to = "cancelled"
label = "Cancel"
fields = ["cancel_reason"]
require = ["cancel_reason"]

[[screen]]
id = "start"
fields = ["owner", "opened"]

# No [[signature]]: the qms-capa workflow's verify gate is where a quality manager signs whether the action worked
# (and it keeps the investigator out of it). A second meaning here only said the same thing twice.
