apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ph.name" . }}-state
  labels: {{- include "ph.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.hub.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.hub.stateSize }} } }
---
# the track's anchors, on their own volume (ideally other storage): a restored or rolled-back database is noticed
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ph.name" . }}-anchors
  labels: {{- include "ph.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.hub.anchorsStorageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.hub.anchorsSize }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ph.name" . }}
  labels: {{- include "ph.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1             # one hub process per database
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "ph.labels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels: {{- include "ph.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      securityContext: { fsGroup: 10001, runAsUser: 10001, runAsNonRoot: true }
      initContainers:
        # set the practice up on first install; on later starts the database already has it, and this does nothing
        - name: init
          image: {{ include "ph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init", "--if-new", "--pack", "{{ .Values.pack }}"]
          env: {{- include "ph.env" . | nindent 12 }}
          {{- with .Values.hub.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts: [{ name: state, mountPath: /state }, { name: anchors, mountPath: /anchors }]
      containers:
        - name: hub
          image: {{ include "ph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "{{ .Values.hub.port }}"{{ if .Values.agents.enabled }}, "--agents"{{ end }}]
          ports: [{ name: http, containerPort: {{ .Values.hub.port }} }]
          env: {{- include "ph.env" . | nindent 12 }}
          {{- with .Values.hub.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts: [{ name: state, mountPath: /state }, { name: anchors, mountPath: /anchors }]
          resources: {{- toYaml .Values.hub.resources | nindent 12 }}
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: {{ include "ph.name" . }}-state }
        - name: anchors
          persistentVolumeClaim: { claimName: {{ include "ph.name" . }}-anchors }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ph.name" . }}
  labels: {{- include "ph.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ph.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  ports: [{ name: http, port: {{ .Values.hub.port }}, targetPort: http }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ph.name" . }}
  labels: {{- include "ph.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "set ingress.host" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "ph.name" . }}, port: { name: http } } }
{{- end }}
