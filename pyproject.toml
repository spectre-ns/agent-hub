[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practicehub"
version = "0.1.0"
description = "A governed operations platform for professional practices, where AI agents are members of the practice"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["pymongo>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
practicehub = "practicehub.cli:main"

[tool.setuptools.packages.find]
include = ["practicehub*"]

# the core's base types are read from beside the code (practicehub/schema.py BASE_DIR): an installed hub needs them
[tool.setuptools.package-data]
"practicehub.base" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["own_shapes: the test stores documents of its own making, which practicehub/db.py does not name"]
