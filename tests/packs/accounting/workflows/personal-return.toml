id = "personal-return"
title = "Personal tax return"
record = "Client"
summary = "The agent prepares the return from the slips; a partner reviews and signs it; the client is invoiced."

[trigger]
starters = ["partner", "reception"]

[[input]]
name = "year"
type = "number"
required = true

# Written as states and edges (see practicehub/states.py). A client has no state field: the run keeps where it is.
[start]
to = "preparing"

[[state]]
id = "preparing"
label = "Preparing"
tone = "active"

[[state.work]]
id = "prepare"
title = "Prepare the return"
kind = "task"
role = "preparer"
skill = "return-prep"
risk = "medium"
context = ["record:tax", "record:profile", "input"]

[[edge]]
id = "prepared"
from = "preparing"
to = "in-review"

[[state]]
id = "in-review"
label = "In review"
tone = "attention"

[[state.work]]
id = "review"
title = "Review the return"
kind = "task"
role = "partner"
review_of = "prepare"
persons_only = true
context = ["record:tax"]
[[state.work.fields]]
name = "income"
type = "number"
required = true
[[state.work.fields]]
name = "summary"
type = "text"
required = true

[[edge]]
id = "reviewed"
from = "in-review"
to = "signing"

[[state]]
id = "signing"
label = "To sign"
tone = "attention"

[[state.work]]
id = "sign"
title = "Sign and file"
kind = "gate"
role = "partner"
signer = "person"
meaning = "I have reviewed this return and it is complete and accurate"
context = ["review"]

[[edge]]
id = "file"
label = "File"
from = "signing"
to = "filed"

[[edge.do]]
id = "invoice"
title = "Invoice the client"
action = "record.create"
[edge.do.params]
type = "Invoice"
[edge.do.params.data]
subject = { reference = "{{run.record}}" }
description = "Personal return {{input.year}}"
amount = 150

[[edge]]
id = "return-to-preparer"
label = "Return to the preparer"
from = "signing"
to = "returned"

[[state]]
id = "filed"
label = "Filed"
tone = "done"

[[state]]
id = "returned"
label = "Returned to the preparer"
tone = "ended"
