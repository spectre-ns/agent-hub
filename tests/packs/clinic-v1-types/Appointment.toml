# A booked visit. The first participant is the patient; the others are the physicians and staff.
id = "Appointment"
label = "Appointment"
plural = "Appointments"
data_class = "visits"            # version 1 kept it in "scheduling", which version 2 folds into "visits"
strict = true
extends = "Booking"           # the core's calendar, free slots and booking.book handle it
date = "start"
active = "record.status in ['proposed', 'pending', 'booked', 'arrived', 'checked-in']"
order = 90
summary = "A booked visit: the patient, who they see, and when."

[base]                        # where an appointment keeps what the core's Booking has
reason = "description"
subject = "patient"
with = "participants"         # the practitioners among them are the members whose time it holds
cancelled = { when = "record.status in ['cancelled', 'noshow', 'entered-in-error']" }

[[field]]
name = "status"
type = "choice"
choices = ["proposed", "pending", "booked", "arrived", "fulfilled", "cancelled", "noshow", "entered-in-error",
           "checked-in", "waitlist"]
required = true

[[field]]
name = "description"
label = "Reason"
type = "string"

[[field]]
name = "start"
type = "datetime"
required = true

[[field]]
name = "end"
type = "datetime"

[[field]]
name = "minutesDuration"
label = "Minutes"
type = "number"

[[field]]
name = "participant"
label = "Participants (as JSON)"
type = "list"
required = true
advanced = true
help = "[{actor: {reference}, status}], the patient first"

[[field]]
name = "patient"
label = "Patient"
path = "participant.0.actor"
type = "reference"
target = ["Patient"]
with = { status = "accepted" }
rel = "subject"
required = true
help = "the first participant is the patient the appointment is for"

[[field]]
name = "practitioner"
label = "With"
path = "participant.1.actor"
type = "reference"
target = ["Practitioner"]
rel = "participant"
help = "the physician or staff member the patient sees"

[[field]]
name = "participants"
label = "Everyone taking part"
path = "participant.*.actor"
type = "reference"
target = ["Patient", "Practitioner"]
with = { status = "accepted" }
rel = "participant"

[[field]]
name = "serviceType"
label = "Service type"
type = "list"
advanced = true

[[field]]
name = "reasonCode"
label = "Reason codes"
type = "list"
advanced = true

[[field]]
name = "comment"
type = "text"

[[field]]
name = "cancelationReason"
label = "Cancellation reason (coded)"
type = "object"
advanced = true

[[field]]
name = "cancellation_reason"
label = "Cancellation reason"
path = "cancelationReason.text"
type = "string"

[[screen]]
id = "booking"
on = ["create"]
fields = ["patient", "practitioner", "start", "minutesDuration", "end", "description", "comment"]

[lifecycle]
field = "status"
initial = "proposed"
[[lifecycle.transition]]
from = ["proposed", "pending", "waitlist"]
to = "booked"
[[lifecycle.transition]]
from = ["booked"]
to = "arrived"
[[lifecycle.transition]]
from = ["booked"]
to = "checked-in"
[[lifecycle.transition]]
from = ["arrived", "checked-in"]
to = "fulfilled"
[[lifecycle.transition]]
from = ["proposed", "pending", "booked", "waitlist"]
to = "cancelled"
[[lifecycle.transition]]
from = ["booked"]
to = "noshow"
[[lifecycle.transition]]
from = ["*"]
to = "entered-in-error"
