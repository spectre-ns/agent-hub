id = "visit-coding"
title = "Code a visit for billing"
instructions = """
Choose the fee code for the visit from the allowed values, using the visit type, its length and the diagnosis codes
the physician chose. Do not read or infer anything from clinical notes; billing works from the visit summary.
Amounts follow the practice fee schedule: minor assessment 35, complete assessment 65, counselling 55 per unit,
prescription renewal without a visit 15.
"""

[[output]]
name = "fee_code"
type = "choice"
choices = ["minor-assessment", "complete-assessment", "counselling", "renewal-no-visit"]
required = true

[[output]]
name = "units"
type = "number"
required = true
min = 1
max = 4

[[output]]
name = "amount"
type = "number"
required = true
min = 0

[[output]]
name = "note"
type = "string"
