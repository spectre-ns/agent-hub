# A billable service, from the fee schedule.
id = "ChargeItem"
label = "Charge"
plural = "Charges"
data_class = "billing"
standard = "fhir-r4"
strict = true
date = "occurrenceDateTime"
active = "record.status in ['planned', 'coded', 'on-hold', 'billable']"
# A visit's charge is made when its note is signed (planned), and walked by one workflow: coded by billing, then the
# claim submitted (billable) or held for billing staff (on-hold). Its status is where that work is.
workflow = { id = "visit-claim", when = "record.status == 'planned'" }
order = 120
summary = "A billable service, from the fee schedule."
part_of = "context"

[[field]]
name = "status"
type = "choice"
choices = ["planned", "coded", "on-hold", "billable", "not-billable", "aborted", "billed", "entered-in-error", "unknown"]
required = true
help = "planned is to code, billable submitted; coded (to submit) and on-hold (held for billing staff) are the practice's own"

[[field]]
name = "code"
label = "Fee code"
type = "object"
required = true

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "context"
label = "Visit"
type = "reference"
target = ["Encounter"]
rel = "encounter"
required = true

[[field]]
name = "occurrenceDateTime"
label = "Date of service"
type = "datetime"

[[field]]
name = "quantity"
label = "Units (as JSON)"
type = "object"
advanced = true

[[field]]
name = "units"
path = "quantity.value"
type = "number"

[[field]]
name = "priceOverride"
label = "Amount (as JSON)"
type = "object"
advanced = true
help = "{value, currency: CAD}"

[[field]]
name = "amount"
path = "priceOverride.value"
type = "number"

[[field]]
name = "enterer"
type = "object"

[[field]]
name = "account"
type = "list"

[[field]]
name = "note"
type = "list"

[lifecycle]
field = "status"
initial = "planned"
labels = { planned = "To code", coded = "To submit", "on-hold" = "Held", billable = "Billable", "not-billable" = "Not billable", aborted = "Aborted", billed = "Billed", "entered-in-error" = "Entered in error" }
abandoned = { planned = "aborted", coded = "aborted" }   # its work cancelled: the charge is too
tones = { planned = "waiting", coded = "waiting", "on-hold" = "attention", billable = "done", "not-billable" = "ended", aborted = "ended", billed = "done", "entered-in-error" = "ended" }
[[lifecycle.transition]]
from = ["planned", "coded"]
to = "aborted"
by = "workflow"   # its claim's work cancelled (lifecycle.abandoned)
[[lifecycle.transition]]
from = ["*"]
to = "entered-in-error"
