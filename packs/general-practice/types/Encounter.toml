# A visit, from booking to the end: when it is booked for and with whom (the practice calendar), then what billing
# needs (who, when, how long), never the note itself. Why the patient comes and the diagnosis codes (reasonCode) are
# clinical: the front desk and the scheduling agent book and move a visit without ever seeing them; billing is given
# the codes on the claim. FHIR R5 Encounter: a booked visit is ``planned`` with plannedStartDate/plannedEndDate; it
# is the calendar's Booking. There is no separate appointment: a visit asked for is a visit, ``requested``, with no
# time yet, and the same record is booked, checked in, seen, documented and completed (the appointment workflow).
# What the visit is for (serviceType: a check-up, forms) and how soon (priority) are not clinical: the front desk
# books with them and the calendar shows them. Why the patient comes, why an urgent visit was squeezed in over another
# and the diagnosis billed (diagnosis, kept apart from the booked reason) are clinical.
id = "Encounter"
label = "Visit"
plural = "Visits"
data_class = "visits"
standard = "fhir-r4"
extends = "Booking"
strict = true
date = "plannedStartDate"
active = "record.status in ['requested', 'planned', 'arrived', 'triaged', 'in-progress', 'onleave']"
# Every visit is worked from open to closed by one workflow: asked for (requested) or booked straight on the calendar
# (planned) or a walk-in (arrived), it is screened and booked, checked in, seen, documented, signed and completed, or
# cancelled (late: under the missed-appointment policy) or a no-show. Its status is where that work is. A visit filed
# after the fact is filed under way (in-progress): it is documented, signed and billed the same way. One filed already
# completed (finished, from an old chart) is not walked.
workflow = { id = "appointment-request", when = "record.status in ['requested', 'planned', 'arrived', 'in-progress']" }
order = 70
summary = "A visit, from booking to the end: when and with whom, then what billing needs, never the note itself."

# The calendar reads a visit through the core's Booking: booked start and end, the reason, the patient, the
# physicians, and whether it no longer holds the time (cancelled, a no-show, entered in error).
[base]
start = "plannedStartDate"
end = "plannedEndDate"
reason = "reason_text"
subject = "subject"
with = "practitioners"
cancelled = { when = "record.status in ['cancelled', 'noshow', 'entered-in-error']" }
kind = "booking_reason"
priority = "urgency"
overbooked = "urgency_reason"

# How the calendar books a visit. A nurse or physician may squeeze an urgent visit in over a booked one, saying why;
# the calendar marks the urgent and soon ones. The front desk (who may not read the reason) books through the
# appointment request, whose red-flag screen sends a worrying reason to a nurse instead of booking it.
[booking]
marked = ["soon", "urgent"]
overbook = ["physician", "nurse"]
overbook_label = "Squeeze in as urgent"
overbook_reason = "Why it cannot wait"
overbook_priority = "urgent"
request = "appointment-request"
request_inputs = ["kind", "reason", "urgency"]

[[field]]
name = "status"
type = "choice"
choices = ["requested", "planned", "arrived", "triaged", "in-progress", "onleave", "finished", "undocumented", "cancelled", "noshow",
           "entered-in-error", "unknown"]
required = true
help = "planned is booked, arrived checked in, finished completed; requested (asked for, no time yet), undocumented (completed, its note discarded) and noshow are the practice's own"

[[field]]
name = "plannedStartDate"
label = "Booked for"
type = "datetime"
required = true
required_unless = "record.status in ['requested', 'cancelled', 'finished']"   # asked for: no time yet; handled on the phone: never booked

[[field]]
name = "plannedEndDate"
label = "Booked until"
type = "datetime"

[[field]]
name = "class"
label = "Setting (coded)"
type = "object"
advanced = true
help = "a Coding: {system: v3-ActCode, code: AMB, display: ambulatory} (VR virtual, HH home)"

[[field]]
name = "setting"
label = "Setting"
path = "class.code"
type = "choice"
choices = ["AMB", "VR", "HH"]
labels = { AMB = "In clinic", VR = "Virtual", HH = "Home visit" }
with = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode" }
help = "AMB in the clinic, VR virtual, HH at home"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "type"
label = "Visit types (as JSON)"
type = "list"
advanced = true
help = "[{text: minor | complete | counselling}]"

[[field]]
name = "visit_type"
label = "Visit type"
path = "type.0.text"
type = "choice"
choices = ["minor", "complete", "counselling"]

[[field]]
name = "serviceType"
label = "Visit for (as JSON)"
type = "list"
advanced = true
help = "CodeableReference list: [{concept: {text: check-up | follow-up | ...}}]"

[[field]]
name = "booking_reason"
label = "Visit for"
path = "serviceType.0.concept.text"
type = "choice"
choices = ["check-up", "follow-up", "new-concern", "prescription-renewal", "test-results", "forms", "immunization",
           "prenatal", "well-baby", "counselling", "procedure"]
help = "what the visit is booked for, as the front desk and the calendar see it; why the patient comes is the reason"

[[field]]
name = "priority"
label = "Priority (as JSON)"
type = "object"
advanced = true
help = "a CodeableConcept: {coding: [{code: routine | soon | urgent}], text: why it cannot wait}"

[[field]]
name = "urgency"
label = "How soon"
path = "priority.coding.0.code"
type = "choice"
choices = ["routine", "soon", "urgent"]

[[field]]
name = "urgency_reason"
label = "Why it cannot wait"
path = "priority.text"
type = "string"
data_class = "clinical"
help = "said by the nurse or physician who squeezed the visit in over another booking"

[[field]]
name = "period"
label = "Period (as JSON)"
type = "object"
advanced = true
help = "{start, end}"

[[field]]
name = "period_start"
label = "Start"
path = "period.start"
type = "datetime"

[[field]]
name = "period_end"
label = "End"
path = "period.end"
type = "datetime"

[[field]]
name = "length"
label = "Length (as JSON)"
type = "object"
advanced = true
help = "a Duration: {value, unit: min}"

[[field]]
name = "minutes"
label = "Minutes"
path = "length.value"
type = "number"
with = { unit = "min" }

[[field]]
name = "reasonCode"
label = "Reason codes (as JSON)"
type = "list"
advanced = true
data_class = "clinical"
help = "CodeableConcept list: [{coding: [{system: icd-9-cm, code}], text}]"

[[field]]
name = "reason_text"
label = "Reason"
path = "reasonCode.0.text"
type = "string"
data_class = "clinical"

[[field]]
name = "diagnosis"
label = "Diagnoses (as JSON)"
type = "list"
advanced = true
data_class = "clinical"
help = "[{condition: [{concept: {text: ICD-9 ...}}]}]: what was billed, apart from the booked reason"

[[field]]
name = "diagnosis_text"
label = "Diagnosis codes"
path = "diagnosis.0.condition.0.concept.text"
type = "string"
data_class = "clinical"

[[field]]
name = "participant"
label = "Participants (as JSON)"
type = "list"
advanced = true
help = "[{individual: {reference: Practitioner/<id>}}]"

[[field]]
name = "practitioner"
label = "Physician"
path = "participant.0.individual"
type = "reference"
target = ["Practitioner"]
rel = "participant"

[[field]]
name = "practitioners"
label = "Everyone who took part"
path = "participant.*.individual"
type = "reference"
target = ["Practitioner"]
rel = "participant"

[[field]]
name = "extension"
label = "Extensions (as JSON)"
type = "list"
advanced = true
help = "what FHIR has no field for: why a booking was cancelled (url .../cancellation-reason, valueString), a note"

[[field]]
name = "requested_by"
label = "Asked for by"
type = "member"
by = "workflow"
help = "the member who took the request (the patient on the portal, the front desk on the phone)"

# Who cancelled a booking: the patient (on the phone, the portal) or the practice (the physician away). Only the
# patient's late cancellation falls under the missed-appointment policy; one the practice made never does.
[[field]]
name = "cancelled_by"
label = "Cancelled by"
type = "choice"
choices = ["patient", "practice"]
labels = { patient = "The patient", practice = "The practice" }
help = "the patient (the policy's notice applies) or the practice (no fee; the patient is told and asked to rebook)"

[[field]]
name = "serviceProvider"
label = "Service provider"
type = "object"
advanced = true

[[screen]]
id = "visit"
on = ["create"]
fields = ["subject", "practitioner", "plannedStartDate", "plannedEndDate", "booking_reason", "reason_text", "urgency",
          "visit_type", "setting"]

# A visit is asked for (requested) and booked (planned), or booked straight away; the patient is checked in (arrived),
# may be triaged, is seen (in progress), and the visit is completed (finished) once its note is signed. Or a request is
# not booked after all (cancelled), a booking is cancelled, or the patient does not come (noshow). The appointment
# workflow makes the moves marked by = "workflow"; people check in, start the visit, cancel and mark a no-show here.
[lifecycle]
starts = ["in-progress"]   # a visit filed after the fact: under way, documented, signed and billed like any other
field = "status"
initial = "planned"
labels = { requested = "Requested", planned = "Booked", arrived = "Checked in", finished = "Completed", undocumented = "Completed: no note", onleave = "Patient stepped out", noshow = "No-show", "in-progress" = "In progress", "entered-in-error" = "Entered in error" }
abandoned = { requested = "cancelled", planned = "cancelled" }   # its work cancelled: the request or booking is too
[[lifecycle.transition]]
from = ["requested"]
to = "planned"
by = "workflow"
label = "Book"
[[lifecycle.transition]]
from = ["requested"]
to = "finished"
by = "workflow"
label = "Handled on the phone"
[[lifecycle.transition]]
from = ["requested"]
to = "cancelled"
by = "workflow"
# Checking in opens two hours before the visit is booked for, and a no-show only once its time has come: the desk who
# opens tomorrow's visit by mistake cannot mark it missed (which messages the patient and frees the slot).
[[lifecycle.transition]]
from = ["planned"]
to = "arrived"
label = "Check in"
opens = "plannedStartDate - 2h"
[[lifecycle.transition]]
from = ["arrived"]
to = "triaged"
label = "Mark triaged"
[[lifecycle.transition]]
from = ["arrived", "triaged"]
to = "in-progress"
label = "Start the visit"
[[lifecycle.transition]]
from = ["onleave"]
to = "in-progress"
label = "Patient is back"
# The patient steps out (for a urine sample, to the lab) and comes back: a side move, never the main button.
[[lifecycle.transition]]
from = ["in-progress"]
to = "onleave"
label = "Patient stepped out"
[[lifecycle.transition]]
from = ["in-progress", "onleave"]
to = "finished"
by = "workflow"
[[lifecycle.transition]]
from = ["planned", "arrived", "triaged"]
to = "finished"
by = "workflow"
# Its draft note discarded: the visit took place but has no note (Completed: no note, never plain Completed), with
# the physician asked to write it; once they have, it is completed.
[[lifecycle.transition]]
from = ["in-progress", "onleave"]
to = "undocumented"
by = "workflow"
label = "Complete without a note"
[[lifecycle.transition]]
from = ["undocumented"]
to = "finished"
by = "workflow"
label = "Note written"
# Cancelling asks who cancelled, and says how much notice that is: a patient's cancellation with less than 24 hours'
# notice runs the missed-appointment policy on the visit's own run. Without an answer (the portal: the patient
# themselves) it is the patient's.
[[lifecycle.transition]]
from = ["planned", "arrived"]
to = "cancelled"
label = "Cancel the visit"
fields = ["cancelled_by"]
confirm = "Cancelled now, that is {plannedStartDate:notice}. Cancelled by the patient with less than 24 hours' notice, the missed-appointment policy applies (a reminder, or a fee) and the patient is told; cancelled by the practice, no fee, and the patient is told and asked to rebook. The {plannedStartDate:time} slot is freed."
[[lifecycle.transition]]
from = ["planned"]
to = "noshow"
label = "Mark no-show"
opens = "plannedStartDate"
confirm = "The patient will be messaged under the missed-appointment policy (a fee may apply), and the {plannedStartDate:time} slot freed for someone else."
[[lifecycle.transition]]
from = ["*"]
to = "entered-in-error"
