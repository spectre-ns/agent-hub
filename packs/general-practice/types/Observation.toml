# A result: a lab value, a vital sign. A lab result is walked by its review (review: to sort, in review, closed); the
# physician's review is written back (status final, reviewed-by extensions).
id = "Observation"
label = "Lab result"
plural = "Lab results"
data_class = "clinical"
standard = "fhir-r4"
strict = true
date = "effectiveDateTime"
flag = "interpretation.0.text"
active = "not record.status in ['cancelled', 'entered-in-error']"
order = 40
# A lab result is part of its patient: reached through their chart (Patient > Lab results > Lab result), listed
# there, never moved to another patient. Review work and the inbox still find it.
part_of = "subject"
summary = "A result: a lab value or a vital sign, and the physician's review of it."
# where its name travels (its work in the inbox, crumbs, tabs): the test and its value; the lab's flag and status are
# beside it, not in it
short_title = "{test}[ {value}][ {unit}]"
# A result filed (by the lab, an import, a person) is walked by its review: sorted, reviewed by a physician, closed
# once the review has told the patient or started what follows (a call, a visit); corrected by the lab, it is reviewed
# again. Its review, not its status, is where that work is: the lab's own status (preliminary, final, corrected) stays
# the lab's to move while a physician reviews it. A vital sign taken in the clinic is not reviewed.
workflow = { id = "lab-result-review", when = "record.review == 'received' and record.category_text != 'vital-signs'" }

[[field]]
name = "status"
type = "choice"
choices = ["registered", "preliminary", "final", "amended", "corrected", "cancelled", "entered-in-error", "unknown"]
required = true

[[field]]
name = "category"
label = "Categories (as JSON)"
type = "list"
advanced = true
help = "[{text: laboratory | vital-signs | ...}]"

[[field]]
name = "category_text"
label = "Category"
path = "category.0.text"
type = "string"
help = "laboratory, vital-signs, ..."

[[field]]
name = "code"
label = "Test (coded)"
type = "object"
required = true
advanced = true

[[field]]
name = "test"
label = "Test"
path = "code.text"
type = "string"
help = "what was measured, e.g. HbA1c"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "encounter"
label = "Visit"
type = "reference"
target = ["Encounter"]
rel = "encounter"

[[field]]
name = "basedOn"
label = "Based on (as JSON)"
type = "list"
advanced = true

[[field]]
name = "orders"
label = "Ordered by"
path = "basedOn.*"
type = "reference"
target = ["ServiceRequest", "MedicationRequest"]
rel = "basedOn"

[[field]]
name = "effectiveDateTime"
label = "Taken"
type = "datetime"

[[field]]
name = "issued"
type = "datetime"

[[field]]
name = "performer"
label = "Performers (as JSON)"
type = "list"
advanced = true

[[field]]
name = "valueQuantity"
label = "Value and unit (as JSON)"
type = "object"
advanced = true
help = "{value, unit}"

[[field]]
name = "value"
label = "Value"
path = "valueQuantity.value"
type = "number"

[[field]]
name = "unit"
label = "Unit"
path = "valueQuantity.unit"
type = "string"
help = "e.g. mmol/L, %"

[[field]]
name = "valueString"
label = "Value (text)"
type = "string"

[[field]]
name = "valueCodeableConcept"
label = "Value (coded)"
type = "object"
advanced = true

[[field]]
name = "interpretation"
label = "Flags (as JSON)"
type = "list"
advanced = true
help = "[{coding: [{system: v3-ObservationInterpretation, code: N | H | L | A | AA}], text: normal | abnormal | critical}]"

[[field]]
name = "flag_text"
label = "Flag"
path = "interpretation.0.text"
type = "string"
help = "normal, abnormal or critical"

[[field]]
name = "referenceRange"
label = "Reference range (as JSON)"
type = "list"
advanced = true
help = "[{low: {value, unit}, high: {value, unit}, text}]"

[[field]]
name = "range_text"
label = "Reference range"
path = "referenceRange.0.text"
type = "string"
help = "e.g. 4.0-6.0 %"

[[field]]
name = "note"
label = "Notes"
type = "list"
advanced = true

[[field]]
name = "note_text"
label = "Note"
path = "note.0.text"
type = "text"

[[field]]
name = "extension"
label = "Review (as JSON)"
type = "list"
advanced = true
help = "the physician's review: reviewed-by (valueReference), reviewed-on (valueDateTime), review-outcome"

[[field]]
name = "review"
label = "Review"
type = "choice"
choices = ["received", "checking", "sorting", "reviewed", "told", "closed", "not-told"]
labels = { received = "In review", checking = "Checking", sorting = "To sort", reviewed = "Reviewed", told = "Patient told", closed = "Closed", not-told = "Patient not told" }
help = "where the physician's review of the result is"

[[screen]]
id = "result"
on = ["create"]
fields = ["subject", "status", "test", "category_text", "effectiveDateTime", "value", "unit", "valueString", "range_text",
          "flag_text", "encounter", "note_text"]

# The review: its states and the moves between them are the lab-result-review workflow's (written as states and
# edges), not listed here: nobody moves a result its review is walking by hand. Here are only the hand moves left: a
# closed result reviewed again, and the moves out of where reviews of earlier pack versions left a result.
# Reviewed, Patient told and Patient not told are where a review of pack 4.5 or before left a result: a review now
# closes the result once it has told the patient or started the call or visit that follows (a record of its own).
[lifecycle]
field = "review"
initial = "received"
[[lifecycle.transition]]
from = ["reviewed", "told"]
to = "closed"
label = "Close"
# only a physician's signature closes a result the patient was not told of (see the signature below)
[[lifecycle.transition]]
from = ["not-told"]
to = "closed"
by = "workflow"
label = "Closed: the patient was told"
# a result the lab corrects is reviewed again: the lab sending its corrected result (lab.result naming it) starts a
# new review, which moves it back to be sorted
[[lifecycle.transition]]
from = ["closed", "not-told"]
to = "received"
label = "Review again"

# A result its review left with the patient not told (not reached, a visit booked, the review cancelled) stays open
# until a physician signs that the patient was told: that signature closes it.
[[signature]]
meaning = "Patient told"
roles = ["physician"]
states = ["not-told"]
moves_to = "closed"
