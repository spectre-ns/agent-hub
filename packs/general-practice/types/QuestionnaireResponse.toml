# A completed intake form.
id = "QuestionnaireResponse"
label = "Intake form"
plural = "Intake forms"
data_class = "intake"
standard = "fhir-r4"
strict = true
date = "authored"
active = "record.status != 'entered-in-error'"
order = 95
summary = "A completed intake form."
part_of = "subject"
# A registration (a person asking to join the practice) is walked by the new-patient intake until it is accepted,
# waitlisted or declined; any other form starts nothing.
workflow = { id = "new-patient-intake", when = "record.registration == 'received'" }

[[field]]
name = "status"
type = "choice"
choices = ["in-progress", "completed", "amended", "entered-in-error", "stopped"]
required = true

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "questionnaire"
type = "string"
help = "which form, e.g. new-patient-intake"

[[field]]
name = "authored"
label = "Completed"
type = "datetime"

[[field]]
name = "source"
type = "reference"
target = ["Patient", "RelatedPerson", "Practitioner"]
rel = "source"

[[field]]
name = "item"
label = "Answers"
type = "list"
help = "[{linkId, answer: [{valueString | valueBoolean | ...}]}]"

[[field]]
name = "registration"
label = "Registration"
type = "choice"
choices = ["received", "checked", "accepted", "waitlisted", "declined", "withdrawn", "closed"]
help = "on a registration form only: where the practice's intake of the person is"

# The registration: its states and the moves between them are the new-patient intake's (written as states and edges),
# not listed here. A registration whose intake is cancelled is withdrawn (the person stays inactive: never taken in
# silently).
[lifecycle]
field = "registration"
initial = "received"
abandoned = { received = "withdrawn", checked = "withdrawn" }
[[lifecycle.transition]]
from = ["received", "checked"]
to = "closed"
by = "workflow"
