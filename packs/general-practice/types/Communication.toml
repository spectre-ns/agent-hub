# A message or letter to or from a patient, a pharmacy, a specialist.
id = "Communication"
label = "Message"
plural = "Messages"
data_class = "correspondence"
standard = "fhir-r4"
strict = true
date = "sent"
active = "not record.status in ['completed', 'entered-in-error', 'not-done', 'stopped']"
part_of = "subject"
order = 100
summary = "A message or letter to or from a patient, a pharmacy, a specialist."
# A patient's message (one received for handling) is walked by its own workflow from received to closed: its
# handling is where that work is. A letter or a fax the practice files (completed) starts none, and may be filed
# closed straight away.
workflow = { id = "patient-question", when = "record.handling == 'received' and record.status == 'in-progress'" }

[[field]]
name = "status"
type = "choice"
choices = ["preparation", "in-progress", "not-done", "on-hold", "stopped", "completed", "entered-in-error", "unknown"]
required = true

[[field]]
name = "category"
type = "list"

[[field]]
name = "medium"
type = "list"
help = "portal, fax, phone, letter"
advanced = true

[[field]]
name = "medium_text"
label = "Sent by"
path = "medium.0.text"
type = "string"
help = "portal, fax, phone, letter"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "topic"
type = "object"

[[field]]
name = "about"
type = "list"

[[field]]
name = "sent"
type = "datetime"

[[field]]
name = "received"
type = "datetime"

[[field]]
name = "recipient"
type = "list"

[[field]]
name = "sender"
type = "object"

[[field]]
name = "payload"
type = "list"
help = "[{contentString}]"
advanced = true

[[field]]
name = "message"
label = "Message"
path = "payload.0.contentString"
type = "text"

[[field]]
name = "note"
type = "list"

[[field]]
name = "handling"
label = "Handling"
type = "choice"
choices = ["received", "to-call", "not-reached", "drafting", "to-check", "with-nurse", "triaged", "answered", "closed"]
labels = { received = "Waiting to be read", to-call = "To call now", not-reached = "Could not reach", drafting = "Reply being drafted", to-check = "Reply to check", with-nurse = "With a nurse", triaged = "Triaged", answered = "Answered", closed = "Closed" }
help = "where the practice's handling of a patient's message is"

# The handling: its states and the moves between them are the patient-question workflow's (written as states and
# edges), not listed here. A message no run walks (one entered as received by hand) stays waiting to be read until
# someone closes it: a patient's message is never closed unread. Triaged is where a run of pack 4.5 or before left a
# message: screened and with whoever answers it.
[lifecycle]
field = "handling"
initial = "received"
starts = ["closed"]
labels = { received = "Waiting to be read", to-call = "To call now", not-reached = "Could not reach", drafting = "Reply being drafted", to-check = "Reply to check", with-nurse = "With a nurse", triaged = "Triaged", answered = "Answered", closed = "Closed" }
abandoned = { to-call = "closed", not-reached = "closed", drafting = "closed", to-check = "closed", with-nurse = "closed", triaged = "closed", answered = "closed" }
ended = { received = "closed", triaged = "closed", answered = "closed" }
# the moves a run of pack 4.5 or before still makes: screened (triaged), then answered
[[lifecycle.transition]]
from = ["received"]
to = "triaged"
by = "workflow"
label = "Triaged"
[[lifecycle.transition]]
from = ["triaged"]
to = "answered"
by = "workflow"
label = "Answered"
# where its work cancelled leaves it (and where an older run that ended left it): closed, by the workflow
[[lifecycle.transition]]
from = ["to-call", "not-reached", "drafting", "to-check", "with-nurse", "triaged", "answered"]
to = "closed"
by = "workflow"
label = "Closed"
[[lifecycle.transition]]
from = ["received"]
to = "closed"
label = "No answer needed"
