# A referral to a specialist (or a requisition), signed by the referring physician.
id = "ServiceRequest"
label = "Referral"
plural = "Referrals"
data_class = "clinical"
standard = "fhir-r4"
strict = true
date = "authoredOn"
active = "record.status in ['draft', 'active', 'on-hold']"
part_of = "subject"
order = 80
summary = "A referral to a specialist (or a requisition), signed by the referring physician."
# A referral being written (a draft order) is walked by its own workflow from asked for to the specialist's report:
# its stage is where that work is (its FHIR status, the standard's few words for it, is set on the way). Asked for on
# the chart or written at a visit (the visit makes it), either way the referral starts its workflow when it is made;
# one the physician files as already sent (active), or a lab order, starts none.
workflow = { id = "referral", when = "record.status == 'draft' and record.intent == 'order'" }

# Links a person makes by hand on the referral's page: the chart items sent with the letter, and the specialist's
# report once it is filed (its referral is closed only with it: the referral workflow's report step asks for it).
[[link]]
rel = "sent-with"
label = "Sent with the letter"
to = ["Observation", "DiagnosticReport", "Condition", "MedicationRequest", "Immunization", "AllergyIntolerance"]
help = "results, problems and medications the specialist should see"
back = "Sent with a referral"

[[link]]
rel = "report"
label = "Specialist's report"
to = ["DiagnosticReport"]
many = false
help = "the report the specialist sent back, filed on the chart"
back = "Report for a referral"

# The FHIR status: set by the referral workflow as it goes (active once signed and sent, completed with the report,
# revoked when not sent or declined); a person puts a sent referral on hold, resumes it, or marks it entered in error.
[[field]]
name = "status"
type = "choice"
choices = ["draft", "active", "on-hold", "revoked", "completed", "entered-in-error", "unknown"]
labels = { draft = "Being written", active = "Sent", on-hold = "On hold", completed = "Report received", revoked = "Cancelled", entered-in-error = "Entered in error" }
required = true

[[field]]
name = "stage"
label = "Stage"
type = "choice"
choices = ["filed", "drafting", "finalizing", "signing", "sent", "booked", "declined", "report-received", "cancelled"]
labels = { filed = "Filed", drafting = "Being written", finalizing = "Letter to finalize", signing = "To sign", sent = "Sent", booked = "Booked with the specialist", declined = "Declined by the specialist", report-received = "Report received", cancelled = "Cancelled" }
help = "where the referral's work is"

[[field]]
name = "intent"
type = "choice"
choices = ["proposal", "plan", "directive", "order", "original-order", "reflex-order", "filler-order",
           "instance-order", "option"]
required = true
help = "order, for a referral the physician signs"

[[field]]
name = "priority"
type = "choice"
choices = ["routine", "urgent", "asap", "stat"]

# A referral to a specialist, or a lab test ordered (a requisition): the visit's signed note makes either.
[[field]]
name = "category"
label = "Kind (as JSON)"
type = "list"
advanced = true
help = "CodeableConcept list: [{text: referral | lab-test}]"

[[field]]
name = "kind"
label = "Kind"
path = "category.0.text"
type = "choice"
choices = ["referral", "lab-test"]
labels = { referral = "Referral", "lab-test" = "Lab test" }
help = "a referral to a specialist, or a lab test ordered (sent with the signed note)"

[[field]]
name = "code"
label = "Referral to (coded)"
type = "object"
required = true
advanced = true

[[field]]
name = "referral_to"
label = "Referral to"
path = "code.text"
type = "string"
help = "the service asked for, e.g. Cardiology consult"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "encounter"
label = "Visit"
type = "reference"
target = ["Encounter"]
rel = "encounter"

[[field]]
name = "authoredOn"
label = "Referred"
type = "datetime"

[[field]]
name = "requester"
label = "Referring physician"
type = "reference"
target = ["Practitioner"]
rel = "requester"

[[field]]
name = "performer"
label = "Specialists (as JSON)"
type = "list"
advanced = true

[[field]]
name = "specialist"
label = "Specialist"
path = "performer.0.display"
type = "string"
help = "who the patient is referred to, in words"

[[field]]
name = "reasonCode"
label = "Reason codes (as JSON)"
type = "list"
advanced = true

[[field]]
name = "reason_text"
label = "Reason"
path = "reasonCode.0.text"
type = "string"

[[field]]
name = "supportingInfo"
label = "Supporting information (as JSON)"
type = "list"
advanced = true

[[field]]
name = "note"
label = "Notes (as JSON)"
type = "list"
advanced = true
help = "the signed letter, and what was sent with it"

[[field]]
name = "note_text"
label = "Note"
path = "note.0.text"
type = "text"

[[screen]]
id = "referral"
on = ["create"]
fields = ["subject", "status", "referral_to", "specialist", "priority", "intent", "reason_text", "requester", "authoredOn",
          "encounter", "note_text"]

# Its stages and the moves between them are the referral workflow's (written as states and edges), not listed here.
# Filed is where a referral (or a lab order) starts; its workflow starts only for a draft order. Its work cancelled, a
# referral not yet sent is cancelled (the workflow's on_cancel revokes its status); one already sent stays sent (the
# specialist has it). A run of an older version ending leaves it where it is.
[lifecycle]
field = "stage"
initial = "filed"
labels = { filed = "Filed", drafting = "Being written", finalizing = "Letter to finalize", signing = "To sign", sent = "Sent", booked = "Booked with the specialist", declined = "Declined by the specialist", report-received = "Report received", cancelled = "Cancelled" }
abandoned = { drafting = "cancelled", finalizing = "cancelled", signing = "cancelled" }
tones = { filed = "waiting", drafting = "active", finalizing = "active", signing = "attention", sent = "waiting", booked = "waiting", declined = "attention", report-received = "done", cancelled = "ended" }
