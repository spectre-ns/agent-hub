# A referral to a specialist (or a requisition), signed by the referring physician.
id = "ServiceRequest"
label = "Referral"
plural = "Referrals"
data_class = "clinical"
standard = "fhir-r4"
strict = true
date = "authoredOn"
active = "record.status in ['draft', 'active', 'on-hold']"
order = 80
summary = "A referral to a specialist (or a requisition), signed by the referring physician."
# A referral being written (a draft order) is walked by its own workflow from asked for to the specialist's report:
# its status is where that work is. Asked for on the chart or written at a visit (the visit makes it), either way the
# referral starts its workflow when it is made; one the physician files as already sent (active) starts none.
workflow = { id = "referral", when = "record.status == 'draft' and record.intent == 'order'" }

[[field]]
name = "status"
type = "choice"
choices = ["draft", "active", "on-hold", "revoked", "completed", "entered-in-error", "unknown"]
required = true

[[field]]
name = "intent"
type = "choice"
choices = ["proposal", "plan", "directive", "order", "original-order", "reflex-order", "filler-order",
           "instance-order", "option"]
required = true
help = "order, for a referral the physician signs"

[[field]]
name = "priority"
type = "choice"
choices = ["routine", "urgent", "asap", "stat"]

# A referral to a specialist, or a lab test ordered (a requisition): the visit's signed note makes either.
[[field]]
name = "category"
label = "Kind (as JSON)"
type = "list"
advanced = true
help = "CodeableConcept list: [{text: referral | lab-test}]"

[[field]]
name = "kind"
label = "Kind"
path = "category.0.text"
type = "choice"
choices = ["referral", "lab-test"]
labels = { referral = "Referral", "lab-test" = "Lab test" }
help = "a referral to a specialist, or a lab test ordered (sent with the signed note)"

[[field]]
name = "code"
label = "Referral to (coded)"
type = "object"
required = true
advanced = true

[[field]]
name = "referral_to"
label = "Referral to"
path = "code.text"
type = "string"
help = "the service asked for, e.g. Cardiology consult"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "encounter"
label = "Visit"
type = "reference"
target = ["Encounter"]
rel = "encounter"

[[field]]
name = "authoredOn"
label = "Referred"
type = "datetime"

[[field]]
name = "requester"
label = "Referring physician"
type = "reference"
target = ["Practitioner"]
rel = "requester"

[[field]]
name = "performer"
label = "Specialists (as JSON)"
type = "list"
advanced = true

[[field]]
name = "specialist"
label = "Specialist"
path = "performer.0.display"
type = "string"
help = "who the patient is referred to, in words"

[[field]]
name = "reasonCode"
label = "Reason codes (as JSON)"
type = "list"
advanced = true

[[field]]
name = "reason_text"
label = "Reason"
path = "reasonCode.0.text"
type = "string"

[[field]]
name = "supportingInfo"
label = "Supporting information (as JSON)"
type = "list"
advanced = true

[[field]]
name = "note"
label = "Notes (as JSON)"
type = "list"
advanced = true
help = "the signed letter, and what was sent with it"

[[field]]
name = "note_text"
label = "Note"
path = "note.0.text"
type = "text"

[[screen]]
id = "referral"
on = ["create"]
fields = ["subject", "referral_to", "specialist", "priority", "intent", "reason_text", "requester", "authoredOn",
          "encounter", "note_text"]

# The referral workflow moves it: signed and sent (active), the specialist's report filed (completed), or closed unsent
# or declined (revoked). Its work cancelled, a referral not yet sent is revoked; one already sent stays sent (the
# specialist has it). A run of an older version ending leaves it where it is.
[lifecycle]
field = "status"
initial = "draft"
labels = { draft = "Being written", active = "Sent", on-hold = "On hold", completed = "Report received", revoked = "Cancelled", entered-in-error = "Entered in error" }
abandoned = { draft = "revoked" }
[[lifecycle.transition]]
from = ["draft"]
to = "active"
by = "workflow"
label = "Signed and sent"
[[lifecycle.transition]]
from = ["active", "on-hold"]
to = "completed"
by = "workflow"
label = "Report received"
[[lifecycle.transition]]
from = ["active"]
to = "on-hold"
label = "Put on hold"
[[lifecycle.transition]]
from = ["on-hold"]
to = "active"
label = "Resumed"
[[lifecycle.transition]]
from = ["draft", "active", "on-hold"]
to = "revoked"
by = "workflow"
label = "Cancelled"
[[lifecycle.transition]]
from = ["*"]
to = "entered-in-error"
