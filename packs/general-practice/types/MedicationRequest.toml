# A prescription. A renewal request is a proposal (draft) that its workflow walks: prescribed, it becomes the active
# order and the one it replaces is marked completed; declined, or a visit booked instead, it is cancelled.
id = "MedicationRequest"
key = "RX"
label = "Prescription"
plural = "Prescriptions"
data_class = "clinical"
standard = "fhir-r4"
strict = true
date = "authoredOn"
active = "record.status == 'active'"
part_of = "subject"
order = 30
summary = "A prescription. A renewal request is a proposal its workflow prescribes or closes."
# A renewal request (a proposal, made as a draft) is walked by its own workflow from asked for to prescribed or closed:
# the request made, from the portal, the pharmacy or a person at the desk, is this record, and its status is where the
# work is (preparing, deciding, issuing, not-on-chart, writing, signing: stops of the renewal that FHIR's status has no
# code for, kept here as a visit keeps its own). A prescription a physician writes by hand (an order, not a proposal)
# starts no workflow: it is issued (made active) only by a physician's signature, "I prescribe this medication as
# written", with its directions and quantity.
workflow = { id = "prescription-renewal", when = "record.status == 'draft' and record.intent == 'proposal'" }

[[field]]
name = "status"
type = "choice"
choices = ["active", "on-hold", "cancelled", "completed", "entered-in-error", "stopped", "draft", "unknown",
           "preparing", "deciding", "issuing", "not-on-chart", "writing", "signing"]   # ...and a renewal's stops
required = true

[[field]]
name = "intent"
type = "choice"
choices = ["proposal", "plan", "order", "original-order", "reflex-order", "filler-order", "instance-order", "option"]
required = true
help = "order, for a prescription the physician writes"

[[field]]
name = "medicationCodeableConcept"
label = "Medication (coded)"
type = "object"
required = true
advanced = true

[[field]]
name = "medication"
label = "Medication"
path = "medicationCodeableConcept.text"
type = "string"
help = "the drug, strength and form, e.g. Ramipril 5 mg capsule"

[[field]]
name = "subject"
label = "Patient"
type = "reference"
target = ["Patient"]
rel = "subject"
required = true

[[field]]
name = "encounter"
label = "Visit"
type = "reference"
target = ["Encounter"]
rel = "encounter"

[[field]]
name = "authoredOn"
label = "Prescribed"
type = "datetime"

[[field]]
name = "requester"
label = "Prescriber"
type = "reference"
target = ["Practitioner"]
rel = "requester"

[[field]]
name = "dosageInstruction"
label = "Directions (as JSON)"
type = "list"
advanced = true

[[field]]
name = "directions"
label = "Directions"
path = "dosageInstruction.0.text"
type = "text"
help = "e.g. 1 capsule by mouth once daily"

[[field]]
name = "dispenseRequest"
label = "Dispense (as JSON)"
type = "object"
advanced = true
help = "{quantity: {value, unit}, numberOfRepeatsAllowed, expectedSupplyDuration: {value, unit: days}, validityPeriod}"

[[field]]
name = "quantity"
path = "dispenseRequest.quantity.value"
type = "number"

[[field]]
name = "quantity_unit"
label = "Quantity unit"
path = "dispenseRequest.quantity.unit"
type = "string"
help = "capsule, tablet, mL..."

[[field]]
name = "repeats"
path = "dispenseRequest.numberOfRepeatsAllowed"
type = "number"

[[field]]
name = "supply_days"
label = "Days supply"
path = "dispenseRequest.expectedSupplyDuration.value"
type = "number"
with = { unit = "days" }

[[field]]
name = "priorPrescription"
label = "Replaces"
path = "priorPrescription.reference"
type = "reference"
target = ["MedicationRequest"]
rel = "replaces"

[[field]]
name = "reasonCode"
label = "Reason codes (as JSON)"
type = "list"
advanced = true

[[field]]
name = "reason_text"
label = "Reason"
path = "reasonCode.0.text"
type = "string"

[[field]]
name = "note"
label = "Notes"
type = "list"
advanced = true

[[field]]
name = "note_text"
label = "Note"
path = "note.0.text"
type = "text"

[[screen]]
id = "prescription"
on = ["create"]
fields = ["subject", "medication", "directions", "quantity", "quantity_unit", "repeats", "supply_days", "intent",
          "requester", "authoredOn", "reason_text", "encounter", "priorPrescription", "note_text"]

[lifecycle]
field = "status"
initial = "draft"
# Its renewal cancelled, wherever it had got to, the request is closed.
abandoned = { draft = "cancelled", preparing = "cancelled", deciding = "cancelled", issuing = "cancelled", not-on-chart = "cancelled", writing = "cancelled", signing = "cancelled" }
# Issued only by the renewal workflow (its prescriber signed for it: the edges out of issuing and signing) or by a
# physician signing the order (a draft): never moved to active by hand, by a nurse or a service that writes clinical
# records. However it is issued, it says what is prescribed.
[[lifecycle.transition]]
from = ["draft", "issuing", "signing"]
to = "active"
by = "workflow"
label = "Issued"
requires = ["medication", "directions", "quantity"]
[[lifecycle.transition]]
from = ["active"]
to = "completed"
label = "Replaced by a renewal, or finished"
[[lifecycle.transition]]
from = ["active", "on-hold"]
to = "stopped"
[[lifecycle.transition]]
from = ["active"]
to = "on-hold"
[[lifecycle.transition]]
from = ["on-hold"]
to = "active"
by = "workflow"
label = "Back in force"
[[lifecycle.transition]]
from = ["draft"]
to = "cancelled"
[[lifecycle.transition]]
from = ["*"]
to = "entered-in-error"

# A prescription written by hand is issued by its prescriber's signature: a physician signs the draft order and it is
# active. On hold, the physician who signs it again puts it back in force.
[[signature]]
meaning = "I prescribe this medication as written"
roles = ["physician"]
states = ["draft", "on-hold"]
moves_to = "active"
