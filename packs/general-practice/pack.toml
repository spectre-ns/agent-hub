# A family medicine clinic. Everything clinical lives in this pack; the hub's core knows nothing about medicine.
#
# The practice and its people are fictional.

# 2: appointments and visits are one record, the Visit (an Encounter from booking to the end). pack.py's UPGRADES turns
# the appointments of a practice on version 1 into visits.
# 3: a visit keeps what it is booked for (serviceType, read by the front desk), how soon (priority) and what was billed
# (diagnosis) apart from the clinical reason; an urgent visit may be squeezed in over another; the front desk books
# through the appointment request's red-flag screen. UPGRADES moves diagnosis codes written over a reason.
version = "3"

[practice]
requires_core = "1.0"
id = "harbourview"
kind = "general-practice"
name = "Harbourview Family Medicine"
jurisdiction = "Nova Scotia, Canada"
privacy_law = "PHIA (Personal Health Information Act)"
data_residency = "Canada"
timezone = "America/Halifax"
escalation_role = "practice-manager"
shortcuts = ["start:appointment-request", "Encounter"]   # the top bar and sidebar
member_types = ["Practitioner"]   # a reference to Practitioner/<id> names a member of the practice
message_class = "correspondence"  # the outbox shows a message to those who read this class...
free_text_class = "clinical"      # ...and this one too when it quotes a patient's words or a clinician's answer
notes = """Agents here do administrative work: intake, scheduling, drafting, preparing, coding. Clinicians decide and
sign; no agent ever signs a clinical decision. Drafts written by agents are labelled as drafts until a clinician signs."""
# Said to every agent of this practice, in its system prompt.
agent_rules = [
  "You do not diagnose, prescribe, or give clinical advice: a question that needs clinical judgement is escalated.",
]

# How long a queued message may wait for its delivery connector before the clock escalates it, and who delivers it by
# hand when the connector is late (an urgent channel) or reports a failure. {to} is the recipient, in words.
[practice.outbox.page]
deadline_minutes = 5
urgent = true
deliver_role = "nurse"
task = "Phone {to}"

[practice.outbox.fax]
deadline_minutes = 120
deliver_role = "front-desk"
task = "Fax this to {to}"

[practice.outbox.patient-portal]
deadline_minutes = 240
deliver_role = "front-desk"
task = "Reach the patient another way"

# ---------------------------------------------------------------------------------------------------------- subject
# Who the practice's work is about. A law firm would say type = "Client" (or "Matter"), an accountancy "Client".

[subject]
type = "Patient"
label = "Patient"
plural = "Patients"
path = "patients"
registered_event = "patient.registered"
register_label = "Start new-patient intake"
# The registration form is the Patient type's own (types/Patient.toml), which extends the core's Subject.

# ------------------------------------------------------------------------------------------------------------ roles
# A role is held by people, agents or both. Workflows name roles, never people.

[[roles]]
id = "physician"
name = "Physician"
description = "Sees patients, writes and signs notes, prescribes, reviews results, refers."

[[roles]]
id = "nurse"
name = "Nurse"
description = "Triage, follow-up calls, patient education."

[[roles]]
id = "front-desk"
name = "Front desk"
description = "Registers patients, accepts new patients, books and changes appointments."

[[roles]]
id = "scheduler"
name = "Scheduler"
description = "Finds and books appointment slots. Sees contact details and the calendar, never clinical notes."

[[roles]]
id = "intake-coordinator"
name = "Intake coordinator"
description = "Checks new-patient paperwork is complete and flags what a person should look at."

[[roles]]
id = "documentation-assistant"
name = "Documentation assistant"
description = "Drafts visit notes from the visit transcript for the physician to edit and sign."

[[roles]]
id = "clinical-assistant"
name = "Clinical assistant"
description = "Prepares renewals, sorts incoming results and drafts referral letters for a physician's decision."

[[roles]]
id = "billing"
name = "Billing"
description = "Codes visits and submits claims."

[[roles]]
id = "practice-manager"
name = "Practice manager"
description = "Runs the practice: owns its workflows and policies, manages the team, handles what goes wrong."

[[roles]]
id = "medical-director"
name = "Medical director"
description = """Owns clinical policy with the practice manager: approves workflow and block changes that touch clinical
work, so no change waits on a single policy owner."""

[[roles]]
id = "patient-portal"
name = "Patient portal"
description = "The online portal: registers patients, takes their requests. A service, not a worker."

[[roles]]
id = "lab-interface"
name = "Lab interface"
description = "The laboratory feed: files results and starts their review. A service, not a worker."

# ----------------------------------------------------------------------------------------------------- data classes
# Permissions are granted per data class. Record types are FHIR R4 resources, so they can move to Medplum unchanged.

[[data_classes]]
id = "demographics"
name = "Demographics and contact"
record_types = ["Patient", "RelatedPerson", "Coverage"]

[[data_classes]]
id = "intake"
name = "Intake forms"
record_types = ["QuestionnaireResponse"]

[[data_classes]]
id = "visits"
name = "Visits: bookings, and what billing needs"
record_types = ["Encounter"]

[[data_classes]]
id = "clinical"
name = "Clinical record"
record_types = ["Composition", "Observation", "Condition", "AllergyIntolerance", "MedicationRequest",
                "MedicationStatement", "ServiceRequest", "DiagnosticReport", "Immunization"]

[[data_classes]]
id = "correspondence"
name = "Messages and letters"
record_types = ["Communication"]

[[data_classes]]
id = "billing"
name = "Billing"
record_types = ["ChargeItem", "Claim"]

# ----------------------------------------------------------------------------------------------------------- grants
# Writing a class implies reading it.

[grants.physician]
write = ["clinical", "visits", "correspondence"]
read = ["demographics", "intake", "billing"]

[grants.nurse]
write = ["clinical", "visits", "correspondence", "intake"]   # a nurse checks patients in and triages
read = ["demographics"]

[grants.front-desk]
write = ["demographics", "visits", "correspondence"]
read = ["intake"]

[grants.scheduler]
write = ["visits"]
read = ["demographics"]          # never clinical: a scheduling agent does not read notes

[grants.intake-coordinator]
write = ["intake"]
read = ["demographics", "visits"]

[grants.documentation-assistant]
read = ["clinical", "intake", "demographics", "visits"]   # drafts go back to the physician, never into the chart

[grants.clinical-assistant]
read = ["clinical", "demographics", "intake", "visits"]
write = ["correspondence"]

[grants.billing]
write = ["billing"]
read = ["visits", "demographics"]

[grants.practice-manager]
read = ["demographics", "billing", "visits"]
policy_owner = true
member_admin = true

[grants.medical-director]
read = ["clinical", "visits", "demographics"]
policy_owner = true              # a second policy owner: approvals never wait on one person

[grants.patient-portal]
write = ["demographics", "intake", "correspondence"]

[grants.lab-interface]
write = ["clinical"]

# --------------------------------------------------------------------------------------------------------- calendar
# What the free-slots provider and the Schedule calendar read. The calendar is the practice's Booking types (a Visit
# extends Booking: its booked start and end, the patient, the physicians); here only the hours, the slot size, and
# whose time is booked (provider_role: one column each on the calendar).
[calendar]
provider_role = "physician"
slot_minutes = 15
slot_stride = 2
lookahead_days = 5
max_slots = 16
hours = { mon = ["09:00", "17:00"], tue = ["09:00", "17:00"], wed = ["09:00", "17:00"], thu = ["09:00", "19:00"], fri = ["09:00", "13:00"] }

# The same labels as the record types (types/*.toml), for anything that reads labels from here.
[record_labels]
Patient = "Patient"
RelatedPerson = "Related person"
Coverage = "Coverage"
QuestionnaireResponse = "Intake form"
Encounter = "Visit"
Composition = "Note"
Observation = "Result"
Condition = "Problem"
AllergyIntolerance = "Allergy"
MedicationRequest = "Prescription"
MedicationStatement = "Medication taken"
ServiceRequest = "Referral"
DiagnosticReport = "Report"
Immunization = "Immunization"
Communication = "Message"
ChargeItem = "Charge"
Claim = "Claim"

# ----------------------------------------------------------------------------------------------------------- events
# Every event the practice's workflows listen for, with the fields it carries (they become the run's input).

[[events]]
id = "patient.registered"
label = "A patient registered (desk or portal)"
fields = []

[[events]]
id = "appointment.requested"
label = "A patient asked for an appointment"
fields = ["reason", "urgency", "preferences", "kind", "slot"]

[[events]]
id = "lab.result"
label = "A lab result arrived"
fields = ["test", "value", "unit", "range", "flag", "observation"]

[[events]]
id = "renewal.requested"
label = "A patient or pharmacy asked for a prescription renewal"
fields = ["medication", "pharmacy"]

[[events]]
id = "patient.question"
label = "A patient sent a question through the portal"
fields = ["question"]

[[events]]
id = "visit.ended"
label = "A visit ended"
fields = ["appointment", "visit_type", "minutes", "start", "end", "transcript"]

