id = "portal-booking"
title = "Booked online"
record = "Patient"
summary = """
A patient books a visit on the portal for something that needs no screening (a form, paperwork): the time they chose
is booked straight away, if it is still free, and they are sent a confirmation. A reason that is not plainly
paperwork belongs in the appointment request, whose red-flag screen reads it first: the portal offers only the kinds
the practice set up for booking straight away here.
"""

[trigger]
starters = ["patient-portal", "front-desk"]

[[input]]
name = "slot"
type = "string"
required = true
hidden = true   # the time the patient chose on the portal: YYYY-MM-DDTHH:MM|member

[[input]]
name = "kind"
label = "Visit for"
type = "choice"
choices = ["forms", "check-up", "immunization"]
default = "forms"

[[input]]
name = "reason"
label = "Which form or paperwork"
type = "string"
help = "the form or paperwork, in the patient's words"

[[steps]]
id = "book"
title = "Book the time the patient chose"
kind = "automation"
action = "booking.book"
[steps.params]
slot = "{{input.slot}}"
subject = "{{run.record}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "routine"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }

[[steps]]
id = "confirm"
title = "Confirm with the patient"
kind = "automation"
after = ["book"]
action = "message.send"
[steps.params]
channel = "patient-portal"
to = "{{run.record}}"
subject = "Your appointment"
body = "You are booked on {{book.when}} with {{book.member_name}} at Harbourview Family Medicine. You can cancel on the portal up to a day before, or call us."
