id = "visit-documentation"
title = "Visit documentation"
record = "Patient"
summary = """
A visit nobody booked, filed after the fact (a call, a visit at home): the scribe agent drafts the note from the
transcript, and the visit is filed as completed once the note is signed. A booked visit, or a walk-in checked in at the
desk, is documented by its own workflow (the appointment workflow), on the visit itself, never by this one. The physician edits it and signs it, and only
then does it enter the chart. The visit is coded for billing from the physician's diagnosis codes, and routine claims
are submitted; anything else waits for billing staff.
"""

[trigger]
starters = ["physician", "nurse"]
event = "visit.ended"

[[input]]
name = "visit_type"
type = "choice"
choices = ["minor", "complete", "counselling"]
default = "minor"

[[input]]
name = "minutes"
type = "number"
default = 15

[[input]]
name = "start"
type = "datetime"
help = "when the visit started (default: its length before it was signed)"

[[input]]
name = "end"
type = "datetime"
help = "when the visit ended"

[[input]]
name = "transcript"
type = "text"
required = true

[[steps]]
id = "draft"
title = "Draft the note"
kind = "task"
role = "documentation-assistant"
due = "1d"
escalate_to = "practice-manager"
people_role = "physician"
skill = "visit-note-draft"
risk = "medium"
context = ["record:clinical", "record:intake", "input.transcript"]

[[steps]]
id = "edit"
title = "Edit the note"
kind = "task"
role = "physician"
due = "3d"
escalate_to = "medical-director"
after = ["draft"]
review_of = "draft"
persons_only = true
context = ["record:clinical", "input.transcript"]
instructions = "Correct the draft. You are its author once you sign."
[[steps.fields]]
name = "subjective"
type = "text"
required = true
[[steps.fields]]
name = "objective"
type = "text"
[[steps.fields]]
name = "assessment"
type = "text"
required = true
[[steps.fields]]
name = "plan"
type = "text"
required = true
[[steps.fields]]
name = "follow_up"
type = "string"
help = "when the patient should come back, as you told them"
[[steps.fields]]
name = "diagnosis_codes"
type = "list"
required = true
help = "ICD-9 codes for billing, e.g. 401"

[[steps]]
id = "sign"
title = "Sign the note"
kind = "gate"
role = "physician"
due = "3d"
escalate_to = "medical-director"
after = ["edit"]
signer = "person"
outcomes = ["sign", "discard"]
meaning = "I reviewed this note and it is accurate"
meanings_if_did = { edit = "I am the author of this note and it is accurate" }
meanings = { discard = "I discard this draft note" }
context = ["edit"]

[[steps]]
id = "timing"
title = "Note the time of the visit"
kind = "automation"
after = ["sign"]
when = "sign.outcome == 'sign'"
action = "clock.now"
[steps.params]
start = "{{input.start}}"
end = "{{input.end}}"
minutes = "{{input.minutes}}"

# The visit, filed as it took place (completed: it starts no workflow of its own).
[[steps]]
id = "file-visit"
title = "Record the visit"
kind = "automation"
after = ["timing"]
action = "record.create"
[steps.params]
type = "Encounter"
[steps.params.data]
status = "finished"
class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" }
subject = { reference = "{{run.record}}" }
participant = [{ individual = { reference = "Practitioner/{{sign.by}}" } }]
type = [{ text = "{{input.visit_type}}" }]
plannedStartDate = "{{timing.start}}"
plannedEndDate = "{{timing.end}}"
period = { start = "{{timing.start}}", end = "{{timing.end}}" }
length = { value = "{{input.minutes}}", unit = "min" }
diagnosis = [{ condition = [{ concept = { text = "ICD-9 {{edit.diagnosis_codes}}" } }] }]

[[steps]]
id = "file-note"
title = "File the note in the chart"
kind = "automation"
after = ["file-visit"]
action = "record.create"
[steps.params]
type = "Composition"
attest = "sign"   # the note filed is the one the physician signed: its signature shows on the note
[steps.params.data]
status = "final"
type = { text = "Visit note" }
title = "Visit note"
date = "{{timing.now}}"
subject = { reference = "{{run.record}}" }
encounter = { reference = "{{file-visit.reference}}" }
author = [{ reference = "Practitioner/{{sign.by}}" }]
attester = [{ mode = "legal", time = "{{timing.now}}", party = { reference = "Practitioner/{{sign.by}}" } }]
section = [
  { title = "Subjective", text = "{{edit.subjective}}" },
  { title = "Objective", text = "{{edit.objective}}" },
  { title = "Assessment", text = "{{edit.assessment}}" },
  { title = "Plan", text = "{{edit.plan}}" },
  { title = "Follow-up", text = "{{edit.follow_up}}" },
]

[[steps]]
id = "code"
title = "Code the visit"
kind = "task"
role = "billing"
due = "5d"
escalate_to = "practice-manager"
after = ["file-visit"]
skill = "visit-coding"
risk = "medium"
context = ["record:visits", "input.visit_type", "input.minutes", "edit.diagnosis_codes"]

[[steps]]
id = "submit"
title = "Submit the claim"
kind = "gate"
role = "billing"
due = "5d"
escalate_to = "practice-manager"
after = ["code"]
skill = "claim-submit"
signer = "any"
outcomes = ["submit", "hold"]
meaning = "This claim matches the service documented"
agent_criteria = "code.amount <= 80 and code.fee_code in ['minor-assessment', 'complete-assessment']"
not_by = ["code"]
context = ["record:visits", "code"]

[[steps]]
id = "charge"
title = "Record the charge"
kind = "automation"
after = ["submit"]
when = "submit.outcome == 'submit'"
action = "record.create"
[steps.params]
type = "ChargeItem"
[steps.params.data]
status = "billable"
subject = { reference = "{{run.record}}" }
code = { text = "{{code.fee_code}}" }
occurrenceDateTime = "{{timing.now}}"
context = { reference = "{{file-visit.reference}}" }
quantity = { value = "{{code.units}}" }
priceOverride = { value = "{{code.amount}}", currency = "CAD" }
