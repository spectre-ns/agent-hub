id = "appointment-request"
title = "Appointment request"
record = "Encounter"
summary = """
One visit, from open to closed: the visit record is this workflow's, and its status is where the work is. Asked for
(requested), it is read by a nurse or called back, booked (planned), checked in (arrived), seen (in progress), its
note drafted, edited and signed, and completed (finished); or it is cancelled, or the patient does not come (noshow).
A visit booked straight on the calendar starts here already booked; a walk-in starts checked in.

A patient asks for an appointment. A slot is proposed from the calendar and booked, and the patient is told.
Code screens the patient's reason for red flags first, as it does every patient message: a red flag, a warning sign
the patient mentions, or a request marked urgent goes to a nurse to call back within the hour, and a red flag also
tells the patient at once to call 911 in an emergency (every patient is told the inbox is not watched around the
clock). Only a request about paperwork or a check-up (screened as routine) goes straight to the scheduler; any other
reason is read by a nurse first, who sends it on for a slot or calls and books it. The nurse books the urgent ones. A patient the nurse could not reach goes to a physician. The scheduler sees the calendar and contact details,
never the chart.

The front desk books from the calendar through this workflow too: they pick the slot and what the visit is for, and
ask the patient why they are coming. The same screen runs first. A red flag, an unclear reason or a request marked
urgent is not booked: it goes to a nurse to call back, with the slot the desk had picked. Only a plainly routine
reason (paperwork, a check-up) is booked in the slot they picked at once; any other reason is read by a nurse first,
who books that slot, asks for a sooner one, or calls the patient. If the screen itself cannot run, a nurse calls the
patient back: no reason goes unread because the screen failed.

Once the patient is checked in and the visit started on the visit's own page, the physician ends it with the
transcript. The scribe agent drafts the note; the physician edits it and signs it, and only then is the visit completed
and the note filed in the chart. Signing also makes the visit's charge, a record of its own that billing codes from
the physician's diagnosis codes and submits (the visit-claim workflow): the visit does not wait for it. Routine
claims are submitted by the billing agent; anything else waits for billing staff. A patient marked as a no-show is told, under the
practice's missed-appointment policy, and so is a booking cancelled with less than a day's notice: a visit missed or
cancelled late is the visit's own work, not a workflow of its own.

A visit a clinician asked for (because of a result, a call that reached nobody, a renewal) that is not held goes back
to a clinician: missed, cancelled by the patient or by the practice, or its request cancelled before it was booked,
a follow-up of its own is started about the same result for the one who asked, who decides what happens now. The
visit still closes; what it was booked for is not lost with it.

A visit filed after the fact (a call, a visit at home) is a visit made under way (in progress): it is documented,
signed, completed and billed like any other.

Written as the visit's states (where it waits, and the work done there) and the edges between them (what the person
working it chose, with the automations that run on the way): see practicehub/states.py.
"""

[trigger]
starters = ["front-desk", "scheduler", "nurse", "physician", "patient-portal"]
event = "appointment.requested"
one_open_per = "subject"   # the same submission twice (a double press, two people taking one call) starts one:
one_open_same = ["input.reason"]   # ...the same reason...
one_open_within = "10m"   # ...a moment ago. Any other request is a new concern: its own visit, always screened
one_open_while = "record.status in ['requested', 'reading', 'callback', 'not-reached']"   # ...and not booked yet

# Started on the patient (the portal, the front desk taking a call), the run asks for the visit: it is made at once,
# requested, on the patient's chart, and this run works it from then on.
[new_record]
status = "requested"
class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" }
reason_text = "{{input.reason}}"
booking_reason = "{{input.kind}}"
urgency = "{{input.urgency}}"
requested_by = "{{run.started_by}}"
because_of = "{{input.because_of}}"

[[input]]
name = "reason"
label = "Why the patient is coming"
type = "string"
required = true
help = "in the patient's words, as much as they want to say; a nurse reads it first unless it is plainly paperwork or a check-up"

[[input]]
name = "kind"
label = "Visit for"
type = "choice"
choices = ["check-up", "follow-up", "new-concern", "prescription-renewal", "test-results", "forms", "immunization",
           "prenatal", "well-baby", "counselling", "procedure"]
help = "what the visit is for, as everyone who books may see it (the reason stays with the clinical team)"

[[input]]
name = "slot"
type = "string"
hidden = true   # filled by the calendar when the front desk picks a slot, never typed
help = "the slot the front desk picked on the calendar: booked at once only for a plainly routine reason"

[[input]]
name = "urgency"
label = "How soon"
type = "choice"
choices = ["routine", "soon", "urgent"]
default = "routine"
required = true

[[input]]
name = "because_of"
label = "Because of"
type = "reference"
target = ["Observation", "Condition", "MedicationRequest"]
hidden = true   # set by the workflow that asks for the visit (a reviewed result, a renewal), never typed
help = "the result, problem or prescription the visit was asked for"

[[input]]
name = "asked_by"
label = "Asked for by"
type = "member"
hidden = true   # set by the workflow that asks for the visit: who decided the patient should be seen, never typed
help = "the clinician who asked for the visit: if it is not held, what happens now is theirs to decide"

[[input]]
name = "preferences"
type = "string"
help = "days, times or physician the patient prefers"


# ---------------------------------------------------------------------------------------------------------------
# Asked for: screened by code for red flags, and the patient told at once what to do in an emergency. A request marked
# urgent, a red flag or a reason the screen is unsure of goes to a nurse to call back; one plainly about paperwork or a
# check-up goes to the scheduler (or, from a slot the front desk picked, is booked in it at once); anything else is
# read by a nurse first. If the screen cannot run, a nurse calls back: no reason goes unread because the screen failed.
# A visit that starts booked (the calendar), checked in (a walk-in) or under way (filed after the fact) is not screened.
[start]
to = "reading"
label = "Asked for"

[[start.do]]
id = "booked-already"
title = "Booked on the calendar: wait for the visit"
when = "run.start_state == 'planned'"
to = "planned"

[[start.do]]
id = "walked-in"
title = "A walk-in: wait for the visit to start"
when = "run.start_state == 'arrived'"
to = "arrived"

[[start.do]]
id = "under-way"
title = "Filed under way: end and document it"
when = "run.start_state == 'in-progress'"
to = "in-progress"

[[start.do]]
id = "screen"
title = "Screen the reason for red flags"
when = "run.start_state == 'requested'"
block = "patient-message-screen"
on_fail = "callback"   # fail closed: a nurse calls the patient back
[start.do.params]
question = "{{input.reason}}"

[[start.do]]
id = "safety-net"
title = "Tell the patient what to do in an emergency"
when = "run.start_state == 'requested' and (input.slot == null or screen.red_flag == true or screen.unsure == true)"
action = "message.send"
[start.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "We have your request"
body = "{{screen.advice}}"

# from a slot the front desk picked: booked at once only for a plainly routine reason
[[start.do]]
id = "book-chosen"
title = "Book the slot the front desk picked"
when = "run.start_state == 'requested' and input.slot != null and input.urgency != 'urgent' and screen.red_flag == false and screen.unsure == false and screen.routine == true"
action = "booking.book"          # the core's: written through the Booking fields a visit keeps
[start.do.params]
ref = "{{run.record}}"           # the visit asked for: it is booked, the same record
slot = "{{input.slot}}"
subject = "{{run.subject}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "{{input.urgency}}"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }   # a booked visit

[[start.do]]
id = "confirm-chosen"
title = "Confirm the booking with the patient"
when = "book-chosen != null"
action = "message.send"
[start.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment"
body = "You are booked on {{book-chosen.when}} with {{book-chosen.member_name}} at Harbourview Family Medicine. Reply to change or cancel."

[[start.do]]
id = "booked-at-once"
title = "Booked: wait for the visit"
when = "book-chosen.reference != null"
to = "planned"

[[start.do]]
id = "to-book"
title = "Have a slot proposed (paperwork or a check-up)"
when = "run.start_state == 'requested' and input.slot == null and input.urgency != 'urgent' and screen.red_flag == false and screen.unsure == false and screen.routine == true"
to = "requested"

# last, so an urgent request or a red flag wins over anything else the screen said
[[start.do]]
id = "call-back"
title = "Have a nurse call back (urgent, a red flag, or unsure)"
when = "run.start_state == 'requested' and (input.urgency == 'urgent' or screen.red_flag == true or screen.unsure == true)"
to = "callback"

# --- any other reason: a nurse reads it before a slot is booked -------------------------------------------------

[[state]]
id = "reading"
label = "Being read"
tone = "waiting"
help = "a nurse reads the reason before a slot is booked"

[[state.work]]
id = "triage"
title = "Read the reason before a slot is booked"
kind = "task"
role = "nurse"
due = "4h"
escalate_to = "physician"
persons_only = true
context = ["input.reason", "input.urgency", "input.slot", "screen", "record:demographics", "record:clinical"]
instructions = """The patient's reason is not plainly paperwork or a check-up, so no slot is booked until a nurse has
read it. Decide: an ordinary slot is fine (the slot the front desk picked, if it picked one, is booked; otherwise one
is proposed and booked), or they need to be seen sooner (the scheduler proposes a sooner slot), or spoken to first,
in which case call them and book them yourself."""
[[state.work.fields]]
name = "note_for_scheduler"
type = "string"
help = "what the scheduler needs to know (length of visit, which physician); no clinical details"

[[edge]]
id = "book-a-slot"
label = "An ordinary slot is fine"
from = "reading"
to = "requested"
help = "the slot the front desk picked is booked; otherwise the scheduler proposes one"

[[edge.do]]
id = "book-slot"
title = "Book the slot the front desk picked"
when = "input.slot != null"
action = "booking.book"
[edge.do.params]
ref = "{{run.record}}"
slot = "{{input.slot}}"
subject = "{{run.subject}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "{{input.urgency}}"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }

[[edge.do]]
id = "confirm-slot"
title = "Confirm the booking with the patient"
when = "book-slot != null"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment"
body = "You are booked on {{book-slot.when}} with {{book-slot.member_name}} at Harbourview Family Medicine. Reply to change or cancel."

[[edge.do]]
id = "slot-booked"
title = "Booked: wait for the visit"
when = "book-slot.reference != null"
to = "planned"

[[edge]]
id = "book-it-soon"
label = "Book it soon"
from = "reading"
to = "requested"
help = "the scheduler proposes a sooner slot"

[[edge]]
id = "i-will-call-and-book"
label = "I will call and book"
from = "reading"
to = "requested"
help = "you call the patient and pick the slot yourself next"

# --- urgent, a red flag, or the screen could not run: a nurse calls back within the hour --------------------------

[[state]]
id = "callback"
label = "To call back"
tone = "attention"
help = "a nurse calls the patient back within the hour"

[[state.work]]
id = "nurse-call"
title = "Call the patient back (urgent request)"
kind = "task"
role = "nurse"
priority = "urgent"
due = "1h"
escalate_to = "physician"
persons_only = true
context = ["input.reason", "input.kind", "input.slot", "screen", "record:demographics", "record:clinical"]
instructions = """The patient's request was marked urgent, or their words may describe an emergency (see the screen),
or the red-flag screen could not run (no screen is shown): read the reason yourself.
Call them now. Advise 911 or the emergency department if needed, or book them in yourself (you pick the slot next):
no slot is proposed automatically for a request that comes to you, and a slot the front desk picked (input.slot) was
not booked. Handled on the phone, the request is closed without a visit. If you cannot reach them, say so: a
physician decides what to do next."""
[[state.work.fields]]
name = "advice"
type = "text"
required = true

[[edge]]
id = "book-a-visit"
label = "Reached: book a visit"
from = "callback"
to = "requested"
help = "you pick the slot next"

# Handled on the phone: a contact that took place, so the request is completed, not cancelled.
[[edge]]
id = "patient-reached"
label = "Reached: handled on the phone"
from = "callback"
to = "finished"

[[edge]]
id = "could-not-reach"
label = "Could not reach"
from = "callback"
to = "not-reached"

# Nobody reached: a physician decides. Reaching the patient completes the request; otherwise it is closed (cancelled).
[[state]]
id = "not-reached"
label = "Not reached"
tone = "attention"
help = "the nurse could not reach the patient: a physician decides what happens now"

[[state.work]]
id = "not-reached"
title = "The nurse could not reach the patient"
kind = "task"
role = "physician"
persons_only = true
priority = "urgent"
due = "1h"
escalate_to = "medical-director"
context = ["input.reason", "screen", "nurse-call", "record:demographics", "record:clinical"]
instructions = """A nurse tried to call this patient about an urgent request and could not reach them. Decide what
happens now: try again, call their emergency contact, or ask for a welfare check. Write down what you did."""
[[state.work.fields]]
name = "notes"
type = "text"
required = true

[[edge]]
id = "reached-the-patient"
label = "I reached the patient"
from = "not-reached"
to = "finished"

[[edge]]
id = "called-emergency-contact"
label = "Called their emergency contact"
from = "not-reached"
to = "cancelled"

[[edge]]
id = "welfare-check"
label = "Asked for a welfare check"
from = "not-reached"
to = "cancelled"

[[edge]]
id = "no-further-action"
label = "No further action"
from = "not-reached"
to = "cancelled"

# --- to book: the scheduler proposes a slot, or the nurse who called (or said she would) picks one -----------------

[[state]]
id = "requested"
label = "Requested"
tone = "waiting"
help = "asked for, no time yet: a slot is picked and booked"

[[state.work]]
id = "propose"
title = "Propose a slot"
kind = "task"
role = "scheduler"
due = "1d"
escalate_to = "front-desk"
skill = "slot-proposal"
when = "nurse-call.outcome != 'book-a-visit' and triage.outcome != 'i-will-call-and-book'"
context = ["record:demographics", "provider:free-slots", "input.urgency", "input.preferences", "screen.admin_reason",
           "triage.outcome", "triage.note_for_scheduler"]

# A request a nurse called about, or said she would call and book: she picks the slot herself.
[[state.work]]
id = "nurse-book"
title = "Book the visit"
kind = "task"
role = "nurse"
due = "1d"
escalate_to = "physician"
skill = "slot-proposal"
when = "nurse-call.outcome == 'book-a-visit' or triage.outcome == 'i-will-call-and-book'"
persons_only = true
context = ["record:demographics", "provider:free-slots", "input.urgency", "input.preferences", "input.reason"]

[[edge]]
id = "booked"
label = "Booked"
from = "requested"
to = "planned"

[[edge.do]]
id = "book"
title = "Book the visit"
action = "booking.book"
[edge.do.params]
ref = "{{run.record}}"
slot = "{{propose.slot}}{{nurse-book.slot}}"
subject = "{{run.subject}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "{{input.urgency}}"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }   # a booked visit

[[edge.do]]
id = "confirm"
title = "Confirm with the patient"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment"
body = "You are booked on {{book.when}} with {{book.member_name}} at Harbourview Family Medicine. Reply to change or cancel."

# A slot proposed later (not the one picked on the calendar, which is said back at once): whoever took the request is
# told on the board, with the visit to open. No reason, nothing clinical: the time and the physician.
[[edge.do]]
id = "tell-booked"
title = "Tell whoever took the request that it is booked"
action = "notice.send"
[edge.do.params]
to = "{{run.started_by}}"
text = "Booked for {{book.when}} with {{book.member_name}}"
link = "{{book.reference}}"

# the record moves on once the slot is booked (the booking gives it its time); a slot taken in the meantime leaves it
# here, with the failure told to the practice
[[edge.do]]
id = "on-the-calendar"
title = "Booked: wait for the visit"
when = "book.reference != null"
to = "planned"

# --- booked: the visit's own page checks the patient in and starts the visit; the run waits on them -----------------

[[state]]
id = "planned"
label = "Booked"
tone = "waiting"
help = "waiting for the patient to be checked in and the visit started on this page"

[[state.work]]
id = "checked-in"
title = "Wait for the patient to be checked in"
kind = "wait"
until = "record.status in ['arrived', 'triaged', 'in-progress', 'onleave', 'finished', 'cancelled', 'noshow', 'entered-in-error']"

[[state.work]]
id = "seen"
title = "Wait for the visit to start"
kind = "wait"
until = "record.status in ['in-progress', 'onleave', 'finished', 'cancelled', 'noshow', 'entered-in-error']"
moves = ["triaged"]  # a nurse takes the vitals first: still waiting for the visit to start

[[edge]]
id = "booked-in-error"
label = "Entered in error"
from = "planned"
to = "entered-in-error"
when = "record.status == 'entered-in-error'"

# Missed (a no-show) or cancelled, before the visit started or after checking in: the policy counts the patient's
# earlier missed appointments in the year before this one (no-shows and late cancellations).
#
# Cancelled by the patient: late (less than the policy's notice before the time it was booked for), the patient is
# told under the missed-appointment policy; with notice, nothing is due and nothing is sent. The notice is worked out
# from when it was cancelled (the check-in wait's end) to the time it was booked for. One cancelled after checking in
# (the patient left before being seen) is late: the wait ended at the check-in, two hours before at most.
# Cancelled by the practice, no policy applies: the patient is told and asked to rebook.
[[edge]]
id = "not-held"
label = "Missed or cancelled"
from = "planned"
to = "cancelled"
when = "record.status in ['cancelled', 'noshow']"

[[edge.do]]
id = "missed-before"
title = "Count the patient's missed appointments this year"
when = "record.status == 'noshow' or (record.status == 'cancelled' and record.cancelled_by != 'practice')"
action = "visits.missed"
[edge.do.params]
visit = "{{run.record}}"

[[edge.do]]
id = "no-show"
title = "Apply the missed-appointment policy"
when = "record.status == 'noshow'"
block = "missed-appointment-fee"
[edge.do.params]
notice_hours = 0
missed_this_year = "{{missed-before.count}}"
fee = 50

[[edge.do]]
id = "tell-missed"
title = "Tell the patient"
when = "record.status == 'noshow'"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your missed appointment"
body = "We missed you at your appointment. {{no-show.reason}}. Amount due: ${{no-show.amount}}. Reply to rebook."

[[edge.do]]
id = "late-cancel"
title = "Apply the missed-appointment policy to a cancellation"
when = "record.status == 'cancelled' and record.cancelled_by != 'practice'"
block = "missed-appointment-fee"
[edge.do.params]
starts = "{{record.plannedStartDate}}"
cancelled_at = "{{checked-in.ended_at}}"
missed_this_year = "{{missed-before.count}}"
fee = 50

[[edge.do]]
id = "mark-late-cancel"
title = "Mark the visit cancelled late"
when = "late-cancel.late == true"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
cancelled_late = true

[[edge.do]]
id = "tell-late-cancel"
title = "Tell the patient about the late cancellation"
when = "late-cancel.late == true"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your cancelled appointment"
body = "Your appointment was cancelled with less than 24 hours' notice. {{late-cancel.reason}}. Amount due: ${{late-cancel.amount}}. Reply to rebook."

[[edge.do]]
id = "tell-practice-cancelled"
title = "Tell the patient the practice cancelled"
when = "record.status == 'cancelled' and record.cancelled_by == 'practice'"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment is cancelled"
body = "We are sorry: we had to cancel your appointment on {{record.plannedStartDate}}. There is no charge. Reply to rebook."

# A visit a clinician asked for (to follow up a result, a call that reached nobody, a renewal) goes back to a clinician
# when it is not held, whoever cancelled it and whether or not the policy applies: a follow-up of its own, about the
# same result, for the one who asked (any physician, if the request does not say who or they are no longer here).
[[edge.do]]
id = "not-held-how"
title = "Note how the visit ended"
when = "(input.because_of != null and input.because_of != '') or (input.asked_by != null and input.asked_by != '')"
action = "visit.not_held"
[edge.do.params]
visit = "{{run.record}}"
urgency = "{{input.urgency}}"

[[edge.do]]
id = "not-held-follow-up"
title = "Ask the clinician who asked for the visit what happens now"
when = "(input.because_of != null and input.because_of != '') or (input.asked_by != null and input.asked_by != '')"
action = "workflow.start"
[edge.do.params]
workflow = "patient-follow-up"
record = "{{run.subject}}"
[edge.do.params.input]
what = "Visit not held ({{not-held-how.how}}): {{input.reason}}"
urgency = "{{not-held-how.urgency}}"
because_of = "{{input.because_of}}"
visit = "{{run.record}}"
visit_reason = "{{input.reason}}"
asked_by = "{{input.asked_by}}"
note = "{{not-held-how.words}}"

# a no-show stays a no-show
[[edge.do]]
id = "missed"
title = "Keep it a no-show"
when = "record.status == 'noshow'"
to = "noshow"

[[edge]]
id = "started"
label = "Visit started"
from = "planned"
to = "in-progress"

# A walk-in: checked in already, with no booking to miss; the run waits for the visit to start.
[[state]]
id = "arrived"
label = "Checked in"
tone = "active"
help = "a walk-in: waiting for the visit to start on this page"

[[state.work]]
id = "walk-in-seen"
title = "Wait for the visit to start"
kind = "wait"
until = "record.status in ['in-progress', 'onleave', 'finished', 'cancelled', 'entered-in-error']"
moves = ["triaged"]

[[edge]]
id = "walk-in-in-error"
label = "Entered in error"
from = "arrived"
to = "entered-in-error"
when = "record.status == 'entered-in-error'"

[[edge]]
id = "walk-in-left"
label = "Left before being seen"
from = "arrived"
to = "cancelled"
when = "record.status == 'cancelled'"

[[edge]]
id = "walk-in-started"
label = "Visit started"
from = "arrived"
to = "in-progress"

# --- seen: the physician ends the visit with the transcript ------------------------------------------------------

[[state]]
id = "in-progress"
label = "In progress"
tone = "active"
help = "the visit is under way: the physician ends it with the transcript"

[[state.work]]
id = "end"
title = "End the visit"
kind = "task"
role = "physician"
due = "1d"
escalate_to = "medical-director"
persons_only = true
moves = ["onleave", "in-progress"]  # the physician steps out and back while the visit is open
context = ["record:clinical", "input.reason"]
instructions = """The visit is under way. When it ends, give the transcript (or your notes of it), what kind of visit it
was and how long it took: the scribe agent drafts the note from it, for you to edit and sign."""
[[state.work.fields]]
name = "transcript"
type = "text"
required = true
[[state.work.fields]]
name = "visit_type"
type = "choice"
choices = ["minor", "complete", "counselling"]
default = "minor"
[[state.work.fields]]
name = "minutes"
type = "number"
default = 15
[[state.work.fields]]
name = "start"
type = "datetime"
help = "when the visit started (default: its length before it was signed)"
[[state.work.fields]]
name = "end"
type = "datetime"
help = "when the visit ended"

[[edge]]
id = "ended"
label = "Visit ended"
from = "in-progress"
to = "drafting"

[[state]]
id = "drafting"
label = "Note being drafted"
tone = "active"

[[state.work]]
id = "draft"
title = "Draft the note"
kind = "task"
role = "documentation-assistant"
due = "1d"
escalate_to = "practice-manager"
people_role = "physician"
skill = "visit-note-draft"
risk = "medium"
context = ["record:clinical", "record:intake", "end.transcript"]

[[edge]]
id = "drafted"
label = "Drafted"
from = "drafting"
to = "editing"

[[state]]
id = "editing"
label = "Note being edited"
tone = "active"

[[state.work]]
id = "edit"
title = "Edit the note"
kind = "task"
role = "physician"
due = "3d"
escalate_to = "medical-director"
review_of = "draft"
persons_only = true
context = ["record:clinical", "end.transcript"]
instructions = "Correct the draft. You are its author once you sign."
[[state.work.fields]]
name = "subjective"
type = "text"
required = true
[[state.work.fields]]
name = "objective"
type = "text"
[[state.work.fields]]
name = "assessment"
type = "text"
required = true
[[state.work.fields]]
name = "plan"
type = "text"
required = true
[[state.work.fields]]
name = "follow_up"
type = "string"
help = "when the patient should come back, as you told them"
[[state.work.fields]]
name = "diagnosis_codes"
type = "list"
required = true
help = "ICD-9 codes for billing, e.g. 401"
[[state.work.fields]]
name = "referrals"
label = "Refer to"
type = "list"
help = "specialties to refer the patient to, one per line: once you sign, each is a referral of its own"
[[state.work.fields]]
name = "prescriptions"
label = "Prescribe"
type = "list"
help = "one medication per line, with its dose and directions: once you sign, each is a prescription of its own, written for you to check and issue"
[[state.work.fields]]
name = "lab_orders"
label = "Order lab tests"
type = "list"
help = "one test per line (e.g. CBC, HbA1c): once you sign, each is a lab order of its own, sent with the signed note"

[[edge]]
id = "edited"
label = "Edited"
from = "editing"
to = "signing"

[[state]]
id = "signing"
label = "Note to sign"
tone = "active"

[[state.work]]
id = "sign"
title = "Sign the note"
kind = "gate"
role = "physician"
due = "3d"
escalate_to = "medical-director"
signer = "person"
meaning = "I reviewed this note and it is accurate"
meanings_if_did = { edit = "I am the author of this note and it is accurate" }
meanings = { discard = "I discard this draft note" }
context = ["edit"]

# Signed: the visit is completed, with when it took place; the note is filed, what it orders is made, and its charge is
# made for billing to code and submit (a record of its own: the visit does not wait for it).
[[edge]]
id = "sign"
label = "Sign"
from = "signing"
to = "finished"

[[edge.do]]
id = "timing"
title = "Note the time of the visit"
action = "clock.now"
[edge.do.params]
start = "{{end.start}}"
end = "{{end.end}}"
minutes = "{{end.minutes}}"

[[edge.do]]
id = "finish"
title = "Complete the visit"
action = "record.update"
[edge.do.params]
ref = "{{run.record}}"
[edge.do.params.set]
participant = [{ individual = { reference = "Practitioner/{{end.by}}" } }]   # who ran the visit, not the reviewer
type = [{ text = "{{end.visit_type}}" }]
period = { start = "{{timing.start}}", end = "{{timing.end}}" }
length = { value = "{{end.minutes}}", unit = "min" }
diagnosis = [{ condition = [{ concept = { text = "ICD-9 {{edit.diagnosis_codes}}" } }] }]

[[edge.do]]
id = "file-note"
title = "File the note in the chart"
action = "record.create"
[edge.do.params]
type = "Composition"
attest = "sign"   # the note filed is the one the physician signed: its signature shows on the note
[edge.do.params.data]
status = "final"
type = { text = "Visit note" }
title = "Visit note"
date = "{{timing.now}}"
subject = { reference = "{{run.subject}}" }
encounter = { reference = "{{run.record}}" }
author = [{ reference = "Practitioner/{{edit.by}}" }]   # who wrote the note (edited the draft)
# who signed it, with what their signature means (the reviewer: "I reviewed this note"; the author: "I am the author")
attester = [{ mode = { coding = [{ system = "http://hl7.org/fhir/composition-attestation-mode", code = "legal" }], text = "{{sign.meaning}}" }, time = "{{timing.now}}", party = { reference = "Practitioner/{{sign.by}}" } }]
section = [
  { title = "Subjective", text = "{{edit.subjective}}" },
  { title = "Objective", text = "{{edit.objective}}" },
  { title = "Assessment", text = "{{edit.assessment}}" },
  { title = "Plan", text = "{{edit.plan}}" },
  { title = "Follow-up", text = "{{edit.follow_up}}" },
]

# Each referral written in the note is a record of its own (a sub-record of the visit, about the same patient), walked
# by the referral workflow from draft to the specialist's report. The visit does not wait for them.
[[edge.do]]
id = "refer"
title = "Make the referrals in the note"
for_each = "{{edit.referrals}}"
action = "record.child"
[edge.do.params]
type = "ServiceRequest"
[edge.do.params.data]
status = "draft"
intent = "order"
priority = "routine"
kind = "referral"
referral_to = "{{each}}"
reason_text = "{{edit.assessment}}"
[edge.do.params.input]
specialty = "{{each}}"
reason = "{{edit.assessment}}"
urgency = "routine"

# Each prescription written in the note is a prescription of its own (a sub-record of the visit), written (draft) for
# the physician to check and issue on its page: the note's signature does not issue a prescription.
[[edge.do]]
id = "prescribe"
title = "Write the prescriptions in the note"
for_each = "{{edit.prescriptions}}"
action = "record.child"
[edge.do.params]
type = "MedicationRequest"
[edge.do.params.data]
status = "draft"
intent = "order"
medication = "{{each}}"
requester = "Practitioner/{{edit.by}}"
reason_text = "{{edit.assessment}}"

# Each lab test ordered in the signed note is a lab order of its own (a sub-record of the visit), sent: the note it is
# ordered in is signed.
[[edge.do]]
id = "order-labs"
title = "Order the lab tests in the note"
for_each = "{{edit.lab_orders}}"
action = "record.child"
[edge.do.params]
type = "ServiceRequest"
[edge.do.params.data]
status = "active"
intent = "order"
priority = "routine"
kind = "lab-test"
referral_to = "{{each}}"
requester = "Practitioner/{{edit.by}}"
reason_text = "{{edit.assessment}}"

# The visit's charge: a sub-record of the visit, planned until billing codes it and submits the claim (the
# visit-claim workflow walks it). Billing is given what the visit summary says, never the note.
[[edge.do]]
id = "bill"
title = "Make the visit's charge for billing"
action = "record.child"
[edge.do.params]
type = "ChargeItem"
[edge.do.params.data]
status = "planned"
code = { text = "{{end.visit_type}} visit" }
occurrenceDateTime = "{{timing.now}}"
[edge.do.params.input]
visit_type = "{{end.visit_type}}"
minutes = "{{end.minutes}}"
diagnosis_codes = "{{edit.diagnosis_codes}}"

# Discarded: the visit still took place, so it is never left in progress, but it is not plain Completed either: it is
# Completed: no note, flagged for the physician, who is asked to write the note on the visit (a task on their work, due
# like the edit). No note is filed and the visit is not billed from the discarded draft.
[[edge]]
id = "discard"
label = "Discard"
from = "signing"
to = "undocumented"

[[edge.do]]
id = "tell-discarded"
title = "Tell the physician the visit has no note"
action = "notice.send"
[edge.do.params]
to = "{{sign.by}}"
text = "You discarded the draft note: this visit has no note (Completed: no note). Write one on the visit."
link = "{{run.record}}"

# Once the physician has written it, the visit is completed; a visit that needs none (the wrong patient's transcript)
# stays Completed: no note, with their reason on the track.
[[state]]
id = "undocumented"
label = "Completed: no note"
tone = "attention"

[[state.work]]
id = "write-note"
title = "Write the note for this visit"
kind = "task"
role = "physician"
assign_to = "{{sign.by}}"
due = "3d"
escalate_to = "medical-director"
persons_only = true
context = ["record:clinical", "end.transcript", "sign"]
instructions = """You discarded the draft note, so this visit has no note. Write the visit note on the patient's chart
(a new visit note, linked to this visit), then say so here. If the visit needs no note (the transcript was another
patient's, the visit did not take place as booked), say why: the visit stays Completed: no note."""
[[state.work.fields]]
name = "why"
type = "string"
help = "why the visit needs no note (only then)"

[[edge]]
id = "i-wrote-it-on-the-visit"
label = "I wrote it on the visit"
from = "undocumented"
to = "finished"

[[edge]]
id = "no-note-needed"
label = "No note needed"
from = "undocumented"
to = "undocumented"

[[state]]
id = "finished"
label = "Completed"
tone = "done"

[[state]]
id = "cancelled"
label = "Cancelled"
tone = "ended"

[[state]]
id = "noshow"
label = "No-show"
tone = "ended"

[[state]]
id = "entered-in-error"
label = "Entered in error"
tone = "ended"

# Its work cancelled before the visit was held (the request never booked, or the booking dropped with its run): a visit
# a clinician asked for goes back to them all the same, as when it is missed. A visit that took place is not chased.
[[on_cancel]]
id = "cancelled-follow-up"
title = "Ask the clinician who asked for the visit what happens now"
when = "((input.because_of != null and input.because_of != '') or (input.asked_by != null and input.asked_by != '')) and record.status in ['requested', 'reading', 'callback', 'not-reached', 'planned'] and input.urgency != 'urgent'"
action = "workflow.start"
[on_cancel.params]
workflow = "patient-follow-up"
record = "{{run.subject}}"
[on_cancel.params.input]
what = "Visit not held (its request was cancelled): {{input.reason}}"
urgency = "routine"
because_of = "{{input.because_of}}"
visit = "{{run.record}}"
visit_reason = "{{input.reason}}"
asked_by = "{{input.asked_by}}"
note = "The visit was not held: its request was cancelled by {{cancel.by}} ({{cancel.reason}})."

[[on_cancel]]
id = "cancelled-follow-up-now"
title = "Ask the clinician who asked for the visit what happens now (urgent)"
when = "((input.because_of != null and input.because_of != '') or (input.asked_by != null and input.asked_by != '')) and record.status in ['requested', 'reading', 'callback', 'not-reached', 'planned'] and input.urgency == 'urgent'"
action = "workflow.start"
[on_cancel.params]
workflow = "patient-follow-up"
record = "{{run.subject}}"
[on_cancel.params.input]
what = "Visit not held (its request was cancelled): {{input.reason}}"
urgency = "urgent"
because_of = "{{input.because_of}}"
visit = "{{run.record}}"
visit_reason = "{{input.reason}}"
asked_by = "{{input.asked_by}}"
note = "The visit was not held: its request was cancelled by {{cancel.by}} ({{cancel.reason}})."
