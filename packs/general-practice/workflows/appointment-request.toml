id = "appointment-request"
title = "Appointment request"
record = "Encounter"
summary = """
One visit, from open to closed: the visit record is this workflow's, and its status is where the work is. Asked for
(requested), it is booked (planned), checked in (arrived), seen (in progress), documented and signed, and completed
(finished); or it is cancelled, or the patient does not come (noshow). A visit booked straight on the calendar starts
here already booked; a walk-in starts checked in.

A patient asks for an appointment. A slot is proposed from the calendar and booked, and the patient is told.
Code screens the patient's reason for red flags first, as it does every patient message: a red flag, a warning sign
the patient mentions, or a request marked urgent goes to a nurse to call back within the hour, and a red flag also
tells the patient at once to call 911 in an emergency (every patient is told the inbox is not watched around the
clock). Only a request about paperwork or a check-up (screened as routine) goes straight to the scheduler; any other
reason is read by a nurse first, who sends it on for a slot or calls and books it. The nurse books the urgent ones. A patient the nurse could not reach goes to a physician. The scheduler sees the calendar and contact details,
never the chart.

The front desk books from the calendar through this workflow too: they pick the slot and what the visit is for, and
ask the patient why they are coming. The same screen runs first. A red flag, an unclear reason or a request marked
urgent is not booked: it goes to a nurse to call back, with the slot the desk had picked. Only a plainly routine
reason (paperwork, a check-up) is booked in the slot they picked at once; any other reason is read by a nurse first,
who books that slot, asks for a sooner one, or calls the patient. If the screen itself cannot run, a nurse calls the
patient back: no reason goes unread because the screen failed.

Once the patient is checked in and the visit started on the visit's own page, the physician ends it with the
transcript. The scribe agent drafts the note; the physician edits it and signs it, and only then is the visit completed
and the note filed in the chart. The visit is coded for billing from the physician's diagnosis codes, and routine
claims are submitted; anything else waits for billing staff. A patient marked as a no-show is told, under the
practice's missed-appointment policy.
"""

[trigger]
starters = ["front-desk", "scheduler", "nurse", "physician", "patient-portal"]
event = "appointment.requested"
one_open_per = "subject"   # one open request per patient: pressing twice, or two people taking one call, starts one
one_open_while = "record.status == 'requested'"   # ...while it is not booked yet; a booked visit does not count

# Started on the patient (the portal, the front desk taking a call), the run asks for the visit: it is made at once,
# requested, on the patient's chart, and this run works it from then on.
[new_record]
status = "requested"
class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" }
reason_text = "{{input.reason}}"
booking_reason = "{{input.kind}}"
urgency = "{{input.urgency}}"
requested_by = "{{run.started_by}}"

[[input]]
name = "reason"
label = "Why the patient is coming"
type = "string"
required = true
help = "in the patient's words, as much as they want to say; a nurse reads it first unless it is plainly paperwork or a check-up"

[[input]]
name = "kind"
label = "Visit for"
type = "choice"
choices = ["check-up", "follow-up", "new-concern", "prescription-renewal", "test-results", "forms", "immunization",
           "prenatal", "well-baby", "counselling", "procedure"]
help = "what the visit is for, as everyone who books may see it (the reason stays with the clinical team)"

[[input]]
name = "slot"
type = "string"
hidden = true   # filled by the calendar when the front desk picks a slot, never typed
help = "the slot the front desk picked on the calendar: booked at once only for a plainly routine reason"

[[input]]
name = "urgency"
label = "How soon"
type = "choice"
choices = ["routine", "soon", "urgent"]
default = "routine"
required = true

[[input]]
name = "preferences"
type = "string"
help = "days, times or physician the patient prefers"

# Asked for: screened, read and booked. A visit that starts booked (the calendar) or checked in (a walk-in) skips these.
[[steps]]
id = "screen"
title = "Screen the reason for red flags"
kind = "automation"
when = "run.start_state == 'requested'"
block = "patient-message-screen"
[steps.params]
question = "{{input.reason}}"

[[steps]]
id = "safety-net"
title = "Tell the patient what to do in an emergency"
kind = "automation"
after = ["screen"]
when = "input.slot == null or screen.red_flag == true or screen.unsure == true"
action = "message.send"
[steps.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "We have your request"
body = "{{screen.advice}}"

[[steps]]
id = "nurse-call"
title = "Call the patient back (urgent request)"
kind = "task"
role = "nurse"
priority = "urgent"
due = "1h"
escalate_to = "physician"
# not after the screen, so that a screen that fails (screen is empty) still reaches a nurse; the screen, the first
# step, has always run or failed by the time this is reached
when = "run.start_state == 'requested' and (screen == null or input.urgency == 'urgent' or screen.red_flag == true or screen.unsure == true)"
persons_only = true
context = ["input.reason", "input.kind", "input.slot", "screen", "record:demographics", "record:clinical"]
instructions = """The patient's request was marked urgent, or their words may describe an emergency (see the screen),
or the red-flag screen could not run (no screen is shown): read the reason yourself.
Call them now. Advise 911 or the emergency department if needed, or tick book to book them in yourself (you pick the
slot next): no slot is proposed automatically for a request that comes to you, and a slot the front desk picked
(input.slot) was not booked. Left unbooked, the request is closed. If you cannot reach them,
leave reached unticked: a physician decides what to do next."""
[[steps.fields]]
name = "reached"
type = "boolean"
[[steps.fields]]
name = "book"
label = "Book a visit"
type = "boolean"
help = "you pick the slot next; unticked, the request is closed without a visit"
[[steps.fields]]
name = "advice"
type = "text"
required = true

[[steps]]
id = "not-reached"
title = "The nurse could not reach the patient"
kind = "task"
role = "physician"
after = ["nurse-call"]
when = "nurse-call.advice != null and nurse-call.reached != true"
persons_only = true
priority = "urgent"
due = "1h"
escalate_to = "medical-director"
context = ["input.reason", "screen", "nurse-call", "record:demographics", "record:clinical"]
instructions = """A nurse tried to call this patient about an urgent request and could not reach them. Decide what
happens now: try again, call their emergency contact, or ask for a welfare check. Write down what you did."""
[[steps.fields]]
name = "action"
type = "choice"
choices = ["reached-the-patient", "called-emergency-contact", "welfare-check", "no-further-action"]
required = true
[[steps.fields]]
name = "notes"
type = "text"
required = true

[[steps]]
id = "triage"
title = "Read the reason before a slot is booked"
kind = "task"
role = "nurse"
due = "4h"
escalate_to = "physician"
after = ["screen"]
when = "input.urgency != 'urgent' and screen.red_flag == false and screen.unsure == false and screen.routine != true"
persons_only = true
context = ["input.reason", "input.urgency", "input.slot", "screen", "record:demographics", "record:clinical"]
instructions = """The patient's reason is not plainly paperwork or a check-up, so no slot is booked until a nurse has
read it. Decide: an ordinary slot is fine (the slot the front desk picked, if it picked one, is booked; otherwise one
is proposed and booked), or they need to be seen sooner (the scheduler proposes a sooner slot), or spoken to first,
in which case call them and book them yourself."""
[[steps.fields]]
name = "decision"
type = "choice"
choices = ["book-a-slot", "book-it-soon", "i-will-call-and-book"]
required = true
[[steps.fields]]
name = "note_for_scheduler"
type = "string"
help = "what the scheduler needs to know (length of visit, which physician); no clinical details"

[[steps]]
id = "propose"
title = "Propose a slot"
kind = "task"
role = "scheduler"
due = "1d"
escalate_to = "front-desk"
skill = "slot-proposal"
after = ["screen", "triage"]
when = "input.urgency != 'urgent' and screen.red_flag == false and screen.unsure == false and ((input.slot == null and (screen.routine == true or triage.decision == 'book-a-slot')) or triage.decision == 'book-it-soon')"
context = ["record:demographics", "provider:free-slots", "input.urgency", "input.preferences", "screen.admin_reason",
           "triage.decision", "triage.note_for_scheduler"]

# A request a nurse called about, or said she would call and book: she picks the slot herself.
[[steps]]
id = "nurse-book"
title = "Book the visit"
kind = "task"
role = "nurse"
due = "1d"
escalate_to = "physician"
skill = "slot-proposal"
after = ["nurse-call", "triage"]
when = "nurse-call.book == true or triage.decision == 'i-will-call-and-book'"
persons_only = true
context = ["record:demographics", "provider:free-slots", "input.urgency", "input.preferences", "input.reason"]

# A request the nurse dealt with by phone and did not book (or the physician, for a patient nobody reached) is closed.
[[steps]]
id = "not-booked"
title = "Close the request without a visit"
kind = "automation"
after = ["nurse-call", "not-reached"]
when = "nurse-call.book != true"
state = "cancelled"

[[steps]]
id = "book"
title = "Book the visit"
kind = "automation"
after = ["propose", "nurse-book"]
action = "booking.book"          # the core's: written through the Booking fields a visit keeps
[steps.params]
ref = "{{run.record}}"           # the visit asked for: it is booked, the same record
slot = "{{propose.slot}}{{nurse-book.slot}}"
subject = "{{run.subject}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "{{input.urgency}}"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }   # a booked visit

[[steps]]
id = "book-chosen"
title = "Book the slot the front desk picked"
kind = "automation"
after = ["screen", "triage"]
# at once only for a plainly routine reason; any other reason once a nurse has read it and said an ordinary slot is fine
when = "input.slot != null and input.urgency != 'urgent' and screen.red_flag == false and screen.unsure == false and (screen.routine == true or triage.decision == 'book-a-slot')"
action = "booking.book"
[steps.params]
ref = "{{run.record}}"
slot = "{{input.slot}}"
subject = "{{run.subject}}"
reason = "{{input.reason}}"
kind = "{{input.kind}}"
priority = "{{input.urgency}}"
defaults = { status = "planned", class = { system = "http://terminology.hl7.org/CodeSystem/v3-ActCode", code = "AMB", display = "ambulatory" } }

[[steps]]
id = "confirm"
title = "Confirm with the patient"
kind = "automation"
after = ["book"]
action = "message.send"
[steps.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment"
body = "You are booked on {{book.when}} with {{book.member_name}} at Harbourview Family Medicine. Reply to change or cancel."

# A slot proposed later (not the one picked on the calendar, which is said back at once): whoever took the request is
# told on the board, with the visit to open. No reason, nothing clinical: the time and the physician.
[[steps]]
id = "tell-booked"
title = "Tell whoever took the request that it is booked"
kind = "automation"
after = ["book"]
action = "notice.send"
[steps.params]
to = "{{run.started_by}}"
text = "Booked for {{book.when}} with {{book.member_name}}"
link = "{{book.reference}}"

[[steps]]
id = "confirm-chosen"
title = "Confirm the booking with the patient"
kind = "automation"
after = ["book-chosen"]
action = "message.send"
[steps.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your appointment"
body = "You are booked on {{book-chosen.when}} with {{book-chosen.member_name}} at Harbourview Family Medicine. Reply to change or cancel."

# Booked: the visit's own page checks the patient in and starts the visit (its transitions); the run waits on them.
[[steps]]
id = "checked-in"
title = "Wait for the patient to be checked in"
kind = "wait"
until = "record.status in ['arrived', 'triaged', 'in-progress', 'onleave', 'finished', 'cancelled', 'noshow', 'entered-in-error']"

[[steps]]
id = "no-show"
title = "Apply the missed-appointment policy"
kind = "automation"
after = ["checked-in"]
when = "record.status == 'noshow'"
block = "missed-appointment-fee"
[steps.params]
notice_hours = 0
missed_this_year = 0
fee = 50

[[steps]]
id = "tell-missed"
title = "Tell the patient"
kind = "automation"
after = ["no-show"]
action = "message.send"
[steps.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your missed appointment"
body = "We missed you at your appointment. {{no-show.reason}}. Amount due: ${{no-show.amount}}. Reply to rebook."

[[steps]]
id = "seen"
title = "Wait for the visit to start"
kind = "wait"
after = ["checked-in"]
when = "record.status in ['arrived', 'triaged', 'in-progress', 'onleave']"
until = "record.status in ['in-progress', 'onleave', 'finished', 'cancelled', 'noshow', 'entered-in-error']"

[[steps]]
id = "end"
title = "End the visit"
kind = "task"
role = "physician"
due = "1d"
escalate_to = "medical-director"
after = ["seen"]
when = "record.status in ['in-progress', 'onleave']"
persons_only = true
context = ["record:clinical", "input.reason"]
instructions = """The visit is under way. When it ends, give the transcript (or your notes of it), what kind of visit it
was and how long it took: the scribe agent drafts the note from it, for you to edit and sign."""
[[steps.fields]]
name = "transcript"
type = "text"
required = true
[[steps.fields]]
name = "visit_type"
type = "choice"
choices = ["minor", "complete", "counselling"]
default = "minor"
[[steps.fields]]
name = "minutes"
type = "number"
default = 15
[[steps.fields]]
name = "start"
type = "datetime"
help = "when the visit started (default: its length before it was signed)"
[[steps.fields]]
name = "end"
type = "datetime"
help = "when the visit ended"

[[steps]]
id = "draft"
title = "Draft the note"
kind = "task"
role = "documentation-assistant"
due = "1d"
escalate_to = "practice-manager"
people_role = "physician"
skill = "visit-note-draft"
risk = "medium"
after = ["end"]
context = ["record:clinical", "record:intake", "end.transcript"]

[[steps]]
id = "edit"
title = "Edit the note"
kind = "task"
role = "physician"
due = "3d"
escalate_to = "medical-director"
after = ["draft"]
review_of = "draft"
persons_only = true
context = ["record:clinical", "end.transcript"]
instructions = "Correct the draft. You are its author once you sign."
[[steps.fields]]
name = "subjective"
type = "text"
required = true
[[steps.fields]]
name = "objective"
type = "text"
[[steps.fields]]
name = "assessment"
type = "text"
required = true
[[steps.fields]]
name = "plan"
type = "text"
required = true
[[steps.fields]]
name = "follow_up"
type = "string"
help = "when the patient should come back, as you told them"
[[steps.fields]]
name = "diagnosis_codes"
type = "list"
required = true
help = "ICD-9 codes for billing, e.g. 401"

[[steps]]
id = "sign"
title = "Sign the note"
kind = "gate"
role = "physician"
due = "3d"
escalate_to = "medical-director"
after = ["edit"]
signer = "person"
outcomes = ["sign", "discard"]
meaning = "I reviewed this note and it is accurate"
meanings_if_did = { edit = "I am the author of this note and it is accurate" }
meanings = { discard = "I discard this draft note" }
context = ["edit"]

[[steps]]
id = "timing"
title = "Note the time of the visit"
kind = "automation"
after = ["sign"]
when = "sign.outcome == 'sign'"
action = "clock.now"
[steps.params]
start = "{{end.start}}"
end = "{{end.end}}"
minutes = "{{end.minutes}}"

# Signed: the visit is completed, with when it took place.
[[steps]]
id = "finish"
title = "Complete the visit"
kind = "automation"
after = ["timing"]
action = "record.update"
state = "finished"
[steps.params]
ref = "{{run.record}}"
[steps.params.set]
participant = [{ individual = { reference = "Practitioner/{{sign.by}}" } }]
type = [{ text = "{{end.visit_type}}" }]
period = { start = "{{timing.start}}", end = "{{timing.end}}" }
length = { value = "{{end.minutes}}", unit = "min" }
diagnosis = [{ condition = [{ concept = { text = "ICD-9 {{edit.diagnosis_codes}}" } }] }]

[[steps]]
id = "file-note"
title = "File the note in the chart"
kind = "automation"
after = ["finish"]
action = "record.create"
[steps.params]
type = "Composition"
attest = "sign"   # the note filed is the one the physician signed: its signature shows on the note
[steps.params.data]
status = "final"
type = { text = "Visit note" }
title = "Visit note"
date = "{{timing.now}}"
subject = { reference = "{{run.subject}}" }
encounter = { reference = "{{run.record}}" }
author = [{ reference = "Practitioner/{{sign.by}}" }]
attester = [{ mode = "legal", time = "{{timing.now}}", party = { reference = "Practitioner/{{sign.by}}" } }]
section = [
  { title = "Subjective", text = "{{edit.subjective}}" },
  { title = "Objective", text = "{{edit.objective}}" },
  { title = "Assessment", text = "{{edit.assessment}}" },
  { title = "Plan", text = "{{edit.plan}}" },
  { title = "Follow-up", text = "{{edit.follow_up}}" },
]

[[steps]]
id = "code"
title = "Code the visit"
kind = "task"
role = "billing"
due = "5d"
escalate_to = "practice-manager"
after = ["finish"]
skill = "visit-coding"
risk = "medium"
context = ["record:visits", "end.visit_type", "end.minutes", "edit.diagnosis_codes"]

[[steps]]
id = "submit"
title = "Submit the claim"
kind = "gate"
role = "billing"
due = "5d"
escalate_to = "practice-manager"
after = ["code"]
skill = "claim-submit"
signer = "any"
outcomes = ["submit", "hold"]
meaning = "This claim matches the service documented"
agent_criteria = "code.amount <= 80 and code.fee_code in ['minor-assessment', 'complete-assessment']"
not_by = ["code"]
context = ["record:visits", "code"]

[[steps]]
id = "charge"
title = "Record the charge"
kind = "automation"
after = ["submit"]
when = "submit.outcome == 'submit'"
action = "record.create"
[steps.params]
type = "ChargeItem"
[steps.params.data]
status = "billable"
subject = { reference = "{{run.subject}}" }
code = { text = "{{code.fee_code}}" }
occurrenceDateTime = "{{timing.now}}"
context = { reference = "{{run.record}}" }
quantity = { value = "{{code.units}}" }
priceOverride = { value = "{{code.amount}}", currency = "CAD" }
