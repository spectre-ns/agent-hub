id = "lab-result-review"
title = "Lab result review"
record = "Observation"
summary = """
One result, from filed to closed: the result is this workflow's record, and its review is where the work is. It
stops in two places: to sort, and in review. A physician's decision closes it, with what follows set going on the
way out: the patient told it is normal or that it was reviewed, a call asked for (a follow-up of its own), or a visit
asked for. The result does not stay open while the call or the visit is worked.

A result arrives from the lab. No result is refused over its flag: the flag is kept on the result as the lab sent
it (N, H, L, A, AA, HH, LL, words, or nothing) and read by code as critical, abnormal, normal or unknown. Code also
checks the value against its range and the practice's critical limits, whatever the lab's flag says; a result the lab
or the check calls critical pages the physicians at once and goes straight to an urgent physician review, without
waiting for the sort. Other results are sorted first. Only a result that the lab, the sort and the range check all
call normal can be filed as normal, and only then is the patient told it is normal: a result whose flag is missing, or
is one the code does not know, is never filed as normal, and a physician reviews it like any other.
The reviewing physician and the date are written back to the result. Agents sort; they never sign off a result.

A result the lab files starts its review; a result the lab sends for a patient (the lab.result event) is filed as
one, or, when it names the result it already filed, walks that one; a result already reviewed that the lab sends
again (corrected) is reviewed again, from the start. The lab's own status stays the lab's.
"""

[trigger]
starters = ["lab-interface", "nurse", "physician"]
event = "lab.result"

# Sent for the patient without the result filed yet, the run files it: a lab result on the chart, waiting for review.
# Sent naming the result the lab filed (input.observation), the run walks that one instead.
[new_record]
status = "preliminary"
category_text = "laboratory"
test = "{{input.test}}"
value = "{{input.value}}"
unit = "{{input.unit}}"
range_text = "{{input.range}}"
flag_text = "{{input.flag}}"
note_text = "As sent by the lab: {{input.value}} {{input.unit}} ({{input.flag}})"
review = "received"

[[input]]
name = "test"
label = "Test"
type = "string"
required = true
[[input]]
name = "value"
label = "Result value"
type = "string"
required = true
[[input]]
name = "unit"
label = "Unit"
type = "string"
[[input]]
name = "range"
label = "Reference range"
type = "string"
# As the lab sent it, whatever it sent: never a reason to refuse a result. The check reads it (flag.band).
[[input]]
name = "flag"
label = "Lab flag"
type = "string"
help = "as the lab sent it: normal, abnormal, critical, a code (N, H, L, A, AA, HH, LL) or nothing"
[[input]]
name = "observation"
label = "Result record"
type = "reference"
target = ["Observation"]
help = "The result the lab filed for this patient, if it filed one (another patient's is refused); else one is filed"

# ---------------------------------------------------------------------------------------------------------------
# Written as the result's states (where it stops, and the work done there) and the edges between them (what the
# person working it chose, with the automations that run on the way). See practicehub/states.py.

# Filed (or sent again, corrected): checked against its range, by code. A critical one pages the physicians and goes
# straight to review; any other is sorted first.
[start]
to = "checking"
label = "Filed by the lab"

[[state]]
id = "checking"
label = "Checking"
tone = "active"

# What the flag says, in code: critical (HH, LL, AA, critical, panic), abnormal (H, L, A), normal (N), or unknown (no
# flag, or one this does not know). It reads the flag sent and the codes on the result the lab filed.
[[state.work]]
id = "flag"
title = "Read the lab's flag"
kind = "automation"
action = "lab.flag"
[state.work.params]
flag = "{{input.flag}}"

[[state.work]]
id = "check"
title = "Check the value against its range"
kind = "automation"
block = "lab-range-check"
[state.work.params]
test = "{{input.test}}"
value = "{{input.value}}"
unit = "{{input.unit}}"
range = "{{input.range}}"

[[edge]]
id = "critical"
label = "Critical"
from = "checking"
to = "received"
when = "(flag.band == 'critical' or check.band == 'critical')"

[[edge.do]]
id = "page"
title = "Page the physicians"
action = "message.send"
[edge.do.params]
channel = "page"
to = "role:physician"
subject = "CRITICAL result"
body = "Critical {{input.test}} {{input.value}} {{input.unit}} for {{run.subject}} ({{check.reason}}). Review now."

# The page waits for the connector; each physician on duty is also told on the board at once. The notice names no
# test, value or patient (a notice's title shows where the record is withheld); it shows the page and its status.
[[edge.do]]
id = "tell-physicians"
title = "Tell every physician on the board"
action = "notice.send"
[edge.do.params]
role = "physician"
priority = "urgent"
text = "A critical lab result needs a physician's review now"
outbox = "{{page.message_id}}"

[[edge]]
id = "to-sort"
label = "Not critical"
from = "checking"
to = "sorting"

[[state]]
id = "sorting"
label = "To sort"
tone = "active"

[[state.work]]
id = "sort"
title = "Sort the result"
kind = "task"
role = "clinical-assistant"
people_role = "nurse"
due = "1d"
escalate_to = "physician"
skill = "lab-triage"
risk = "medium"
context = ["record:clinical", "input", "flag"]

[[edge]]
id = "sorted"
label = "Sorted"
from = "sorting"
to = "received"

[[state]]
id = "received"
label = "In review"
tone = "attention"

[[state.work]]
id = "review"
title = "Review the result"
kind = "gate"
role = "physician"
due = "2d"
escalate_to = "medical-director"
when = "not (flag.band == 'critical' or check.band == 'critical')"
signer = "person"
meaning = "I have reviewed this result"
context = ["record:clinical", "input", "flag", "check", "sort"]
instructions = """File it as normal only when the lab, the range check and the sort all call it normal and you agree: the
patient is then told it is normal. A result the lab sent with no flag, or with one that could not be read, cannot be
filed as normal. Otherwise choose no action needed (the patient is told it was reviewed, not that it is normal), or
have the patient called or booked in."""

[[state.work]]
id = "review-critical"
title = "Review the result now (critical)"
kind = "gate"
role = "physician"
priority = "urgent"
due = "1h"
escalate_to = "medical-director"
when = "(flag.band == 'critical' or check.band == 'critical')"
signer = "person"
meaning = "I have reviewed this critical result"
context = ["input", "flag", "check", "record:clinical"]
instructions = """The lab or the range check calls this result critical. Act on it now: have the patient called, or
send them to emergency care. It has not been sorted by an agent."""

[[edge]]
id = "file-normal"
label = "File as normal"
from = "received"
to = "closed"
when = "flag.band == 'normal' and sort.category == 'normal' and check.band == 'normal'"
[[edge.do]]
id = "file-normal-noted"
title = "Note who reviewed the result, and when"
action = "clock.now"
[edge.do.params]
by = "{{review.by}}{{review-critical.by}}"
outcome = "file-normal"
comment = "{{review.comment}}{{review-critical.comment}}"
[[edge.do]]
id = "file-normal-filed"
title = "File the review on the result"
action = "record.update"
[edge.do.params.set]
status = "final"
extension = [
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-by", valueReference = { reference = "Practitioner/{{file-normal-noted.by}}" } },
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-on", valueDateTime = "{{file-normal-noted.now}}" },
  { url = "https://harbourview.example/fhir/StructureDefinition/review-outcome", valueString = "file-normal" },
]
[[edge.do]]
id = "tell-normal"
title = "Tell the patient it is normal"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your {{input.test}} result"
body = "Your physician has reviewed your {{input.test}} result and it is within the normal range. No action is needed."

[[edge]]
id = "no-action-needed"
label = "No action needed"
from = "received"
to = "closed"
when = "not (flag.band == 'normal' and sort.category == 'normal' and check.band == 'normal')"
[[edge.do]]
id = "no-action-needed-noted"
title = "Note who reviewed the result, and when"
action = "clock.now"
[edge.do.params]
by = "{{review.by}}{{review-critical.by}}"
outcome = "no-action-needed"
comment = "{{review.comment}}{{review-critical.comment}}"
[[edge.do]]
id = "no-action-needed-filed"
title = "File the review on the result"
action = "record.update"
[edge.do.params.set]
status = "final"
extension = [
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-by", valueReference = { reference = "Practitioner/{{no-action-needed-noted.by}}" } },
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-on", valueDateTime = "{{no-action-needed-noted.now}}" },
  { url = "https://harbourview.example/fhir/StructureDefinition/review-outcome", valueString = "no-action-needed" },
]
[[edge.do]]
id = "tell-reviewed"
title = "Tell the patient their result was reviewed"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your {{input.test}} result"
body = "Your physician has reviewed your {{input.test}} result. No action is needed right now; you can talk about it at your next visit, or call us if you have questions."

[[edge]]
id = "call-patient"
label = "Call the patient"
from = "received"
to = "closed"
[[edge.do]]
id = "call-patient-noted"
title = "Note who reviewed the result, and when"
action = "clock.now"
[edge.do.params]
by = "{{review.by}}{{review-critical.by}}"
outcome = "call-patient"
comment = "{{review.comment}}{{review-critical.comment}}"
[[edge.do]]
id = "call-patient-filed"
title = "File the review on the result"
action = "record.update"
[edge.do.params.set]
status = "final"
extension = [
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-by", valueReference = { reference = "Practitioner/{{call-patient-noted.by}}" } },
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-on", valueDateTime = "{{call-patient-noted.now}}" },
  { url = "https://harbourview.example/fhir/StructureDefinition/review-outcome", valueString = "call-patient" },
]
[[edge.do]]
id = "follow-up"
title = "Ask a nurse to call the patient"
when = "review.outcome == 'call-patient'"
action = "workflow.start"
[edge.do.params]
workflow = "patient-follow-up"
record = "{{run.subject}}"
[edge.do.params.input]
what = "Call about the {{input.test}} result"
urgency = "routine"
because_of = "{{run.record}}"
note = "{{review.comment}}"

[[edge.do]]
id = "follow-up-now"
title = "Ask a nurse to call the patient now (critical result)"
when = "review-critical.outcome == 'call-patient'"
action = "workflow.start"
[edge.do.params]
workflow = "patient-follow-up"
record = "{{run.subject}}"
[edge.do.params.input]
what = "Call about the {{input.test}} result"
urgency = "urgent"
because_of = "{{run.record}}"
note = "{{review-critical.comment}}"

[[edge]]
id = "book-visit"
label = "Book a visit"
from = "received"
to = "closed"
[[edge.do]]
id = "book-visit-noted"
title = "Note who reviewed the result, and when"
action = "clock.now"
[edge.do.params]
by = "{{review.by}}{{review-critical.by}}"
outcome = "book-visit"
comment = "{{review.comment}}{{review-critical.comment}}"
[[edge.do]]
id = "book-visit-filed"
title = "File the review on the result"
action = "record.update"
[edge.do.params.set]
status = "final"
extension = [
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-by", valueReference = { reference = "Practitioner/{{book-visit-noted.by}}" } },
  { url = "https://harbourview.example/fhir/StructureDefinition/reviewed-on", valueDateTime = "{{book-visit-noted.now}}" },
  { url = "https://harbourview.example/fhir/StructureDefinition/review-outcome", valueString = "book-visit" },
]
[[edge.do]]
id = "book"
title = "Ask for a visit"
when = "review.outcome == 'book-visit'"
action = "workflow.start"
[edge.do.params]
workflow = "appointment-request"
record = "{{run.subject}}"
[edge.do.params.input]
reason = "Follow-up on {{input.test}} result"
urgency = "soon"
because_of = "{{run.record}}"
asked_by = "{{review.by}}"       # not held, the visit goes back to the physician who asked for it

[[edge.do]]
id = "book-critical"
title = "Ask for an urgent visit (critical result)"
when = "review-critical.outcome == 'book-visit'"
action = "workflow.start"
[edge.do.params]
workflow = "appointment-request"
record = "{{run.subject}}"
[edge.do.params.input]
reason = "Follow-up on {{input.test}} result"
urgency = "urgent"
because_of = "{{run.record}}"
asked_by = "{{review-critical.by}}"

[[state]]
id = "closed"
label = "Closed"
tone = "done"
