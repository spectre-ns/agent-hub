id = "patient-question"
title = "Patient question"
record = "Communication"
summary = """
One message, from received to closed: the patient's message is this workflow's record, about the patient, and where
it is in its handling is where the work is. Screened as it arrives, it waits with whoever answers it: a nurse to call
the patient now, an agent drafting a reply, the front desk checking that reply, or a nurse answering it. Answered, it
is closed. Each message is its own record and its own run: a new question while another waits is never folded into it.

A patient writes in with a question. Code screens it first for red flags (chest pain, trouble breathing, stroke
signs...): a flagged message goes straight to a nurse to call the patient within 30 minutes. Every patient is told
at once that messages are not read around the clock and to call 911 in an emergency. Only a message that is plainly
about paperwork and names nothing like a symptom may get an agent's draft; anything else, including a warning sign
the patient denies ("no chest pain"), goes to a nurse within hours. For a routine message the clinical admin agent drafts a reply from an injected prompt (the
patient-reply-draft block) and a person at the front desk reads it and signs before it goes out. A clinical question,
or a draft the front desk will not send, goes to a nurse, and the nurse's answer is sent. No message is dropped.
"""

[trigger]
starters = ["front-desk", "nurse", "physician", "patient-portal"]
event = "patient.question"
one_open_per = "subject"           # the same submission twice (a double press, two people typing in one call)...
one_open_same = ["input.question"] # ...with the same words...
one_open_within = "10m"            # ...a moment ago starts one; any other message is its own

# Started on the patient (the portal, the desk), the run files the message on the chart and handles it.
[new_record]
status = "in-progress"
medium_text = "portal"
message = "{{input.question}}"
handling = "received"

[[input]]
name = "question"
type = "text"
label = "The patient's message"
required = true

# ---------------------------------------------------------------------------------------------------------------
# Written as the message's states (where it waits, and the work done there) and the edges between them (what the
# person working it chose, with the automations that run on the way). See practicehub/states.py.

# Received: screened by code for red flags, and the patient told at once what to do in an emergency. A red flag goes
# to a nurse to call now; a message plainly about paperwork to an agent's draft; anything else to a nurse.
[start]
to = "with-nurse"
label = "Received"

[[start.do]]
id = "screen"
title = "Screen the message for red flags"
block = "patient-message-screen"
[start.do.params]
question = "{{input.question}}"

[[start.do]]
id = "safety-net"
title = "Tell the patient what to do in an emergency"
action = "message.send"
[start.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "We have your message"
body = "{{screen.advice}}"

[[start.do]]
id = "routine"
title = "Have a reply drafted (paperwork only)"
when = "screen.routine == true"
to = "drafting"

# last, so a red flag wins over anything else the screen said
[[start.do]]
id = "red-flag"
title = "Have a nurse call now (red flag)"
when = "screen.red_flag == true"
to = "to-call"

# --- a red flag: a nurse calls now ------------------------------------------------------------------------------

[[state]]
id = "to-call"
label = "To call now"
tone = "attention"

[[state.work]]
id = "urgent"
title = "Call the patient now (red flag)"
kind = "task"
role = "nurse"
persons_only = true
priority = "urgent"
due = "30m"
escalate_to = "physician"
context = ["record:demographics", "record:clinical", "input.question", "screen"]
instructions = """The message may describe an emergency. Call the patient now. Advise 911 or the emergency department if
needed, or book them in today. Write down what you did."""
[[state.work.fields]]
name = "notes"
type = "text"
required = true

[[edge]]
id = "sent-to-emergency"
label = "Sent to emergency"
from = "to-call"
to = "answered"

[[edge]]
id = "booked-today"
label = "Booked today"
from = "to-call"
to = "answered"

[[edge]]
id = "advised"
label = "Advised"
from = "to-call"
to = "answered"

[[edge]]
id = "could-not-reach"
label = "Could not reach"
from = "to-call"
to = "not-reached"

# Nobody reached: a physician decides. Reached, the message is answered; otherwise it is closed with what they did.
[[state]]
id = "not-reached"
label = "Could not reach"
tone = "attention"

[[state.work]]
id = "not-reached"
title = "The nurse could not reach the patient (red flag)"
kind = "task"
role = "physician"
persons_only = true
priority = "urgent"
due = "30m"
escalate_to = "medical-director"
context = ["input.question", "screen", "urgent", "record:demographics", "record:clinical"]
instructions = """The patient's message may describe an emergency and a nurse could not reach them. Decide what happens
now: try again, call their emergency contact, or ask for a welfare check. Write down what you did."""
[[state.work.fields]]
name = "notes"
type = "text"
required = true

[[edge]]
id = "reached-the-patient"
label = "Reached the patient"
from = "not-reached"
to = "answered"

[[edge]]
id = "called-emergency-contact"
label = "Called their emergency contact"
from = "not-reached"
to = "closed"
[[edge.do]]
id = "close-emergency-contact"
title = "Close the message"
action = "record.update"
[edge.do.params.set]
status = "completed"

[[edge]]
id = "welfare-check"
label = "Asked for a welfare check"
from = "not-reached"
to = "closed"
[[edge.do]]
id = "close-welfare-check"
title = "Close the message"
action = "record.update"
[edge.do.params.set]
status = "completed"

[[edge]]
id = "no-further-action"
label = "Nothing more to do"
from = "not-reached"
to = "closed"
[[edge.do]]
id = "close-no-further-action"
title = "Close the message"
action = "record.update"
[edge.do.params.set]
status = "completed"

# --- paperwork: an agent drafts, the front desk checks and sends ---------------------------------------------

[[state]]
id = "drafting"
label = "Reply being drafted"
tone = "active"

[[state.work]]
id = "draft"
title = "Draft a reply"
kind = "task"
role = "clinical-assistant"
people_role = "nurse"
due = "1d"
escalate_to = "nurse"
block = "patient-reply-draft"
context = ["record:demographics", "input.question"]
[state.work.params]
question = "{{input.question}}"
tone = "warm"

# A draft the agent says needs a clinician goes to a nurse instead of the front desk.
[[edge]]
id = "drafted"
label = "Drafted"
from = "drafting"
to = "to-check"
[[edge.do]]
id = "needs-clinician"
title = "Pass it to a nurse"
when = "draft.needs_clinician == true"
to = "with-nurse"

[[state]]
id = "to-check"
label = "Reply to check"
tone = "active"

[[state.work]]
id = "review"
title = "Check and send the reply"
kind = "gate"
role = "front-desk"
signer = "person"
meaning = "I have read this reply and it may go to the patient"
due = "1d"
escalate_to = "nurse"
context = ["input.question", "draft.reply"]
instructions = """Read the patient's message first, then the drafted reply. Send it only if the message is an
administrative question and the reply says nothing clinical. If the message describes any symptom, or anything
sounds urgent, choose needs-a-clinician: a nurse answers the patient instead."""

[[edge]]
id = "send"
label = "Send"
from = "to-check"
to = "answered"
[[edge.do]]
id = "send"
title = "Send the reply"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your question"
body = "{{draft.reply}}"

[[edge]]
id = "needs-a-clinician"
label = "Needs a clinician"
from = "to-check"
to = "with-nurse"

# --- anything else: a nurse answers ------------------------------------------------------------------------------

[[state]]
id = "with-nurse"
label = "With a nurse"
tone = "active"

[[state.work]]
id = "clinician"
title = "Answer a clinical question"
kind = "task"
role = "nurse"
persons_only = true
due = "4h"
escalate_to = "physician"
context = ["input.question", "screen", "record:demographics", "record:clinical", "draft.reply"]
instructions = """The patient's question needs clinical judgement. Read their message for anything urgent first: if
it may be an emergency, call them now. Then write the answer they will receive, or book them in and say so."""
[[state.work.fields]]
name = "answer"
type = "text"
required = true

[[edge]]
id = "answer"
label = "Answered"
from = "with-nurse"
to = "answered"
[[edge.do]]
id = "send-answer"
title = "Send the nurse's answer"
action = "message.send"
[edge.do.params]
channel = "patient-portal"
to = "{{run.subject}}"
subject = "Your question"
body = "{{clinician.answer}}"

# --- answered, then closed -----------------------------------------------------------------------------------------

[[state]]
id = "answered"
label = "Answered"
tone = "done"

[[state.work]]
id = "close"
title = "Close the message"
kind = "automation"
action = "record.update"
[state.work.params.set]
status = "completed"

[[edge]]
id = "closed"
label = "Closed"
from = "answered"
to = "closed"

[[state]]
id = "closed"
label = "Closed"
tone = "done"
