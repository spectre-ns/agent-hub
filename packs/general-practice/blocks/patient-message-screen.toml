id = "patient-message-screen"
title = "Screen a patient message for red flags"
runtime = "python"
summary = """
Reads a patient's message for words that may mean an emergency (chest pain or pressure, trouble breathing, blue lips,
stroke signs, heavy bleeding, thoughts of suicide or an overdose, a severe allergic reaction, a fever in a young baby...).
Plain code, not a model: the same words always give the same answer. A message it flags goes straight to a nurse to
call the patient; no agent drafts a reply to it. It errs towards flagging: a nurse reading a message that was fine
costs minutes, a missed emergency does not.

A warning sign the patient says they do not have ("no chest pain") is not a red flag, but the message is marked
``unsure`` and a nurse answers it within hours, not an agent. "Never had pain like this", "without warning", "no one
is home" are not denials. Thoughts of suicide or self-harm, harm from or to others, and poisoning are never read as
denied. A keyword list will miss things, so two more guards: every message, flagged or not, gets ``advice`` telling the
patient the inbox is not watched around the clock and to call 911 in an emergency; and only a message that is plainly
about paperwork (booking, forms, refills, billing...) and names nothing like a symptom is ``routine``. Only a routine
message may get an agent's draft; everything else goes to a nurse.
"""

