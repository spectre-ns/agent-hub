NEGATION = re.compile(r"\b(no|not|none|denies|deny|don.?t\W+have|do\W+not\W+have|haven.?t\W+(had|got)|"
                      r"hasn.?t\W+had|free\W+of)\b")
# not a denial of the sign: "no one is home", "not sure", "never had it like this", "without warning"
NOT_A_DENIAL = re.compile(r"\b(no\W+one|nobody|no\W+way|not\W+sure|not\W+certain|not\W+great|not\W+good|"
                          r"not\W+well|not\W+ok|not\W+okay|don.?t\W+know|no\W+idea|not\W+(helping|working|getting|going|improving|"
                          r"stopping|easing|better|settling|touching)|no\W+(better|change|relief|help|longer))\b")
# words after a sign that undo a denial: "haven't had pain like this before", "isn't chest pain normal?"
UNDOES = re.compile(r"\b(like\W+this|like\W+that|this\W+(bad|badly|much|strong)|so\W+(bad|badly)|before|ever|"
                    r"normal|usual|anymore|any\W+more|worse|again)\b|\?")
CLAUSE = re.compile(r"[,.;:!?]|\b(but|and|though|although|however|except|yet|now)\b")


def denied(text, start):
    """True if the words just before ``start``, in the same clause, deny it ("no chest pain", "I don't have")."""
    before = CLAUSE.split(text[:start])[-1] if CLAUSE.search(text[:start]) else text[:start]
    words = " ".join(before.split()[-4:])
    after = CLAUSE.split(text[start:], maxsplit=1)[0] if CLAUSE.search(text[start:]) else text[start:]
    end = CLAUSE.search(text[start:])
    if UNDOES.search(after) or (end and end.group(0) == "?"):
        return False
    return bool(NEGATION.search(NOT_A_DENIAL.sub(" ", words)))


# Only a message that is plainly about the practice's paperwork, and names nothing that sounds like a symptom, is
# "routine": an agent may draft a reply to it. Everything else goes to a nurse. The keyword list above will always
# miss some way of saying an emergency; this makes a miss cost hours with a nurse, not a reply from an agent.
ADMIN = re.compile(r"\b(appointment|appt|book|booking|re.?schedul\w*|cancel\w*|move\W+my|slot|form|forms|sick\W+note|"
                   r"doctor.?s\W+note|note\W+for|letter|fax|records?|copy\W+of|bill|billing|invoice|receipt|insurance|"
                   r"payment|pay|refill|renew\w*|prescription|repeat|pharmacy|referral|address|phone\W+number|email|"
                   r"hours|open|closed|parking|portal|password|log\W*in|results?|vaccin\w*|flu\W+shot|covid\W+shot|"
                   r"physical|check.?up|annual|new\W+patient|transfer|wait\W*list)\b")
SYMPTOM = re.compile(r"pain|hurt|ache|aching|sore|breath|bleed|blood|dizz|faint|light.?headed|vomit|throw\w*\W+up|nause|"
                     r"\bsick\b|\bill\b|unwell|fever|temperature|\bhot\b|cold\W+and|swell|swoll|rash|itch|hives|numb|"
                     r"tingl|weak|confus|droop|\bdie\b|dying|dead|suicid|kill|harm|overdos|swallow|drank|drunk|poison|"
                     r"unsafe|afraid|scared|frighten|panic|depress|anxi|chest|heart|pulse|sugar|glucose|seiz|\bfits?\b|"
                     r"collaps|respond|shak|shiver|lump|cough|diarr|infect|burn|\bcut\b|wound|\bfell\b|\bfall|injur|"
                     r"accident|pregnan|symptom|side\W+effect|reaction|allerg|stroke|can.?t\W+(move|see|feel|speak|talk|"
                     r"walk|eat|sleep|stop|wake|keep)|worse|\bbad\b|urgent|emergency|asap|right\W+away|help\b|wors|"
                     r"mental|cope|coping|alone|crisis|pills|tablets|took|taken|double|extra|missed|forgot|instead|"
                     r"swelling|jaw|arm|leg|face|eye|vision|head|stomach|belly|tummy|baby|newborn|rope|goodbye")


def run(input):
    text = " ".join(str(input.get("question") or "").lower().replace("\u2019", "'").split())
    found, mentioned = [], []
    for name, pattern, may_be_denied in FLAGS:
        hits = list(re.finditer(f"(?=(?:{pattern}))", text))  # every place it matches, overlapping ones too
        if not hits:
            continue
        if may_be_denied and all(denied(text, m.start()) for m in hits):
            mentioned.append(name)
        else:
            found.append(name)
    if found:
        advice = ("If this is an emergency, call 911 or go to the nearest emergency department now. "
                  "A nurse at the practice has your message and will call you as soon as possible.")
    else:
        advice = ("We have your message and will reply within one working day. Messages are not read around the "
                  "clock: if you think this is an emergency, call 911 or go to the nearest emergency department. "
                  "For urgent advice any time, call 811.")
    routine = not found and not mentioned and bool(ADMIN.search(text)) and not SYMPTOM.search(text)
    return {"red_flag": bool(found), "flags": found, "unsure": bool(mentioned) and not found,
            "mentioned": mentioned, "routine": routine, "advice": advice,
            "admin_reason": str(input.get("question") or "")[:300] if routine else ""}
'''

[[input]]
name = "question"
type = "text"
required = true
help = "the patient's message, as they wrote it"

[[output]]
name = "red_flag"
type = "boolean"
required = true

[[output]]
name = "flags"
type = "list"

[[output]]
name = "unsure"
type = "boolean"

[[output]]
name = "mentioned"
type = "list"

[[output]]
name = "routine"
type = "boolean"
help = "true only for a plainly administrative message that names nothing like a symptom: only these may get an agent's draft"

[[output]]
name = "advice"
type = "string"

[[output]]
name = "admin_reason"
type = "string"
help = "the message itself when it is routine (paperwork, a check-up), else empty: safe to show staff who never see the chart"
