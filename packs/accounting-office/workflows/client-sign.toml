id = "client-sign"
title = "Client approval on the portal"
record = "Client"
summary = """
A client answers on the portal about one record of theirs, the one they read and chose (`about`): they approve their
return and authorise filing it (the T183), or sign their engagement letter, or they have a question. An approval is
recorded on that record alone (with two years' returns waiting, signing one marks only that one), which its own
workflow is waiting for. A question, or an approval of a record that is not the client's, not waiting for them or
signed already, goes to the office, and nothing is written.

The client's approval is theirs: it never stands in for the firm's review or a partner's filing signature.
"""

[trigger]
starters = ["client-portal", "admin", "partner", "manager"]

[[input]]
name = "about"
label = "What the client is answering"
type = "reference"
target = ["T1Return", "Engagement"]
required = true
help = "Their return (authorise filing, T183), or their engagement letter"

[[input]]
name = "answer"
label = "Answer"
type = "choice"
choices = ["approve", "question"]
labels = { approve = "I approve and sign", question = "I have a question first" }
required = true

# Written as states and edges (see practicehub/states.py). A client has no state field: the run keeps where it is.
# The answer is recorded at once; one the hub could not record (a question, or nothing waiting) goes to the office.
[start]
to = "answered"
label = "Answered on the portal"

[[state]]
id = "answered"
label = "Answered"
tone = "active"

[[state.work]]
id = "sign"
title = "Record the client's approval"
kind = "automation"
action = "client.sign"
[state.work.params]
about = "{{input.about}}"
answer = "{{input.answer}}"

[[edge]]
id = "to-office"
label = "For the office"
from = "answered"
to = "with-office"
when = "sign.signed != true"

[[edge]]
id = "recorded"
label = "Recorded"
from = "answered"
to = "done"

[[state]]
id = "with-office"
label = "With the office"
tone = "attention"

[[state.work]]
id = "office"
title = "Answer the client"
kind = "task"
role = "admin"
persons_only = true
due = "1d"
escalate_to = "manager"
context = ["sign", "record:correspondence"]
instructions = "The client asked a question on the portal, or approved something that was not waiting for them. Call or write back."
[[state.work.fields]]
name = "reply"
label = "What you told them"
type = "text"
required = true

[[edge]]
id = "answered-by-office"
label = "Answered"
from = "with-office"
to = "done"

[[state]]
id = "done"
label = "Done"
tone = "done"
