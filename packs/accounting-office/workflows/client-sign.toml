id = "client-sign"
title = "Client approval on the portal"
record = "Client"
summary = """
A client answers on the portal: they approve their return and authorise filing it (the T183), or sign their
engagement letter, or they have a question. An approval is recorded on what it approves (the return waiting for the
client, the engagement letter waiting for a signature), which its own workflow is waiting for. A question, or an
approval with nothing waiting for it, goes to the office.

The client's approval is theirs: it never stands in for the firm's review or a partner's filing signature.
"""

[trigger]
starters = ["client-portal", "admin", "partner", "manager"]

[[input]]
name = "what"
label = "What the client is answering"
type = "choice"
choices = ["t183", "engagement"]
labels = { t183 = "My tax return (authorise filing, T183)", engagement = "My engagement letter" }
required = true

[[input]]
name = "answer"
label = "Answer"
type = "choice"
choices = ["approve", "question"]
labels = { approve = "I approve and sign", question = "I have a question first" }
required = true

[[steps]]
id = "sign"
title = "Record the client's approval"
kind = "automation"
action = "client.sign"
[steps.params]
what = "{{input.what}}"
answer = "{{input.answer}}"

[[steps]]
id = "office"
title = "Answer the client"
kind = "task"
role = "admin"
persons_only = true
after = ["sign"]
when = "sign.signed != true"
due = "1d"
escalate_to = "manager"
context = ["sign", "record:correspondence"]
instructions = "The client asked a question on the portal, or approved something that was not waiting for them. Call or write back."
[[steps.fields]]
name = "reply"
label = "What you told them"
type = "text"
required = true
