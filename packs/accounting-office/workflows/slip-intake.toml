id = "slip-intake"
title = "Read a slip or document"
record = "TaxSlip"
summary = """
A slip, receipt or notice that came in (the portal, email, an upload) is read by the documents agent: what it is,
for which year, from whom, its amounts. The client's return for that year then counts it: a slip it was waiting for is
no longer missing, and a notice of assessment is recorded on the return it assesses. A document the agent cannot read
goes to the office.
"""

[trigger]
starters = ["partner", "manager", "senior", "staff", "bookkeeper", "admin", "client-portal"]

# Written as the slip's states and the edges between them (see practicehub/states.py). Received, the documents agent
# reads it (or a person records what it says, on the slip's page); read, it counts on the client's return. A slip's
# words are read from its file when it is attached (a PDF's text); a photo is shown to the agent's model for pictures,
# which writes its words as printed, and what it read is checked against them.
[start]
to = "received"
label = "Received"

[[state]]
id = "received"
label = "Received"
tone = "waiting"

[[state.work]]
id = "extract"
title = "Read the slip"
kind = "task"
role = "document-clerk"
skill = "slip-extract"
risk = "low"
due = "1d"
people_role = "staff"
context = ["record:client-documents", "file:file"]

[[edge]]
id = "read"
label = "Read"
from = "received"
to = "extracted"

[[edge.do]]
id = "file-slip"
title = "Count it on the client's return"
action = "t1.slip_filed"

[[state]]
id = "extracted"
label = "Read"
tone = "done"
