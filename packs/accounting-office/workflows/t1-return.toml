id = "t1-return"
title = "Personal tax return (T1)"
record = "T1Return"
summary = """
One client's T1 for one year, from asking for the slips to the notice of assessment. The return is this workflow's
record and its status is where the work is.

The documents agent sends the organizer (what came last year, what to send this year) and chases what is still
missing. Slips that arrive (on the portal, by email, uploaded) are read by the documents agent, and the return counts
them. Once they are in, the hub compares this year with last year; the tax agent drafts the return. A draft over the
risk line (a large change in the refund, a new kind of income, a slip from last year missing) is held for its sponsor
before it goes on. A manager or partner reviews it and signs; the agent writes the client a summary; the client
authorises filing (T183) on the portal, or on paper. A partner files it from the firm's certified tax software and
records that here, by signing, with the CRA's confirmation number and the date: the hub transmits nothing to the CRA.
The client is invoiced once the filing is recorded. When the notice of assessment comes, the hub compares it with the
return, and a difference goes to a manager.

What was reviewed is what the client authorises and what is filed. Once the review is signed nobody edits the return;
it is reopened for changes instead (by whoever holds its work, or by a slip that comes late), which sends it back to
be compared, drafted, reviewed and authorised again. The client's earlier authorisation does not carry over.

No agent signs, files or approves: the review and filing are a person's signed moves on the return's page.
"""

[trigger]
starters = ["partner", "manager", "senior", "staff", "admin"]

[deadline]
within = "26w"
escalate_to = "partner"

# Written as the return's states and the edges between them (see practicehub/states.py). The review and filing are
# signed moves on the return's page: each is the one way on from its state, so making it does that state's task.

[start]
to = "organizer"
label = "Opened"

# A return reopened for changes is back at comparing, and this is its next pass: it is compared and drafted again.
# What the client authorised was the return as it was, so their authorisation (T183) is cleared.
[[start.do]]
id = "reopen"
title = "Reopened: the client's authorisation no longer stands"
action = "t1.reopen"
when = "record.status == 'comparing'"
to = "comparing"

# --------------------------------------------------------------------------------------------- gathering the slips
[[state]]
id = "organizer"
label = "Writing the organizer"
tone = "active"

[[state.work]]
id = "organizer"
title = "Send the organizer"
kind = "task"
role = "document-clerk"
skill = "t1-organizer"
risk = "low"
due = "2d"
escalate_to = "admin"
people_role = "admin"
context = ["record:tax", "record:client-documents", "record:profile"]

[[edge]]
id = "organizer-sent"
label = "Organizer sent"
from = "organizer"
to = "gathering"

[[edge.do]]
id = "send-organizer"
title = "Send the organizer to the client"
action = "t1.organizer_sent"
[edge.do.params]
expected = "{{organizer.expected_slips}}"
missing = "{{organizer.missing_slips}}"
subject = "{{organizer.subject}}"
body = "{{organizer.body}}"
drafted_by = "{{organizer.by}}"

[[state]]
id = "gathering"
label = "Gathering slips"
tone = "waiting"

[[state.work]]
id = "wait-slips"
title = "Wait for the slips"
kind = "wait"
until = "record.slips_complete == true or record.status == 'comparing'"
timeout = "21d"

[[edge]]
id = "slips-in"
label = "All in"
from = "gathering"
to = "comparing"
when = "record.slips_complete == true or record.status == 'comparing'"

[[edge]]
id = "slips-late"
label = "Not all in after three weeks"
from = "gathering"
to = "chasing"

[[state]]
id = "chasing"
label = "Chasing slips"
tone = "active"

[[state.work]]
id = "chase"
title = "Chase the missing slips"
kind = "task"
role = "document-clerk"
skill = "slip-chase"
risk = "low"
due = "2d"
people_role = "admin"
context = ["record:tax", "record:client-documents", "record:profile"]

[[edge]]
id = "reminder-sent"
label = "Reminder sent"
from = "chasing"
to = "reminded"

[[edge.do]]
id = "send-chase"
title = "Send the reminder"
action = "client.message"
[edge.do.params]
channel = "email"
subject = "{{chase.subject}}"
body = "{{chase.body}}"
drafted_by = "{{chase.by}}"

[[state]]
id = "reminded"
label = "Gathering slips (reminded)"
tone = "waiting"

[[state.work]]
id = "wait-slips-again"
title = "Wait for the slips (after the reminder)"
kind = "wait"
until = "record.slips_complete == true or record.status == 'comparing'"
timeout = "14d"

[[edge]]
id = "slips-in-after-reminder"
label = "All in"
from = "reminded"
to = "comparing"
when = "record.slips_complete == true or record.status == 'comparing'"

[[edge]]
id = "still-missing"
label = "Still missing after the reminder"
from = "reminded"
to = "slips-missing"

[[state]]
id = "slips-missing"
label = "Slips missing"
tone = "attention"

[[state.work]]
id = "follow-up"
title = "Call the client about the missing slips"
kind = "task"
role = "staff"
persons_only = true
due = "3d"
escalate_to = "manager"
context = ["record:tax", "record:client-documents", "chase"]
instructions = """The client was sent the organizer and a reminder and some slips are still missing. Call them.
Prepare without them if they will not come (a slip the client says does not exist this year), or withdraw the
return if there is nothing to file."""
[[state.work.fields]]
name = "notes"
label = "What the client said"
type = "text"
required = true

[[edge]]
id = "prepare"
label = "Prepare with what we have"
from = "slips-missing"
to = "comparing"

[[edge]]
id = "withdraw"
label = "Withdraw the return"
from = "slips-missing"
to = "withdrawn"

[[edge.do]]
id = "withdrawal-note"
title = "Note why it was withdrawn"
action = "record.update"
[edge.do.params.set]
note = "Withdrawn after the slips did not come: {{follow-up.notes}}"

# ------------------------------------------------------------------------------------------------------ preparing
# The risk line: deterministic, in pack.py (t1.compare), never the agent's judgement.
[[state]]
id = "comparing"
label = "Comparing with last year"
tone = "active"

[[state.work]]
id = "compare"
title = "Compare with last year"
kind = "automation"
action = "t1.compare"

[[edge]]
id = "compared"
label = "Compared"
from = "comparing"
to = "preparing"

[[state]]
id = "preparing"
label = "Preparing"
tone = "active"

[[state.work]]
id = "draft"
title = "Draft the return"
kind = "task"
role = "tax-preparer"
skill = "t1-draft"
risk = "medium"
when = "compare.over_line != true"
due = "5d"
people_role = "senior"
context = ["record:tax", "record:client-documents", "record:profile", "compare"]

[[state.work]]
id = "draft-flagged"
title = "Draft the return (over the risk line)"
kind = "task"
role = "tax-preparer"
skill = "t1-draft"
risk = "high"
when = "compare.over_line == true"
due = "5d"
people_role = "senior"
context = ["record:tax", "record:client-documents", "record:profile", "compare"]

[[edge]]
id = "drafted"
label = "Ready for review"
from = "preparing"
to = "in-review"

# ------------------------------------------------------------------------------------------------------ the review
[[state]]
id = "in-review"
label = "In review"
tone = "attention"

[[state.work]]
id = "review"
title = "Review the return"
kind = "task"
role = "manager"
persons_only = true
not_by = ["draft", "draft-flagged"]   # whoever drafted it does not review it
when = "record.status == 'in-review'"   # a slip that came late took it back to be drafted again: nothing to review
moves = ["comparing"]
due = "5d"
escalate_to = "partner"
context = ["record:tax", "record:client-documents", "compare"]
instructions = """Check the draft against the slips and last year. A review does not change the figures: if one is
wrong, or something is missing, send it back with your review points (on the return's page): it is compared and
drafted again, answering them first, and comes back to you. If it is right, approve the review there, signed. What
you reviewed is what the client authorises and what is filed."""
[[state.work.fields]]
name = "review_notes"
label = "Reviewer's notes"
type = "text"

[[edge]]
id = "reviewed"
label = "Approve the review"
from = "in-review"
to = "client-approval"

# ------------------------------------------------------------------------------------------------------ the client
[[state]]
id = "client-approval"
label = "Summary for the client"
tone = "active"

[[state.work]]
id = "client-letter"
title = "Write the client's summary"
kind = "task"
role = "tax-preparer"
skill = "t1-client-letter"
risk = "medium"
when = "record.status == 'client-approval'"   # a slip that came late took it back: no summary of the old figures
moves = ["comparing"]
due = "1d"
people_role = "staff"
context = ["record:tax", "record:profile"]

[[edge]]
id = "summary-sent"
label = "Summary sent"
from = "client-approval"
to = "with-client"

[[edge.do]]
id = "send-letter"
title = "Send the summary for approval"
action = "client.message"
[edge.do.params]
channel = "portal"
subject = "{{client-letter.subject}}"
body = "{{client-letter.body}}"
drafted_by = "{{client-letter.by}}"

[[state]]
id = "with-client"
label = "With the client"
tone = "waiting"

[[state.work]]
id = "await-t183"
title = "Wait for the client to authorise filing (T183)"
kind = "wait"
until = "record.t183_signed_on != null or record.status in ['client-signed', 'comparing']"
timeout = "14d"

# Reopened for changes while the client had it (on the return's page, or by a slip that came late): this pass ends,
# and the next one compares and drafts it again.
[[edge]]
id = "reopened-with-client"
label = "Reopened for changes"
from = "with-client"
to = "comparing"
when = "record.status == 'comparing'"

[[edge]]
id = "t183-recorded"
label = "Client authorised"
from = "with-client"
to = "client-signed"
when = "record.t183_signed_on != null or record.status == 'client-signed'"

[[edge]]
id = "t183-late"
label = "Not authorised in two weeks"
from = "with-client"
to = "t183-overdue"

[[state]]
id = "t183-overdue"
label = "T183 not signed yet"
tone = "attention"

[[state.work]]
id = "t183-chase"
title = "Get the client's authorisation (T183)"
kind = "task"
role = "admin"
persons_only = true
when = "record.status == 't183-overdue'"   # reopened for changes: there is nothing to authorise yet
moves = ["comparing"]
due = "5d"
escalate_to = "manager"
context = ["record:tax", "client-letter"]
instructions = """The client has not authorised filing on the portal. Call them; record the signed T183 when you have
it (on paper or by email) on the return's page."""
[[state.work.fields]]
name = "t183_signed_on"
label = "Signed on"
type = "date"
[[state.work.fields]]
name = "t183_how"
label = "How"
type = "choice"
choices = ["paper", "email", "portal"]

[[edge]]
id = "t183-chased"
label = "Client authorised"
from = "t183-overdue"
to = "client-signed"

# ------------------------------------------------------------------------------------------------------ filing
[[state]]
id = "client-signed"
label = "Client authorised (T183)"
tone = "attention"

[[state.work]]
id = "file"
title = "File the return and record it"
kind = "task"
role = "partner"
persons_only = true
# separation of duties: the partner who files did not draft, review or change the return (a one-partner firm says
# otherwise in its own pack)
not_by = ["draft", "draft-flagged", "review", "record.editors"]
when = "record.status == 'client-signed'"   # reopened for changes: there is nothing to file yet
moves = ["comparing"]
due = "3d"
context = ["record:tax", "compare"]
instructions = """The return is reviewed and the client has authorised it. The hub sends nothing to the CRA: file the
return from the firm's tax software (EFILE), exactly as it was reviewed and authorised. Once the CRA has accepted it,
record that on the return's page: the CRA's confirmation number and the date it was filed, with your signature. If
anything must change first, reopen the return for changes instead: it is then reviewed and authorised again."""
[[state.work.fields]]
name = "efile_confirmation"
label = "EFILE confirmation number (from the tax software)"
type = "string"
required = true
[[state.work.fields]]
name = "filed_on"
label = "Filed on"
type = "date"
required = true

[[edge]]
id = "signed-for-filing"
label = "Record the filing"
from = "client-signed"
to = "filing"

# The hub checks what was recorded (a partner's signature, the client's authorisation, the confirmation number and
# the date); it transmits nothing.
[[state]]
id = "filing"
label = "Checking the filing record"
tone = "active"

[[state.work]]
id = "filing-check"
title = "Check the filing as it was recorded"
kind = "automation"
action = "t1.filing_recorded"

[[edge]]
id = "filing-recorded"
label = "Filed, as the partner recorded"
from = "filing"
to = "filed"

[[edge.do]]
id = "invoice"
title = "Invoice the client"
action = "t1.invoice"

# ------------------------------------------------------------------------------------------------------ assessment
[[state]]
id = "filed"
label = "Filed"
tone = "done"

[[state.work]]
id = "await-noa"
title = "Wait for the notice of assessment"
kind = "wait"
until = "record.noa_received == true"

# Assessed as filed, the year's engagement closes; a difference goes to a manager first.
[[edge]]
id = "noa-received"
label = "Notice of assessment received"
from = "filed"
to = "assessed"

[[edge.do]]
id = "compare-noa"
title = "Compare the assessment with the return"
action = "t1.compare_noa"

[[edge.do]]
id = "close-engagement"
title = "Close the year's engagement"
action = "engagement.close"
when = "compare-noa.differs != true"

[[edge.do]]
id = "assessed-differently"
title = "The assessment differs: to a manager"
when = "compare-noa.differs == true"
to = "assessment-differs"

[[state]]
id = "assessment-differs"
label = "Assessed: it differs"
tone = "attention"

[[state.work]]
id = "noa-difference"
title = "Look into the difference on the assessment"
kind = "task"
role = "manager"
persons_only = true
due = "5d"
escalate_to = "partner"
context = ["record:tax", "record:client-documents", "compare-noa"]
instructions = """The CRA assessed this return differently from what was filed. Find out why (a slip that came late,
a CRA adjustment) and say what was done: accepted, a reply to the CRA, an adjustment request (T1-ADJ)."""
[[state.work.fields]]
name = "notes"
label = "What differs and what was done"
type = "text"
required = true

[[edge]]
id = "difference-explained"
label = "Explained"
from = "assessment-differs"
to = "assessed"

[[edge.do]]
id = "record-difference"
title = "Write what was done on the return"
action = "record.update"
[edge.do.params.set]
assessment_notes = "{{noa-difference.notes}}"

[[edge.do]]
id = "close-engagement-after"
title = "Close the year's engagement"
action = "engagement.close"

[[state]]
id = "assessed"
label = "Assessed"
tone = "done"

[[state]]
id = "withdrawn"
label = "Withdrawn"
tone = "ended"
