id = "engagement"
title = "Engagement"
record = "Engagement"
summary = """
One service for one client for one year. A partner accepts it for the firm first, signed, on the engagement's page
(or does not, and the work ends there); no letter goes out before. The documents agent then writes the engagement
letter from the firm's terms and last year's engagement and sends it; the client signs it on the portal (or the office
records a signature on paper). Once signed the hub opens the work (for a T1, the year's T1 return, which its own
workflow walks). When the work is done the engagement closes, and next year's is planned: it waits for its season on
its own, then a partner accepts it again before its letter goes out. A letter not signed in two weeks goes to the
office to chase; a client may decline on the engagement's page.

Each service opens its own work: pack.py's ENGAGEMENT_STARTERS, one entry per service.
"""

[trigger]
starters = ["partner", "manager", "admin"]

# Written as the engagement's states and the edges between them (see practicehub/states.py). A new engagement has its
# partner's acceptance first; a planned one (next year's, made when this year's closes) waits for its season, then
# is accepted again.
[start]
to = "acceptance"
label = "Opened"

[[start.do]]
id = "renewal-date"
title = "Work out when to propose it"
action = "engagement.renewal_date"
when = "record.status == 'planned'"
to = "planned"

[[state]]
id = "planned"
label = "Next season"
tone = "waiting"

[[state.work]]
id = "await-season"
title = "Wait for its season"
kind = "wait"
at = "{{renewal-date.on}}"

[[edge]]
id = "season"
label = "Its season came"
from = "planned"
to = "acceptance"

[[state]]
id = "acceptance"
label = "Acceptance"
tone = "attention"

[[state.work]]
id = "accept"
title = "Accept the engagement"
kind = "task"
role = "partner"
persons_only = true
moves = ["not-accepted"]
due = "3d"
context = ["record:engagement", "record:profile"]
instructions = """Decide whether the firm takes this engagement on (or keeps the client for another year): independence
and conflicts, whether the firm has the competence and the time, and anything that puts the client's integrity in
doubt. Accept it on the engagement's page, signed, saying what you considered; then the letter is written and sent.
If the firm should not act, do not accept it: the work ends there."""
[[state.work.fields]]
name = "acceptance_note"
label = "What you considered"
type = "text"

[[edge]]
id = "accepted"
label = "Accepted"
from = "acceptance"
to = "drafting"

[[state]]
id = "drafting"
label = "Writing the letter"
tone = "active"

[[state.work]]
id = "letter"
title = "Write the engagement letter"
kind = "task"
role = "document-clerk"
skill = "engagement-letter"
risk = "low"
due = "2d"
people_role = "admin"
context = ["record:engagement", "record:profile"]

[[edge]]
id = "letter-sent"
label = "Letter sent"
from = "drafting"
to = "proposed"

[[edge.do]]
id = "send-letter"
title = "Send the letter to the client"
action = "engagement.send"
[edge.do.params]
letter = "{{letter.letter}}"
subject = "{{letter.subject}}"
body = "{{letter.body}}"
drafted_by = "{{letter.by}}"

[[state]]
id = "proposed"
label = "Sent to the client"
tone = "waiting"

[[state.work]]
id = "await-signature"
title = "Wait for the client to sign"
kind = "wait"
until = "record.client_signed_on != null or record.status in ['signed', 'declined']"
timeout = "14d"

[[edge]]
id = "client-signed"
label = "Signed"
from = "proposed"
to = "signed"
when = "record.client_signed_on != null"

[[edge]]
id = "client-declined"
label = "Declined"
from = "proposed"
to = "declined"
when = "record.status == 'declined'"

[[edge]]
id = "not-signed"
label = "Not signed in two weeks"
from = "proposed"
to = "overdue"

[[state]]
id = "overdue"
label = "Not signed yet"
tone = "attention"

[[state.work]]
id = "chase-signature"
title = "Get the engagement letter signed"
kind = "task"
role = "admin"
persons_only = true
due = "5d"
escalate_to = "partner"
context = ["record:engagement", "letter"]
instructions = """The client has not signed the engagement letter. Call them, and record their signature on the
engagement's page (or that they declined)."""
[[state.work.fields]]
name = "client_signed_on"
label = "Signed on"
type = "date"
[[state.work.fields]]
name = "client_signed_how"
label = "How"
type = "choice"
choices = ["paper", "email", "portal"]

[[edge]]
id = "signature-recorded"
label = "Signature recorded"
from = "overdue"
to = "signed"

[[state]]
id = "signed"
label = "Signed"
tone = "active"

[[state.work]]
id = "activate"
title = "Open the work"
kind = "automation"
action = "engagement.activate"

[[edge]]
id = "work-opened"
label = "Work opened"
from = "signed"
to = "active"

[[state]]
id = "active"
label = "In progress"
tone = "active"

[[state.work]]
id = "await-close"
title = "Wait for the work to be done"
kind = "wait"
until = "record.completed_on != null or record.status == 'closed'"

# Next year's engagement is its own record, planned now: this one closes.
[[edge]]
id = "work-done"
label = "Work done"
from = "active"
to = "closed"

[[edge.do]]
id = "renew"
title = "Plan next year's engagement"
action = "engagement.renew"
[edge.do.params]
status = "planned"

[[state]]
id = "closed"
label = "Done"
tone = "done"

[[state]]
id = "declined"
label = "Declined"
tone = "ended"
