# A client of the firm: what every client has, a person or a business. It is abstract: each client is an Individual or
# a Business (or an overlay's own kind of either), and those types add what only a person or a business has. Naming
# Client (a reference, a list, a grant, a workflow) takes in both. It extends the core's Subject, so the core's pages,
# pickers and any module (crm, dms) see every kind. Both kinds share its key (CLI-n) and its client numbers (one TW-
# series). Who owns a company, and who is married to whom, are Relationships.
id = "Client"
abstract = true
key = "CLI"
label = "Client"
plural = "Clients"
data_class = "profile"
extends = "Subject"
strict = true
title = "{name}[ · {client_number}]"
short_title = "{name}"
active = "record.active != false"
order = 0
# a client number names one client: it is on their letters, and how they sign in to the portal. The hub gives it, the
# next in its series (TW-0001), when the client is made; clients carried over from an older version keep theirs.
unique = ["client_number"]
summary = "Someone the firm works for: an individual or a business."

[base]
identifier = "client_number"
contact = "email"
responsible = "partner_in_charge"

[number]
field = "client_number"
pattern = "TW-{seq:04}"

[[field]]
name = "name"                 # the Subject's name: an individual's full name, or a business's legal name
label = "Name"
type = "string"
required = true
match = true

[[field]]
name = "client_number"
label = "Client number"
type = "string"
fact = true
help = "Given by the hub when the client is made (TW- and four digits): on every letter, and how a client signs in to the portal"

[[field]]
name = "email"
label = "Email"
type = "string"
fact = true

[[field]]
name = "phone"
label = "Phone"
type = "string"
fact = true

[[field]]
name = "address"
label = "Mailing address"
type = "text"

[[field]]
name = "services"
label = "Services"
type = "choice"
list = true
choices = ["t1", "bookkeeping", "t2", "gst-hst", "payroll"]
labels = { t1 = "Personal tax (T1)", bookkeeping = "Monthly bookkeeping", t2 = "Corporate year-end (T2)", gst-hst = "GST/HST returns", payroll = "Payroll" }
fact = true

[[field]]
name = "partner_in_charge"
label = "Partner in charge"
type = "member"
fact = true

[[field]]
name = "active"
label = "Active client"
type = "boolean"
help = "false once the client has left the firm"

[[field]]
name = "notes"
label = "Notes"
type = "text"
