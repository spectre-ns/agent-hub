# What the firm agreed to do for a client: one service for one year (a T1 for 2025, the 2025 bookkeeping, a T2 for
# the year ending 2025-12-31). It is part of its client. A partner accepts it for the firm first, signed (CSQM 1: the
# firm takes on, or keeps, only work it can do and a client it can act for), every year: no letter goes out before.
# The engagement workflow then sends the letter, waits for the client's signature (on the portal, or recorded from
# paper), opens the work (for a T1, the year's T1 return) and, once the work is done, closes and plans next year's,
# which waits for its season and is accepted again.
id = "Engagement"
key = "ENG"
label = "Engagement"
plural = "Engagements"
data_class = "engagement"
strict = true
title = "{service} {year}[ · {client_name}]"
short_title = "{service} {year}[ · {client_name}]"
date = "sent_on"
part_of = "client"
order = 30
# one engagement per service per year for a client: next year's is its own
unique = [["client", "service", "year"]]
summary = "One service for one year, as the client signed it."
workflow = { id = "engagement", when = "record.status in ['acceptance', 'planned']" }

[[field]]
name = "client"
label = "Client"
type = "reference"
target = ["Client"]
rel = "subject"
required = true

[[field]]
name = "client_name"
label = "Client name"
type = "string"

[[field]]
name = "service"
label = "Service"
type = "choice"
choices = ["t1", "bookkeeping", "t2", "gst-hst", "payroll"]
labels = { t1 = "Personal tax (T1)", bookkeeping = "Bookkeeping", t2 = "Corporate year-end (T2)", gst-hst = "GST/HST", payroll = "Payroll" }
required = true

[[field]]
name = "year"
label = "Year"
type = "number"
required = true
min = 2000
max = 2100
help = "The tax year (T1), the fiscal year (T2), or the calendar year the service runs in"

[[field]]
name = "status"
label = "Status"
type = "choice"
choices = ["planned", "acceptance", "not-accepted", "drafting", "proposed", "overdue", "signed", "active", "closed", "declined"]
labels = { acceptance = "Waiting for a partner to accept it", not-accepted = "Not accepted by the firm" }
required = true

[[field]]
name = "fee"
label = "Fee (before HST)"
type = "decimal"
scale = 2
min = 0

[[field]]
name = "fee_basis"
label = "Fee basis"
type = "choice"
choices = ["fixed", "monthly", "hourly"]

[[field]]
name = "scope"
label = "What we do"
type = "text"

[[field]]
name = "acceptance_note"
label = "Acceptance: what the partner considered"
type = "text"
help = "Independence, conflicts, the firm's competence and time, the client's integrity: why the firm takes it on, or not"

[[field]]
name = "accepted_by"
label = "Accepted by"
type = "member"
help = "The partner who accepted the engagement for the firm: the move that accepts it says so"

[[field]]
name = "accepted_on"
label = "Accepted on"
type = "date"

[[field]]
name = "letter"
label = "Engagement letter"
type = "markdown"

[[field]]
name = "sent_on"
label = "Sent"
type = "date"

[[field]]
name = "client_signed_on"
label = "Client signed on"
type = "date"

[[field]]
name = "client_signed_how"
label = "How the client signed"
type = "choice"
choices = ["portal", "paper", "email"]
labels = { portal = "On the portal", paper = "On paper", email = "Signed copy by email" }

[[field]]
name = "signed_by_name"
label = "Signed by"
type = "string"
help = "The name of the person who signed: the client, or a company's signing officer"

[[field]]
name = "previous"
label = "Last year's engagement"
type = "reference"
target = ["Engagement"]
rel = "previous"

[[field]]
name = "work"
label = "The work"
type = "reference"
target = ["*"]
rel = "work"
help = "The record the engagement opened: the year's T1 return, the year-end"

[[field]]
name = "completed_on"
label = "Work done on"
type = "date"
help = "When the work it opened was done (a T1: assessed); the engagement then closes"

[[field]]
name = "note"
label = "Note"
type = "text"

[[signature]]
meaning = "I accept this engagement for the firm"
roles = ["partner"]
states = ["acceptance"]

[lifecycle]
field = "status"
initial = "acceptance"

# A partner accepts it, signed, and the letter is written; or does not, and that is the end of it.
[[lifecycle.transition]]
from = ["acceptance"]
to = "drafting"
label = "Accept the engagement"
sign = "I accept this engagement for the firm"
asks = ["acceptance_note"]
requires = ["acceptance_note"]
stamp = ["accepted_by", "accepted_on"]

[[lifecycle.transition]]
from = ["acceptance"]
to = "not-accepted"
label = "Do not accept it"
asks = ["acceptance_note"]
requires = ["acceptance_note"]

[[lifecycle.transition]]
from = ["proposed", "overdue"]
to = "signed"
label = "Record the client's signature"
asks = ["client_signed_on", "client_signed_how", "signed_by_name"]
requires = ["client_signed_on", "client_signed_how"]

[[lifecycle.transition]]
from = ["active"]
to = "closed"
label = "Close: the work is done"
asks = ["completed_on"]

[[lifecycle.transition]]
from = ["planned", "acceptance", "drafting", "proposed", "overdue", "signed"]
to = "declined"
label = "Declined by the client"
asks = ["note"]
