# A person's income tax return (T1) for one year. It is part of its client, made when the year's T1 engagement is
# signed, and walked by the t1-return workflow (its states and edges) from gathering the slips to the notice of
# assessment.
#
# Two moves are signed by a person and never made by an agent or a workflow: the review ("I reviewed this return...",
# a manager or partner) and filing ("I authorise filing...", a partner). The hub transmits nothing to the CRA: the
# partner files the return from the firm's certified tax software, then records that here, signing with the CRA's
# confirmation number and the date. The client's own authorisation (T183) comes in through the portal, or is recorded
# from paper by the office.
#
# What was reviewed is what the client authorises and what is filed: from the review on the return is locked (nobody
# edits its figures), and the only way to change it is to send it back or reopen it, which takes it back to be
# compared, drafted, reviewed and authorised again. The return keeps the slips it was drafted from, each as it was then
# (`slips`): a signature on it covers them too.
#
# Separation of duties: each move says who made it (`prepared_by`, `reviewed_by`, `filed_by`), the reviewer did not
# draft it, and the partner who files it neither drafted, reviewed nor changed it (the t1-return workflow's not_by).
id = "T1Return"
key = "T1"
label = "T1 return"
plural = "T1 returns"
data_class = "tax"
strict = true
title = "T1 {year}[ · {client_name}]"
short_title = "T1 {year}[ · {client_name}]"
date = "due_date"
flag = "attention"
part_of = "client"
order = 10
# one return per client per year: a reopen is the same return, walked again
unique = [["client", "year"]]
summary = "A personal income tax return, from the slips to the notice of assessment."
# A return reopened for changes (back at comparing) is walked again from there: the next pass, a run of its own.
workflow = { id = "t1-return", when = "record.status in ['gathering', 'comparing']" }

[[field]]
name = "client"
label = "Client"
type = "reference"
target = ["Individual"]      # a T1 is an individual's personal tax
rel = "subject"
required = true

[[field]]
name = "client_name"
label = "Client name"
type = "string"
help = "Copied from the client when the return is opened, for lists"

[[field]]
name = "year"
label = "Tax year"
type = "number"
required = true
min = 2000
max = 2100

[[field]]
name = "engagement"
label = "Engagement"
type = "reference"
target = ["Engagement"]
rel = "engagement"

[[field]]
name = "status"
label = "Status"
type = "choice"
choices = ["organizer", "gathering", "chasing", "reminded", "slips-missing", "comparing", "preparing", "in-review", "client-approval", "with-client", "t183-overdue", "client-signed", "filing", "filed", "assessment-differs", "assessed", "withdrawn"]
required = true

[[field]]
name = "due_date"
label = "Filing deadline"
type = "date"

[[field]]
name = "balance_due_date"
label = "Balance owing due"
type = "date"

[[field]]
name = "self_employed"
label = "Self-employed"
type = "boolean"

[[field]]
name = "attention"
label = "Attention"
type = "string"
help = "Why a person must look: over the risk line, a difference on the assessment"

[[field]]
name = "expected_slips"
label = "Slips expected (from last year)"
type = "list"
help = "What came last year, as slip and issuer: what this year's organizer asks for"

[[field]]
name = "missing_slips"
label = "Slips still missing"
type = "list"

[[field]]
name = "slips_complete"
label = "All expected slips are in"
type = "boolean"

[[field]]
name = "slips"
label = "Slips counted"
type = "reference"
target = ["TaxSlip"]
list = true
pin = true
rel = "counted"
by = "workflow"
help = "The slips the return was last compared and drafted from, each as it was then: one that changes since leaves a signature on the return not current"

[[field]]
name = "total_income"
label = "Total income (line 15000)"
type = "decimal"
scale = 2

[[field]]
name = "taxable_income"
label = "Taxable income (line 26000)"
type = "decimal"
scale = 2

[[field]]
name = "tax_deducted"
label = "Tax deducted at source"
type = "decimal"
scale = 2
min = 0

[[field]]
name = "net_refund"
label = "Refund (negative: balance owing)"
type = "decimal"
scale = 2

[[field]]
name = "last_year_refund"
label = "Last year's refund"
type = "decimal"
scale = 2

[[field]]
name = "flags"
label = "What changed and why it was flagged"
type = "text"

[[field]]
name = "draft_summary"
label = "Preparer's summary"
type = "text"

[[field]]
name = "review_notes"
label = "Reviewer's notes"
type = "text"

[[field]]
name = "review_points"
label = "Review points"
type = "text"
help = "What the return was last sent back to answer (by its reviewer, or a slip that came late): the next draft answers each first"

[[field]]
name = "prepared_by"
label = "Prepared by"
type = "member"
help = "Who made the draft that went to review: the move to review says so"

[[field]]
name = "reviewed_by"
label = "Reviewed by"
type = "member"

[[field]]
name = "reviewed_on"
label = "Reviewed on"
type = "date"

[[field]]
name = "t183_signed_on"
label = "Client authorised filing (T183) on"
type = "date"

[[field]]
name = "t183_how"
label = "How the client authorised it"
type = "choice"
choices = ["portal", "paper", "email"]
labels = { portal = "Signed on the portal", paper = "Signed on paper", email = "Signed form by email" }

[[field]]
name = "efile_confirmation"
label = "EFILE confirmation number"
type = "string"
help = "The CRA's confirmation number, copied from the firm's tax software once the return was accepted: the hub transmits nothing and never makes one up"

[[field]]
name = "filed_on"
label = "Filed on"
type = "date"
help = "The day the return was transmitted from the firm's tax software and accepted by the CRA"

[[field]]
name = "filed_by"
label = "Filing recorded by"
type = "member"
help = "The partner who signed for the filing"

[[field]]
name = "noa_date"
label = "Notice of assessment dated"
type = "date"

[[field]]
name = "noa_received"
label = "Notice of assessment received"
type = "boolean"

[[field]]
name = "assessed_refund"
label = "Assessed refund (negative: owing)"
type = "decimal"
scale = 2

[[field]]
name = "assessed_taxable_income"
label = "Assessed taxable income"
type = "decimal"
scale = 2

[[field]]
name = "assessment_notes"
label = "Assessment: what differs and what was done"
type = "text"

[[field]]
name = "note"
label = "Note"
type = "text"

[[signature]]
meaning = "I reviewed this return and it is ready for the client"
roles = ["manager", "partner"]
states = ["in-review"]

[[signature]]
meaning = "I authorise filing this return with the CRA"
roles = ["partner"]
states = ["client-signed"]

[lifecycle]
field = "status"
initial = "gathering"
# What was reviewed is what the client authorises and what is filed: from the review on, people change nothing on the
# return but its state (a move still writes what it asks for). "Back with review points" and "Reopen for changes" are
# the ways back.
locked = ["in-review", "client-approval", "with-client", "t183-overdue", "client-signed", "filing", "filed", "assessment-differs", "assessed", "withdrawn"]
# Its work cancelled while the filing it recorded is being checked, it waits for a partner again; cancelled while an
# assessment that differs is being looked at, it stays there.
abandoned = { filing = "client-signed", assessment-differs = "assessment-differs" }

[[lifecycle.transition]]
from = ["gathering", "reminded"]
to = "comparing"
label = "Start preparing"

[[lifecycle.transition]]
from = ["preparing"]
to = "in-review"
label = "Ready for review"
asks = ["total_income", "taxable_income", "tax_deducted", "net_refund", "flags", "draft_summary"]
requires = ["total_income", "net_refund", "draft_summary"]
stamp = ["prepared_by"]

[[lifecycle.transition]]
from = ["in-review"]
to = "client-approval"
label = "Approve the review"
# the reviewer approves the figures as drafted, or sends them back: a review does not change them
asks = ["review_notes"]
sign = "I reviewed this return and it is ready for the client"
stamp = ["reviewed_by", "reviewed_on"]

# Not ready: back to be compared and drafted again, with what the next draft must answer.
[[lifecycle.transition]]
from = ["in-review"]
to = "comparing"
label = "Back with review points"
asks = ["review_points"]
requires = ["review_points"]

[[lifecycle.transition]]
from = ["with-client", "t183-overdue"]
to = "client-signed"
label = "Record the client's authorisation (T183)"
asks = ["t183_signed_on", "t183_how"]
requires = ["t183_signed_on", "t183_how"]

# The hub does not transmit: the partner files from the firm's tax software first, then records it here.
[[lifecycle.transition]]
from = ["client-signed"]
to = "filing"
label = "Record the filing"
sign = "I authorise filing this return with the CRA"
asks = ["efile_confirmation", "filed_on"]
requires = ["efile_confirmation", "filed_on"]
stamp = ["filed_by"]
confirm = "The hub sends nothing to the CRA. Sign only once the return has been transmitted from the firm's tax software and accepted: you are recording the CRA's confirmation number and the date it was filed."
# the client's authorisation is a precondition, not something this move asks for (and so could overwrite)
[[lifecycle.transition.check]]
must = "record.t183_signed_on != null"
message = "the client's authorisation (T183) is not on the return"

# The way back once the review is signed: the return is compared and drafted again from the slips on file, and needs
# the review signature and the client's authorisation (T183) again before it can be filed. Whoever holds the work
# where it waits makes the move; a slip that comes late makes it too (the slip's own run).
[[lifecycle.transition]]
from = ["with-client", "t183-overdue", "client-signed"]
to = "comparing"
label = "Reopen for changes"
comment = true

# A slip that came after the review, before a person could reopen it: only the slip's run makes this move (in review,
# it goes back with the slip as its review point).
[[lifecycle.transition]]
from = ["client-approval"]
to = "comparing"
by = "workflow"
label = "Back for a slip that came late"

[[lifecycle.transition]]
from = ["filed"]
to = "assessed"
label = "Record the notice of assessment"
asks = ["noa_date", "assessed_refund", "assessed_taxable_income"]
requires = ["noa_date", "assessed_refund"]

[[lifecycle.transition]]
from = ["organizer", "gathering", "chasing", "reminded", "slips-missing", "comparing", "preparing", "in-review", "client-approval", "with-client", "t183-overdue", "client-signed"]
to = "withdrawn"
label = "Withdraw (no return to file)"
asks = ["note"]
requires = ["note"]
