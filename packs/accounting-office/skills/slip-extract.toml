id = "slip-extract"
title = "Read a tax slip or notice"
instructions = """
Read the document: its words are the slip's text, read from its file. A slip that is a photo has no text: if you are
shown the picture, first write its words in `text`, as printed, line by line, each box with its number, then read the
slip from what you wrote; leave out what you cannot make out, and if that is the slip, the year or an amount,
escalate. When the slip has text, leave `text` empty. Read which slip it is (T4, T5, an RRSP receipt, a notice of assessment...),
the tax year, who issued it, the main amount (employment income on a T4, box 14; interest on a T5, box 13; the
contribution or donation; on a notice of assessment, the refund, negative if the client owes), the income tax deducted,
and every other box by its number. Copy numbers exactly as printed; never compute or guess one. The slip and the
year are read from the text too, never guessed (the main box, and box 22 on a T4, T4A or T4E, the income tax deducted,
go in the amount and the tax deducted, not in the other boxes): a document that does not say which slip it is, or for which year, one
you cannot read, or one that is for someone else, is escalated to a person.
"""

[[output]]
name = "slip_type"
label = "Slip"
type = "choice"
choices = ["T4", "T4A", "T4A-P", "T4A-OAS", "T4E", "T5", "T3", "T5008", "T2202", "RRSP", "donation", "medical", "childcare", "business-income", "NOA", "other"]
required = true

[[output]]
name = "year"
label = "Tax year"
type = "number"
required = true

[[output]]
name = "issuer"
label = "Issued by"
type = "string"

[[output]]
name = "amount"
label = "Amount"
type = "decimal"
scale = 2
required = true

[[output]]
name = "tax_deducted"
label = "Tax deducted"
type = "decimal"
scale = 2

[[output]]
name = "boxes"
label = "Other boxes"
type = "text"
help = "one a line, as `box: amount`, e.g. 16: 1250.00; on a notice of assessment also 26000 (taxable income) and date"

[[output]]
name = "text"
label = "Words of the document"
type = "text"
help = "only for a slip with no text whose picture you are shown: its words as printed, line by line; otherwise empty"

[[output]]
name = "summary"
type = "text"
required = true
